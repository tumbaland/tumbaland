services:
  mongodb:
    image: mongo:8.0.9
    container_name: tumbaland-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: tumbaland
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - tumbaland-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: mongod --auth

  mongo-express:
    image: mongo-express:1.0.2
    container_name: tumbaland-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpassword
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: adminpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:adminpassword@mongodb:27017/    
    networks:
      - tumbaland-network

  mariadb:
    image: mariadb:11.7.2
    container_name: tumbaland-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: tumbaland
      MYSQL_USER: tumbaland_user
      MYSQL_PASSWORD: tumbaland_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - tumbaland-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: tumbaland-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
      MYSQL_ROOT_PASSWORD: rootpassword123
    networks:
      - tumbaland-network

  redis:
    image: redis:8.0.1
    container_name: tumbaland-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispassword123
    volumes:
      - redis_data:/data
    networks:
      - tumbaland-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tumbaland-redis-ui
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: redis:redis:6379:0:redispassword123
      HTTP_USER: admin
      HTTP_PASSWORD: redisui123
    networks:
      - tumbaland-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  tumbaland-network:
    driver: bridge
