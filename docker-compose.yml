services:
  # Frontend apps
  album-front:
    build:
      context: ./apps/frontend/album-front
      dockerfile: Dockerfile
      args:
        VITE_ALBUM_API_URL: ${VITE_ALBUM_API_URL}
        VITE_FILE_API_URL: ${VITE_FILE_API_URL}
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}
        VITE_AUTH_FRONT_URL: ${VITE_AUTH_FRONT_URL}
        NODE_ENV: production
    image: album-front:latest
    restart: unless-stopped
    ports:
      - "3002:80"

  auth-front:
    build:
      context: ./apps/frontend/auth-front
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}
        NODE_ENV: production
    image: auth-front:latest
    restart: unless-stopped
    ports:
      - "3004:80"

  finance-front:
    build:
      context: ./apps/frontend/finance-front
      dockerfile: Dockerfile
      args:
        VITE_FINANCE_API_URL: ${VITE_FINANCE_API_URL}
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}
        VITE_AUTH_FRONT_URL: ${VITE_AUTH_FRONT_URL}
        NODE_ENV: production
    image: finance-front:latest
    restart: unless-stopped
    ports:
      - "3003:80"

  shell-front:
    build:
      context: ./apps/frontend/shell-front
      dockerfile: Dockerfile
      args:
        VITE_RELATIONSHIP_URL: ${VITE_RELATIONSHIP_URL}
        VITE_ALBUM_URL: ${VITE_ALBUM_URL}
        VITE_FINANCE_URL: ${VITE_FINANCE_URL}
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL}
        NODE_ENV: production
    image: shell-front:latest
    restart: unless-stopped
    ports:
      - "3000:80"

  relationship-front:
    build:
      context: ./apps/frontend/relationship-front
      dockerfile: Dockerfile
      args:
        VITE_RELATIONSHIP_API_URL: ${VITE_RELATIONSHIP_API_URL}
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}
        VITE_AUTH_FRONT_URL: ${VITE_AUTH_FRONT_URL}
        NODE_ENV: production
    image: relationship-front:latest
    restart: unless-stopped
    ports:
      - "3001:80"

  # Backend apps
  public-service:
    build:
      context: ./apps/backend/public-service
      dockerfile: Dockerfile
    image: public-service:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production

  album-service:
    build:
      context: ./apps/backend/album-service
      dockerfile: Dockerfile
    image: album-service:latest
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - FILE_API_URL=${FILE_API_URL}

  auth-service:
    build:
      context: ./apps/backend/auth-service
      dockerfile: Dockerfile
    image: auth-service:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - AUTHORIZED_EMAILS=${AUTHORIZED_EMAILS}

  file-service:
    build:
      context: ./apps/backend/file-service
      dockerfile: Dockerfile
    image: file-service:latest
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID}
      - GOOGLE_CLOUD_BUCKET_NAME=${GOOGLE_CLOUD_BUCKET_NAME}
      - GOOGLE_CLOUD_KEY_FILE_BASE64=${GOOGLE_CLOUD_KEY_FILE_BASE64}
      - FILE_CACHE_DIR=./cache
      - CACHE_MAX_AGE=864000000
      - CACHE_MAX_SIZE=1073741824
      - CORS_ORIGIN=${CORS_ORIGIN}

  finance-service:
    build:
      context: ./apps/backend/finance-service
      dockerfile: Dockerfile
    image: finance-service:latest
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}

  relationship-service:
    build:
      context: ./apps/backend/relationship-service
      dockerfile: Dockerfile
    image: relationship-service:latest
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}

  tumbaland-proxy:
    build:
      context: ./apps/infra/tumbaland-proxy
      dockerfile: Dockerfile
    image: tumbaland-proxy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/infra/tumbaland-proxy/certs/live:/etc/letsencrypt/live
      - ./apps/infra/tumbaland-proxy/certs/archive:/etc/letsencrypt/archive
      - ./apps/infra/tumbaland-proxy/certs/renewal:/etc/letsencrypt/renewal
      - ./apps/infra/tumbaland-proxy/html:/usr/share/nginx/html
    depends_on:
      - album-front
      - album-service
      - auth-front
      - auth-service
      - file-service
      - finance-front
      - finance-service
      - shell-front
      - relationship-front
      - relationship-service
      - public-service
