# Cuts a release: bumps the version, writes the changelog entry, tags it.
#
# Run deliberately, not on every push. Firing on push made the version a count
# of commits rather than a statement about the software — every merge produced
# a patch bump, a bot commit and a tag, so the history carried a release for
# each change and the number said nothing about what had actually changed.
#
# Normally run as a stage of release.yml, which builds the images right after.
# Run on its own, the tag it pushes starts nothing else: a tag pushed from a
# workflow does not trigger other workflows.

name: Conventional Changelog & Tag

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Explicit version (e.g. 1.1.0) or patch|minor|major. Leave empty to derive from the commits.'
        required: false
        type: string
  workflow_call:
    inputs:
      release-as:
        required: false
        type: string
    outputs:
      version:
        description: 'The version this run released, without the tag prefix'
        value: ${{ jobs.changelog.outputs.version }}

permissions:
  contents: write

# Serializes releases instead of racing: without this, two runs close together
# can both read the same starting version, both compute the same next version,
# and collide creating the same tag.
concurrency:
  group: changelog-release
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The branch tip, not the commit the run was dispatched from: as a
          # stage of release.yml, the library publishes before it have
          # committed to the branch since.
          ref: ${{ github.ref_name }}

      - name: Set git user
        run: |
          git config --global user.name "Tumbabot"
          git config --global user.email "bot@tumbaland.eu"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Copy .versionrc.json from .github to workflow directory
        run: cp .github/.versionrc.json "$GITHUB_WORKSPACE/.versionrc.json"

      - name: Run commit-and-tag-version
        id: release
        env:
          RELEASE_AS: ${{ inputs.release-as }}
        run: |
          if [ -n "$RELEASE_AS" ]; then
            npx commit-and-tag-version --release-as "$RELEASE_AS"
          else
            npx commit-and-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Released $VERSION"

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push --tags origin

      - name: Summary
        run: |
          {
            echo "### Released \`app-v${{ steps.release.outputs.version }}\`"
            echo ""
            echo "See CHANGELOG.md for what went in."
          } >> "$GITHUB_STEP_SUMMARY"
