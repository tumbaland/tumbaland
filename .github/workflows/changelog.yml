name: Conventional Changelog & Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install conventional-changelog-cli
        run: npm install -g conventional-changelog-cli

      - name: Bump version and create new tag (locally, do not push yet)
        id: version_bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          latest_tag=$(git tag --sort=-v:refname | head -n1 || echo "v0.0.0")
          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"
          commits=$(git log "$latest_tag"..HEAD --pretty=%B)
          bump=patch
          if echo "$commits" | grep -qE '^feat|^feature'; then bump=minor; fi
          if echo "$commits" | grep -qE 'BREAKING CHANGE|!:'; then bump=major; fi
          if [ "$bump" = "major" ]; then major=$((major+1)); minor=0; patch=0;
          elif [ "$bump" = "minor" ]; then minor=$((minor+1)); patch=0;
          else patch=$((patch+1)); fi
          new_version="$major.$minor.$patch"
          new_tag="v$new_version"
          if [ "$new_tag" != "$latest_tag" ]; then
            git tag "$new_tag"
            echo "Bumped $latest_tag -> $new_tag ($bump)"
          else
            echo "No version bump needed."
          fi
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: Generate changelog (compare previous to new tag)
        run: |
          new_tag="${{ steps.version_bump.outputs.new_tag }}"
          latest_tag="${{ steps.version_bump.outputs.latest_tag }}"
          tags=($(git tag --sort=-v:refname))
          previous_tag="${tags[-2]:-}"
          if [ -n "$previous_tag" ]; then
            from_tag=$previous_tag
          else
            from_tag="v0.0.0"
          fi
          # Generate changelog from previous tag to new tag
          conventional-changelog -p angular -i CHANGELOG.md -s --from-tag $from_tag --to-tag $new_tag

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG.md"
          git push

      - name: Push new tag
        run: |
          new_tag="${{ steps.version_bump.outputs.new_tag }}"
          latest_tag="${{ steps.version_bump.outputs.latest_tag }}"
          if [ "$new_tag" != "$latest_tag" ]; then
            git push origin "$new_tag"
          fi
