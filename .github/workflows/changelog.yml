name: Conventional Changelog & Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name "Tumbabot"
          git config --global user.email "bot@tumbaland.eu"

      - name: Copy .versionrc.json from .github to workflow directory
        run: |
          cp .github/.versionrc.json $GITHUB_WORKSPACE/.versionrc.json

      - name: Run standard-version
        run: npx standard-version

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --follow-tags origin main
