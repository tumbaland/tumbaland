name: Conventional Changelog & Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serializes releases instead of racing: without this, two pushes to main close
# together can both read the same starting version, both compute the same next
# version, and collide creating/pushing the same tag.
concurrency:
  group: changelog-release
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name "Tumbabot"
          git config --global user.email "bot@tumbaland.eu"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Copy .versionrc.json from .github to workflow directory
        run: |
          cp .github/.versionrc.json $GITHUB_WORKSPACE/.versionrc.json

      - name: Run standard-version
        run: npx standard-version

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin main
          git push --tags origin
