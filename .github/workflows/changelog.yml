name: Generate and Commit Changelog


on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for full git history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install conventional-changelog-cli and angular preset
        run: npm install -g conventional-changelog-cli conventional-changelog-angular


      - name: Bump version and prepare new tag (no tag creation yet)
        id: version_bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          # Get latest tag (vX.Y.Z or v0.0.0 if none)
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"

          # Get commits since last tag
          commits=$(git log "$latest_tag"..HEAD --pretty=%B)

          bump=patch
          if echo "$commits" | grep -qE '^feat|^feature'; then
            bump=minor
          fi
          if echo "$commits" | grep -qE 'BREAKING CHANGE|!:'; then
            bump=major
          fi

          # Bump version
          if [ "$bump" = "major" ]; then
            major=$((major+1)); minor=0; patch=0
          elif [ "$bump" = "minor" ]; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          new_version="$major.$minor.$patch"
          new_tag="v$new_version"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "version=$new_version" >> $GITHUB_OUTPUT


      - name: Generate or update CHANGELOG.md (before tag)
        run: |
          new_tag="${{ steps.version_bump.outputs.new_tag }}"
          latest_tag="${{ steps.version_bump.outputs.latest_tag }}"
          previous_tag=$(git tag --sort=-creatordate | grep -v "^$latest_tag$" | head -n1 || echo "")
          if [ -n "$previous_tag" ]; then
            from_tag=$previous_tag
          else
            from_tag="v0.0.0"
          fi
          # Generate changelog from previous tag to HEAD (unreleased)
          conventional-changelog -p angular -i CHANGELOG.md -s --from-tag $from_tag --to-ref HEAD
          sed -i '/^# \[/!b;n;/^$/d' CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG.md"
          git push

      - name: Create and push new tag (after changelog commit)
        if: steps.version_bump.outputs.new_tag != steps.version_bump.outputs.latest_tag
        run: |
          git tag "${{ steps.version_bump.outputs.new_tag }}"
          git push origin "${{ steps.version_bump.outputs.new_tag }}"
          echo "Bumped ${{ steps.version_bump.outputs.latest_tag }} -> ${{ steps.version_bump.outputs.new_tag }}"

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG.md"
          git push
