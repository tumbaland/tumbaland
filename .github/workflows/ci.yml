name: CI

# Pull requests only, and the only place the suites run. main takes nothing but
# merges of a pull request whose `ci-passed` check is green (the ruleset in
# .github/rulesets/main.json), so release.yml builds and deploys what lands
# there without testing it a second time.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure every workspace has CI coverage
        run: node .github/scripts/validate-ci-matrix.js

  # Deployed images install the libs from npm, so a consumer left on an older
  # pinned version silently compiles against stale typings inside Docker's
  # cached npm-install layer. Catch that drift here, not in a failed deploy.
  lib-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspaces pin the current lib versions
        run: node scripts/sync-lib-versions.mjs --check

  # Whole-repo lint in one pass. Doesn't need built libs (no type-aware
  # lint rules), so it runs standalone and stays cheap regardless of how
  # many workspaces a change touches - this is what used to fan out into
  # a full lint-typecheck matrix run for every workspace whenever
  # the lint config changed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.set-matrix.outputs.workspaces }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root-shared: &root-shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            backend-libs-changed: &backend-libs-changed
              - 'libs/backend-core/**'
            frontend-libs-changed: &frontend-libs-changed
              - 'libs/frontend-core/**'
            apps/backend/album-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/album-service/**'
            apps/backend/auth-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/auth-service/**'
            apps/backend/chat-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/chat-service/**'
            apps/backend/file-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/file-service/**'
            apps/backend/finance-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/finance-service/**'
            apps/backend/group-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/group-service/**'
            apps/backend/mcp-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/mcp-service/**'
            apps/backend/payment-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/payment-service/**'
            apps/backend/public-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/public-service/**'
            apps/backend/relationship-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/relationship-service/**'
            apps/frontend/account-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/account-front/**'
            apps/frontend/album-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/album-front/**'
            apps/frontend/auth-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/auth-front/**'
            apps/frontend/chat-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/chat-front/**'
            apps/frontend/finance-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/finance-front/**'
            apps/frontend/group-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/group-front/**'
            apps/frontend/payment-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/payment-front/**'
            apps/frontend/relationship-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/relationship-front/**'
            apps/frontend/shell-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/shell-front/**'
            libs/backend-core:
              - *root-shared
              - 'libs/backend-core/**'
            libs/frontend-core:
              - *root-shared
              - 'libs/frontend-core/**'
            e2e:
              - *root-shared
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'apps/frontend/**'
              - 'libs/frontend-core/**'

      - name: Build workspace matrix
        id: set-matrix
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(startswith("apps/") or startswith("libs/")))')" >> "$GITHUB_OUTPUT"

  build-libs:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared libs
        # Order matters: components imports from frontend-core, so frontend-core
        # must be built (its dist/.d.ts emitted) before components typechecks.
        run: npm run build -w @tumbaland/backend-core -w @tumbaland/frontend-core

      # Split into a backend and a frontend artifact so each verify job pulls
      # only the libs its workspace actually consumes, instead of every job
      # downloading all three lib dists regardless of what it builds.
      - name: Upload built backend lib
        uses: actions/upload-artifact@v4
        with:
          name: libs-dist-backend
          path: libs/backend-core/dist
          retention-days: 1

      - name: Upload built frontend libs
        uses: actions/upload-artifact@v4
        with:
          name: libs-dist-frontend
          path: |
            libs/frontend-core/dist
          retention-days: 1

  # Typecheck + test + build for each touched workspace, combined into one
  # job per workspace instead of three (they used to be separate matrix
  # jobs, each paying its own checkout/npm-ci/artifact-download overhead
  # for the same workspace).
  verify:
    needs: [changes, build-libs]
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Backend services and backend-core consume only backend-core/dist;
      # frontend apps and the frontend libs consume only components/dist and
      # frontend-core/dist. Each job downloads just its side.
      - name: Download backend lib
        if: startsWith(matrix.workspace, 'apps/backend/') || matrix.workspace == 'libs/backend-core'
        uses: actions/download-artifact@v4
        with:
          name: libs-dist-backend
          path: libs/backend-core/dist

      - name: Download frontend libs
        if: startsWith(matrix.workspace, 'apps/frontend/') || matrix.workspace == 'libs/frontend-core'
        uses: actions/download-artifact@v4
        with:
          name: libs-dist-frontend
          path: libs

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

      - name: Test
        run: npm run test:coverage --workspace=${{ matrix.workspace }} --if-present

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }} --if-present

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run frontend smoke e2e tests
        run: npm run test:e2e

  # The one check the ruleset requires, so that adding a job or a workspace
  # never means editing the ruleset.
  #
  # `always()` is the point: a job whose needs failed is skipped, and a skipped
  # required check counts as passed. Run regardless, and fail on anything that
  # failed or was cancelled. A needed job that was skipped on purpose (no
  # workspace changed, so no matrix) is fine.
  ci-passed:
    if: always()
    needs: [validate-matrix, lib-versions, lint, changes, build-libs, verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | jq -e 'any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::A CI job failed or was cancelled."
            exit 1
          fi
