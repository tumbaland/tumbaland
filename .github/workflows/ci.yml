name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure every workspace has CI coverage
        run: node .github/scripts/validate-ci-matrix.js

  # Whole-repo lint in one pass. Doesn't need built libs (no type-aware
  # lint rules), so it runs standalone and stays cheap regardless of how
  # many workspaces a change touches - this is what used to fan out into
  # a full lint-typecheck matrix run for every workspace whenever
  # eslint.config.mjs changed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.set-matrix.outputs.workspaces }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root-shared: &root-shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            backend-libs-changed: &backend-libs-changed
              - 'libs/backend-core/**'
            frontend-libs-changed: &frontend-libs-changed
              - 'libs/frontend-core/**'
              - 'libs/components/**'
            apps/backend/album-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/album-service/**'
            apps/backend/auth-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/auth-service/**'
            apps/backend/file-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/file-service/**'
            apps/backend/finance-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/finance-service/**'
            apps/backend/group-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/group-service/**'
            apps/backend/payment-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/payment-service/**'
            apps/backend/public-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/public-service/**'
            apps/backend/relationship-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/relationship-service/**'
            apps/frontend/account-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/account-front/**'
            apps/frontend/album-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/album-front/**'
            apps/frontend/auth-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/auth-front/**'
            apps/frontend/finance-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/finance-front/**'
            apps/frontend/group-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/group-front/**'
            apps/frontend/payment-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/payment-front/**'
            apps/frontend/relationship-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/relationship-front/**'
            apps/frontend/shell-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/shell-front/**'
            libs/backend-core:
              - *root-shared
              - 'libs/backend-core/**'
            libs/components:
              - *root-shared
              - 'libs/components/**'
            libs/frontend-core:
              - *root-shared
              - 'libs/frontend-core/**'
              - 'libs/components/**'
            e2e:
              - *root-shared
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'apps/frontend/**'
              - 'libs/frontend-core/**'
              - 'libs/components/**'

      - name: Build workspace matrix
        id: set-matrix
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(startswith("apps/") or startswith("libs/")))')" >> "$GITHUB_OUTPUT"

  build-libs:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libs
        # Order matters: components imports from frontend-core, so frontend-core
        # must be built (its dist/.d.ts emitted) before components typechecks.
        run: npm run build -w @tumbaland/backend-core -w @tumbaland/frontend-core -w @tumbaland/components

      - name: Upload built libs
        uses: actions/upload-artifact@v4
        with:
          name: libs-dist
          path: |
            libs/backend-core/dist
            libs/components/dist
            libs/frontend-core/dist
          retention-days: 1

  # Typecheck + test + build for each touched workspace, combined into one
  # job per workspace instead of three (they used to be separate matrix
  # jobs, each paying its own checkout/npm-ci/artifact-download overhead
  # for the same workspace).
  verify:
    needs: [changes, build-libs]
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download built libs
        uses: actions/download-artifact@v4
        with:
          name: libs-dist
          path: libs

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

      - name: Test
        run: npm run test:coverage --workspace=${{ matrix.workspace }} --if-present

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }} --if-present

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run frontend smoke e2e tests
        run: npm run test:e2e
