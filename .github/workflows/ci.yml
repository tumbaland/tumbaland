name: CI

# Pull requests only, and the only place the suites run. main takes nothing but
# merges of a pull request whose `ci-passed` check is green (the ruleset in
# .github/rulesets/main.json), so release.yml builds and deploys what lands
# there without testing it a second time.
#
# Everything that happens to a pull request is a job in this one workflow, so
# that a PR is one row per event in the Actions list and not one per workflow:
# the title check and the merge used to be files of their own.
#
# Editing a title or a description is deliberately not an event here. It would
# start a whole run for a typo, and the suites cannot be skipped on it: a run
# that skipped them would report `ci-passed` green over a failing commit. A
# title fixed after the check failed is picked up by re-running that job, which
# reads the title as it is now (see pr-title).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# There is no end-to-end job. The smoke suite under e2e/ (`npm run test:e2e`) still
# runs locally. In CI it took over three minutes to check that each app shows its
# heading, and on the hosted runner it was cancelled at the moment the first browser
# opened in three runs of seven, which with `ci-passed` gating the merge meant a
# flaky red on a quarter of pull requests. Whether the deployed apps come up is a
# question for the release, not for a test against nine dev servers on a 2-core box.

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure every workspace has CI coverage
        run: node .github/scripts/validate-ci-matrix.js

  # Deployed images install the libs from npm, so a consumer left on an older
  # pinned version silently compiles against stale typings inside Docker's
  # cached npm-install layer. Catch that drift here, not in a failed deploy.
  lib-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspaces pin the current lib versions
        run: node scripts/sync-lib-versions.mjs --check

      # Every app builds from one of the two shared Dockerfiles with a few
      # arguments from docker/services.json; a new app without them would build
      # an image that cannot start.
      - name: Check every app is described for its image
        run: node scripts/image-build.mjs --check

      - name: Test the release and image scripts
        run: node --test scripts/*.test.mjs

  # Whole-repo lint in one pass. Doesn't need built libs (no type-aware
  # lint rules), so it runs standalone and stays cheap regardless of how
  # many workspaces a change touches - this is what used to fan out into
  # a full lint-typecheck matrix run for every workspace whenever
  # the lint config changed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.set-matrix.outputs.workspaces }}
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root-shared: &root-shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'docker/**'
              - '.dockerignore'
              - 'scripts/image-build.mjs'
            backend-libs-changed: &backend-libs-changed
              - 'libs/backend-core/**'
            frontend-libs-changed: &frontend-libs-changed
              - 'libs/frontend-core/**'
            apps/backend/album-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/album-service/**'
            apps/backend/auth-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/auth-service/**'
            apps/backend/chat-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/chat-service/**'
            apps/backend/file-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/file-service/**'
            apps/backend/finance-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/finance-service/**'
            apps/backend/group-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/group-service/**'
            apps/backend/mcp-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/mcp-service/**'
            apps/backend/payment-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/payment-service/**'
            apps/backend/public-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/public-service/**'
            apps/backend/relationship-service:
              - *root-shared
              - *backend-libs-changed
              - 'apps/backend/relationship-service/**'
            apps/frontend/account-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/account-front/**'
            apps/frontend/album-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/album-front/**'
            apps/frontend/auth-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/auth-front/**'
            apps/frontend/chat-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/chat-front/**'
            apps/frontend/finance-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/finance-front/**'
            apps/frontend/group-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/group-front/**'
            apps/frontend/payment-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/payment-front/**'
            apps/frontend/relationship-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/relationship-front/**'
            apps/frontend/shell-front:
              - *root-shared
              - *frontend-libs-changed
              - 'apps/frontend/shell-front/**'
            libs/backend-core:
              - *root-shared
              - 'libs/backend-core/**'
            libs/frontend-core:
              - *root-shared
              - 'libs/frontend-core/**'

      - name: Build workspace matrix
        id: set-matrix
        run: |
          echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(startswith("apps/") or startswith("libs/")))')" >> "$GITHUB_OUTPUT"
          echo "apps=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(startswith("apps/")) | split("/")[-1])')" >> "$GITHUB_OUTPUT"

  build-libs:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared libs
        # Order matters: components imports from frontend-core, so frontend-core
        # must be built (its dist/.d.ts emitted) before components typechecks.
        run: npm run build -w @tumbaland/backend-core -w @tumbaland/frontend-core

      # Split into a backend and a frontend artifact so each verify job pulls
      # only the lib its workspace actually consumes, instead of every job
      # downloading both lib dists regardless of what it builds.
      - name: Upload built backend lib
        uses: actions/upload-artifact@v4
        with:
          name: libs-dist-backend
          path: libs/backend-core/dist
          retention-days: 1

      - name: Upload built frontend lib
        uses: actions/upload-artifact@v4
        with:
          name: libs-dist-frontend
          path: libs/frontend-core/dist
          retention-days: 1

  # Typecheck + test + build for each touched workspace, combined into one
  # job per workspace instead of three (they used to be separate matrix
  # jobs, each paying its own checkout/npm-ci/artifact-download overhead
  # for the same workspace).
  verify:
    needs: [changes, build-libs]
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Backend services and backend-core consume only backend-core/dist;
      # frontend apps and frontend-core consume only frontend-core/dist. Each
      # job downloads just its side.
      - name: Download backend lib
        if: startsWith(matrix.workspace, 'apps/backend/') || matrix.workspace == 'libs/backend-core'
        uses: actions/download-artifact@v4
        with:
          name: libs-dist-backend
          path: libs/backend-core/dist

      # The artifact holds the contents of one directory, so it has to go back
      # into that directory. It was `path: libs` while the upload held two
      # libs, which kept their `libs/<name>/dist` prefix; with one left the
      # prefix is gone and every frontend typecheck failed on a missing module.
      - name: Download frontend lib
        if: startsWith(matrix.workspace, 'apps/frontend/') || matrix.workspace == 'libs/frontend-core'
        uses: actions/download-artifact@v4
        with:
          name: libs-dist-frontend
          path: libs/frontend-core/dist

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

      - name: Test
        run: npm run test:coverage --workspace=${{ matrix.workspace }} --if-present

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }} --if-present

  # Builds the image of every touched app exactly as the release will, minus the
  # push. Until this existed, an image was first built after the merge, so a
  # change that only breaks inside the image (a dependency the image installs
  # differently, a binary for the wrong platform) was found by the deploy.
  # The Pi is ARM and the release builds there natively, so this does too.
  images:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.apps) }}
    name: image (${{ matrix.service }})
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the build
        id: build
        run: node scripts/image-build.mjs "${{ matrix.service }}" --version "0.0.0-ci" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.build.outputs.context }}
          file: ${{ steps.build.outputs.file }}
          push: false
          build-args: ${{ steps.build.outputs.build-args }}
          # Read the layers the release pushed, write nothing: a pull request
          # should not evict what main built.
          cache-from: type=gha,scope=${{ matrix.service }}

  # The title of a pull request is the commit that lands on main: it is squash
  # merged, and the subject is what the version bump and CHANGELOG.md are built
  # from. A title that is not a conventional commit makes a changelog line
  # nobody can read, so it is checked before the merge instead of fixed after.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Title is a conventional commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read now, not from the event: a re-run replays the event as it was
          # when the run started, which would keep failing on a title that has
          # since been fixed. Held in a variable, never interpolated into the
          # script: a title is text anyone with a branch can write.
          TITLE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .title)
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf)(\([^)]+\))?!?: .+'; then
            echo "::error::PR title must be a conventional commit, e.g. 'fix(finance-service): correct snapshot rounding'. Types: feat, fix, docs, style, refactor, test, chore, perf. Fix the title, then re-run this job."
            exit 1
          fi

  # Merges a pull request, but only once `ci-passed` is green.
  #
  # This job is the gate. The repository is private on a plan with no branch
  # protection, so GitHub itself will merge anything at any time and there is
  # no setting that makes it wait for a check. `gh pr merge --auto` does not
  # help: it only waits for requirements that exist, and with none it merges at
  # once, which is how two pull requests reached main before their tests had
  # finished. So the waiting is done here, with `needs: ci-passed`, and the merge
  # is plain, not `--auto`.
  #
  # Needs a token that is not the workflow's own. A merge made with
  # GITHUB_TOKEN starts no other workflows, which would merge the PR and then
  # never release it. A fine-grained personal access token (or a GitHub App
  # token) in the secret AUTO_MERGE_TOKEN, with Pull requests and Contents set
  # to read and write on this repository. Without it this does nothing and says
  # so: merge from the pull request by hand once CI is green.
  #
  # What it leaves for a person to merge, on purpose:
  #
  #   - a draft (marking it ready runs CI again, and this with it),
  #   - anything that touches apps/infra, which a release never deploys, so the
  #     order of "infrastructure first, then the apps" is yours to decide,
  #   - a breaking change (`feat!:` or a BREAKING CHANGE footer), for the same
  #     reason: it may need something done on the Pi before or after.
  #
  # To pause one that is already open, convert it to a draft.
  #
  # Runs at the end of every CI run of the pull request, so a push that was
  # superseded is not merged: a newer push cancels this run, and the head the
  # tests ran against is the only one `--match-head-commit` lets through.
  merge:
    needs: [ci-passed]
    # People who can already push here. Anyone else, and a fork, gets nothing
    # (a fork has no secrets to use anyway).
    if: >-
      github.event_name == 'pull_request' &&
      needs.ci-passed.result == 'success' &&
      !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Merge, squash
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::AUTO_MERGE_TOKEN is not set, so the pull request was not merged. Merge it by hand."
            exit 0
          fi

          # Read now, not from the event: the title can have been fixed since
          # the run started, and the body is what a breaking change is named in.
          PR=$(gh pr view "$PR_URL" --json title,body,state)
          if [ "$(echo "$PR" | jq -r .state)" != "OPEN" ]; then
            echo "::notice::Not open any more; nothing to merge."
            exit 0
          fi
          TITLE=$(echo "$PR" | jq -r .title)
          BODY=$(echo "$PR" | jq -r .body)

          if printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:' || printf '%s' "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo "::notice::Breaking change: left for a person to merge."
            exit 0
          fi

          INFRA=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' | grep -c '^apps/infra/' || true)
          if [ "$INFRA" -gt 0 ]; then
            echo "::notice::Touches apps/infra ($INFRA file(s)): left for a person to merge, after the infrastructure is deployed."
            exit 0
          fi

          # The subject is given rather than left to the repository's default
          # for a squash: it is what the version and changelog are built from.
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA" --subject "$TITLE (#$PR_NUMBER)"

  # The one check the ruleset requires, so that adding a job or a workspace
  # never means editing the ruleset. The title check is part of it.
  #
  # `always()` is the point: a job whose needs failed is skipped, and a skipped
  # required check counts as passed. Run regardless, and fail on anything that
  # failed or was cancelled. A needed job that was skipped on purpose (no
  # workspace changed, so no matrix) is fine.
  ci-passed:
    if: always()
    needs: [validate-matrix, lib-versions, lint, changes, build-libs, verify, images, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | jq -e 'any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::A CI job failed or was cancelled."
            exit 1
          fi
