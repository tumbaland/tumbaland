name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure every workspace has CI coverage
        run: node .github/scripts/validate-ci-matrix.js

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.set-matrix.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'playwright.config.ts'
              - 'e2e/**'
            libs-changed: &libs-changed
              - 'libs/**'
            apps/backend/album-service:
              - *shared
              - *libs-changed
              - 'apps/backend/album-service/**'
            apps/backend/auth-service:
              - *shared
              - *libs-changed
              - 'apps/backend/auth-service/**'
            apps/backend/file-service:
              - *shared
              - *libs-changed
              - 'apps/backend/file-service/**'
            apps/backend/finance-service:
              - *shared
              - *libs-changed
              - 'apps/backend/finance-service/**'
            apps/backend/group-service:
              - *shared
              - *libs-changed
              - 'apps/backend/group-service/**'
            apps/backend/payment-service:
              - *shared
              - *libs-changed
              - 'apps/backend/payment-service/**'
            apps/backend/public-service:
              - *shared
              - *libs-changed
              - 'apps/backend/public-service/**'
            apps/backend/relationship-service:
              - *shared
              - *libs-changed
              - 'apps/backend/relationship-service/**'
            apps/frontend/account-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/account-front/**'
            apps/frontend/album-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/album-front/**'
            apps/frontend/auth-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/auth-front/**'
            apps/frontend/finance-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/finance-front/**'
            apps/frontend/group-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/group-front/**'
            apps/frontend/payment-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/payment-front/**'
            apps/frontend/relationship-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/relationship-front/**'
            apps/frontend/shell-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/shell-front/**'
            libs/backend-core:
              - *shared
              - 'libs/backend-core/**'
            libs/components:
              - *shared
              - 'libs/components/**'
            libs/frontend-core:
              - *shared
              - 'libs/frontend-core/**'
              - 'libs/components/**'

      - name: Build workspace matrix
        id: set-matrix
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared" and . != "libs-changed"))')" >> "$GITHUB_OUTPUT"

  build-libs:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libs
        # Order matters: components imports from frontend-core, so frontend-core
        # must be built (its dist/.d.ts emitted) before components typechecks.
        run: npm run build -w @tumbaland/backend-core -w @tumbaland/frontend-core -w @tumbaland/components

      - name: Upload built libs
        uses: actions/upload-artifact@v4
        with:
          name: libs-dist
          path: |
            libs/backend-core/dist
            libs/components/dist
            libs/frontend-core/dist
          retention-days: 1

  lint-typecheck:
    needs: [changes, build-libs]
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download built libs
        uses: actions/download-artifact@v4
        with:
          name: libs-dist
          path: libs

      - name: Lint
        run: npm run lint --workspace=${{ matrix.workspace }}

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

  test:
    needs: [changes, build-libs]
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download built libs
        uses: actions/download-artifact@v4
        with:
          name: libs-dist
          path: libs

      - name: Test
        run: npm run test --workspace=${{ matrix.workspace }} --if-present

  e2e:
    needs: [changes, build-libs]
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke e2e tests
        run: npm run test:e2e

  build:
    needs: [changes, build-libs]
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download built libs
        uses: actions/download-artifact@v4
        with:
          name: libs-dist
          path: libs

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }} --if-present
