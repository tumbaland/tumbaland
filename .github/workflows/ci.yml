name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.set-matrix.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
            libs-changed: &libs-changed
              - 'libs/**'
            apps/backend/album-service:
              - *shared
              - *libs-changed
              - 'apps/backend/album-service/**'
            apps/backend/auth-service:
              - *shared
              - *libs-changed
              - 'apps/backend/auth-service/**'
            apps/backend/file-service:
              - *shared
              - *libs-changed
              - 'apps/backend/file-service/**'
            apps/backend/finance-service:
              - *shared
              - *libs-changed
              - 'apps/backend/finance-service/**'
            apps/backend/group-service:
              - *shared
              - *libs-changed
              - 'apps/backend/group-service/**'
            apps/backend/payment-service:
              - *shared
              - *libs-changed
              - 'apps/backend/payment-service/**'
            apps/backend/public-service:
              - *shared
              - *libs-changed
              - 'apps/backend/public-service/**'
            apps/backend/relationship-service:
              - *shared
              - *libs-changed
              - 'apps/backend/relationship-service/**'
            apps/frontend/account-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/account-front/**'
            apps/frontend/album-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/album-front/**'
            apps/frontend/auth-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/auth-front/**'
            apps/frontend/finance-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/finance-front/**'
            apps/frontend/group-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/group-front/**'
            apps/frontend/payment-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/payment-front/**'
            apps/frontend/relationship-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/relationship-front/**'
            apps/frontend/shell-front:
              - *shared
              - *libs-changed
              - 'apps/frontend/shell-front/**'
            libs/core:
              - *shared
              - 'libs/core/**'
            libs/components:
              - *shared
              - 'libs/components/**'

      - name: Build workspace matrix
        id: set-matrix
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared" and . != "libs-changed"))')" >> "$GITHUB_OUTPUT"

  lint-typecheck:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libs
        if: matrix.workspace != 'libs/core' && matrix.workspace != 'libs/components'
        run: npm run build -w @tumbaland/core -w @tumbaland/components -w @tumbaland/frontend-core

      - name: Lint
        run: npm run lint --workspace=${{ matrix.workspace }}

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

  test:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libs
        if: matrix.workspace != 'libs/core' && matrix.workspace != 'libs/components'
        run: npm run build -w @tumbaland/core -w @tumbaland/components -w @tumbaland/frontend-core

      - name: Test
        run: npm run test --workspace=${{ matrix.workspace }} --if-present

  build:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libs
        if: matrix.workspace != 'libs/core' && matrix.workspace != 'libs/components'
        run: npm run build -w @tumbaland/core -w @tumbaland/components -w @tumbaland/frontend-core

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }} --if-present
