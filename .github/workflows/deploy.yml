name: Build and Deploy Apps (Dynamic Matrix)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/relationship-front/**'
      - 'apps/frontend/album-front/**'
      - 'apps/frontend/finance-front/**'
      - 'apps/frontend/shell-front/**'
      - 'apps/frontend/auth-front/**'
      - 'apps/backend/relationship-service/**'
      - 'apps/backend/album-service/**'
      - 'apps/backend/auth-service/**'
      - 'apps/backend/file-service/**'
      - 'apps/backend/finance-service/**'
      - 'apps/backend/public-service/**'
      - 'apps/infra/tumbaland-proxy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated list of service names to redeploy (leave blank to redeploy all)'
        required: false
        default: ''

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed services and set matrix
        id: set-matrix
        run: |
          SERVICES='[
            {"name":"relationship-front","context":"./apps/frontend/relationship-front","dockerfile":"./apps/frontend/relationship-front/Dockerfile","path":"frontend"},
            {"name":"album-front","context":"./apps/frontend/album-front","dockerfile":"./apps/frontend/album-front/Dockerfile","path":"frontend"},
            {"name":"finance-front","context":"./apps/frontend/finance-front","dockerfile":"./apps/frontend/finance-front/Dockerfile","path":"frontend"},
            {"name":"shell-front","context":"./apps/frontend/shell-front","dockerfile":"./apps/frontend/shell-front/Dockerfile","path":"frontend"},
            {"name":"auth-front","context":"./apps/frontend/auth-front","dockerfile":"./apps/frontend/auth-front/Dockerfile","path":"frontend"},
            {"name":"album-service","context":"./apps/backend/album-service","dockerfile":"./apps/backend/album-service/Dockerfile","path":"backend"},
            {"name":"auth-service","context":"./apps/backend/auth-service","dockerfile":"./apps/backend/auth-service/Dockerfile","path":"backend"},
            {"name":"file-service","context":"./apps/backend/file-service","dockerfile":"./apps/backend/file-service/Dockerfile","path":"backend"},
            {"name":"finance-service","context":"./apps/backend/finance-service","dockerfile":"./apps/backend/finance-service/Dockerfile","path":"backend"},
            {"name":"public-service","context":"./apps/backend/public-service","dockerfile":"./apps/backend/public-service/Dockerfile","path":"backend"},
            {"name":"relationship-service","context":"./apps/backend/relationship-service","dockerfile":"./apps/backend/relationship-service/Dockerfile","path":"backend"},
            {"name":"tumbaland-proxy","context":"./apps/infra/tumbaland-proxy","dockerfile":"./apps/infra/tumbaland-proxy/Dockerfile","path":"infra"}
          ]'
          echo "$SERVICES" > all_services.json

          # If manual trigger, use input services
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.services }}" ]; then
            IFS=',' read -ra SELECTED <<< "${{ github.event.inputs.services }}"
            jq -c --argjson selected "[\"${SELECTED[@]}\"]" '.[] | select(.name as $n | $selected | index($n))' all_services.json | jq -s '{app: .}' > matrix.json
            echo "matrix=$(jq -c . matrix.json)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Normal change detection
          git fetch origin ${{ github.event.before }}
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "$CHANGED" > changed.txt
          CHANGED_SERVICES=()
          while IFS= read -r svc; do
            name=$(echo "$svc" | jq -r .name)
            path=$(echo "$svc" | jq -r .path)
            prefix="apps/$path/$name/"
            if grep -q "^$prefix" changed.txt; then
              CHANGED_SERVICES+=("$svc")
            fi
          done < <(jq -c '.[]' all_services.json)
          # If no changed services, check if workflow file changed, then build all
          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            if grep -q ".github/workflows/" changed.txt; then
              CHANGED_SERVICES=( $(jq -c '.[]' all_services.json) )
            fi
          fi
          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo 'matrix={"app":[]}' >> $GITHUB_OUTPUT
          else
            printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -s '{app: .}' > matrix.json
            echo "matrix=$(jq -c . matrix.json)" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '' && needs.detect-changes.outputs.matrix != '{"app":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.name }}:latest
          platforms: linux/arm64

  deploy:
    needs: build-and-push
    if: ${{ needs.detect-changes.outputs.matrix != '' && needs.detect-changes.outputs.matrix != '{"app":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: apps/${{ matrix.app.path }}/${{ matrix.app.name }}/compose.yml
          target: ~/tumbaland/apps/${{ matrix.app.path }}/${{ matrix.app.name }}/compose.yml
      - name: SSH and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/tumbaland
            sudo docker-compose --env-file .env -f apps/${{ matrix.app.path }}/${{ matrix.app.name }}/compose.yml up -d --pull always
