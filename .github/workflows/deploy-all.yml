name: Deploy All Services

run-name: Deploy All (${{ github.event.inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which services to deploy'
        required: true
        default: all
        type: choice
        options:
          - all
          - all-frontend
          - all-backend
      gap_seconds:
        description: 'Pause between each service deploy on the server (seconds)'
        required: false
        default: '20'
        type: string

jobs:
  # Resolve the list of services to (re)build and deploy from the chosen target.
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.compute.outputs.services_json }}
      services_list: ${{ steps.compute.outputs.services_list }}
    steps:
      - id: compute
        run: |
          FRONT="account-front album-front auth-front chat-front finance-front group-front payment-front relationship-front shell-front"
          BACK="album-service auth-service chat-service file-service finance-service group-service mcp-service payment-service public-service relationship-service"
          case "${{ github.event.inputs.target }}" in
            all)          SVCS="$FRONT $BACK" ;;
            all-frontend) SVCS="$FRONT" ;;
            all-backend)  SVCS="$BACK" ;;
          esac
          JSON=$(printf '%s\n' $SVCS | jq -R . | jq -cs .)
          echo "services_json=$JSON" >> "$GITHUB_OUTPUT"
          echo "services_list=$SVCS" >> "$GITHUB_OUTPUT"

  # Build + push every image in parallel. This never touches the server, so there is
  # no reason to serialize it — the slow part (image build) all happens at once.
  build:
    needs: set-matrix
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.set-matrix.outputs.services_json) }}
    steps:
      - uses: actions/checkout@v4

      # See release.yml: one Dockerfile per tier, built from the repository root.
      - name: Resolve the build
        id: build
        run: node scripts/image-build.mjs "${{ matrix.service }}" --version "$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.build.outputs.context }}
          file: ${{ steps.build.outputs.file }}
          push: true
          build-args: ${{ steps.build.outputs.build-args }}
          # `tumbaland-` prefix: the Docker Hub account is shared with visin, which
          # publishes its own group-service, auth-service, file-service, auth-front
          # and account-front. See deploy-single-service.yml for the full note.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tumbaland-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tumbaland-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Deploy to the server strictly one service at a time, with a pause between each,
  # so the server never has to stop/start more than one container at once.
  deploy:
    needs: [set-matrix, build]
    # Runs on the Pi itself: the runner dials out to GitHub, so the deploy needs
    # no inbound port at home. Replaces the old scp + ssh sequence, which depended
    # on the public IP being reachable.
    runs-on: [self-hosted, tumbaland-pi]
    # Shares the concurrency group with deploy-single-service so no two deploys
    # ever hit the server simultaneously.
    concurrency:
      group: tumbaland-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: bash .github/scripts/write-deploy-env.sh
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_ENCRYPTION_SECRET: ${{ secrets.API_KEY_ENCRYPTION_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_NATIVE_CLIENT_IDS: ${{ vars.GOOGLE_NATIVE_CLIENT_IDS }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GROUP_API_URL: ${{ vars.GROUP_API_URL }}
          GROUP_INTERNAL_URL: ${{ vars.GROUP_INTERNAL_URL }}
          ALBUM_API_URL: ${{ vars.ALBUM_API_URL }}
          ALBUM_INTERNAL_URL: ${{ vars.ALBUM_INTERNAL_URL }}
          AUTH_SERVICE_URL: ${{ vars.AUTH_SERVICE_URL }}
          AUTH_FRONT_URL: ${{ vars.AUTH_FRONT_URL }}
          FINANCE_API_URL: ${{ vars.FINANCE_API_URL }}
          FINANCE_INTERNAL_URL: ${{ vars.FINANCE_INTERNAL_URL }}
          RELATIONSHIP_FRONT_URL: ${{ vars.RELATIONSHIP_FRONT_URL }}
          ALBUM_FRONT_URL: ${{ vars.ALBUM_FRONT_URL }}
          FINANCE_FRONT_URL: ${{ vars.FINANCE_FRONT_URL }}
          RELATIONSHIP_API_URL: ${{ vars.RELATIONSHIP_API_URL }}
          RELATIONSHIP_INTERNAL_URL: ${{ vars.RELATIONSHIP_INTERNAL_URL }}
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PAYMENT_API_URL: ${{ vars.PAYMENT_API_URL }}
          PAYMENT_INTERNAL_URL: ${{ vars.PAYMENT_INTERNAL_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYMENT_FRONT_URL: ${{ vars.PAYMENT_FRONT_URL }}
          PAYMENT_URL: ${{ vars.PAYMENT_URL }}
          GROUP_FRONT_URL: ${{ vars.GROUP_FRONT_URL }}
          ACCOUNT_FRONT_URL: ${{ vars.ACCOUNT_FRONT_URL }}
          SHELL_FRONT_URL: ${{ vars.SHELL_FRONT_URL }}
          FILE_SERVICE_URL: ${{ vars.FILE_SERVICE_URL }}
          FILE_SERVICE_API_KEY: ${{ secrets.FILE_SERVICE_API_KEY }}
          FILE_SERVICE_HMAC_SECRET: ${{ secrets.FILE_SERVICE_HMAC_SECRET }}
          FILE_SERVICE_PUBLIC_URL: ${{ vars.FILE_SERVICE_PUBLIC_URL }}
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
          CHAT_INTERNAL_URL: ${{ vars.CHAT_INTERNAL_URL }}
          CHAT_FRONT_URL: ${{ vars.CHAT_FRONT_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          CLOUDFLARE_TURN_KEY_ID: ${{ vars.CLOUDFLARE_TURN_KEY_ID }}
          CLOUDFLARE_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}

      - name: Stage compose files into the deploy tree
        run: |
          # Compose runs from $DEPLOY_ROOT, not the runner workspace: service compose
          # files bind-mount relative paths (file-service's data dir) and the
          # workspace is wiped between jobs. Same location scp used to write to.
          DEPLOY_ROOT="${{ vars.DEPLOY_ROOT }}"
          DEPLOY_ROOT="${DEPLOY_ROOT:-$HOME/tumbaland}"
          echo "DEPLOY_ROOT=$DEPLOY_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$DEPLOY_ROOT"
          cp .env.app "$DEPLOY_ROOT/"
          for compose in apps/frontend/*/compose.yml apps/backend/*/compose.yml; do
            mkdir -p "$DEPLOY_ROOT/$(dirname "$compose")"
            cp "$compose" "$DEPLOY_ROOT/$compose"
          done

      - name: Deploy services one at a time
        env:
          SERVICES: ${{ needs.set-matrix.outputs.services_list }}
          GAP_SECONDS: ${{ github.event.inputs.gap_seconds }}
        run: |
          cd "$DEPLOY_ROOT"
          export COMPOSE_HTTP_TIMEOUT=300
          docker network ls | grep -q tumbanet || docker network create tumbanet
          for svc in $SERVICES; do
            case "$svc" in
              *-front) TIER=frontend ;;
              *)       TIER=backend ;;
            esac
            CF="apps/$TIER/$svc/compose.yml"
            echo "=== Deploying $svc ($CF) ==="
            docker compose --env-file .env.app -f "$CF" pull
            docker compose --env-file .env.app -f "$CF" up -d
            # Wait for the container to report running before touching the next
            # service, so a slow start never overlaps the next stop/start.
            state=""
            for i in $(seq 1 30); do
              state=$(docker compose --env-file .env.app -f "$CF" ps --format '{{.State}}' 2>/dev/null | head -n1)
              [ "$state" = "running" ] && break
              sleep 2
            done
            echo "$svc state: ${state:-unknown}"
            sleep "$GAP_SECONDS"
          done
          echo "All requested services deployed."
