name: Deploy Infrastructure Service

run-name: Deploy Infra ${{ github.event.inputs.service || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select an infrastructure service to deploy'
        required: true
        type: choice
        options:
          - tumbaland-proxy
          - elk
          - rabbitmq
          - beszel

# Ensure only one infrastructure deployment runs at a time
concurrency:
  group: tumbaland-infra-deployment
  cancel-in-progress: false

jobs:
  # Image builds stay on a GitHub-hosted runner, and a native ARM64 one: the
  # previous x64 runner emulated arm64 under QEMU (`platforms: linux/arm64`),
  # which dominated every infra deploy. The Pi is spared the build either way.
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      deploy_path: ${{ steps.vars.outputs.deploy_path }}
      deploy_dir: ${{ steps.vars.outputs.deploy_dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          case "${{ github.event.inputs.service }}" in
            tumbaland-proxy)
              CONTEXT=./apps/infra/tumbaland-proxy
              DOCKERFILE=./apps/infra/tumbaland-proxy/Dockerfile
              DEPLOYPATH=apps/infra/tumbaland-proxy/compose.yml
              DEPLOYDIR=apps/infra/tumbaland-proxy
              ;;
            elk)
              CONTEXT=./apps/infra/elk
              DOCKERFILE=./apps/infra/elk/Dockerfile
              DEPLOYPATH=apps/infra/elk/docker-compose.yml
              DEPLOYDIR=apps/infra/elk
              ;;
            rabbitmq)
              CONTEXT=./apps/infra/rabbitmq
              DOCKERFILE=./apps/infra/rabbitmq/Dockerfile
              DEPLOYPATH=apps/infra/rabbitmq/docker-compose.yml
              DEPLOYDIR=apps/infra/rabbitmq
              ;;
            beszel)
              # Upstream images, nothing to build.
              CONTEXT=./apps/infra/beszel
              DOCKERFILE=""
              DEPLOYPATH=apps/infra/beszel/compose.yml
              DEPLOYDIR=apps/infra/beszel
              ;;
          esac
          echo "context=$CONTEXT" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "deploy_path=$DEPLOYPATH" >> $GITHUB_OUTPUT
          echo "deploy_dir=$DEPLOYDIR" >> $GITHUB_OUTPUT

      - name: Check if Dockerfile exists
        id: dockerfile_check
        run: |
          if [ -f "${{ steps.vars.outputs.dockerfile }}" ]; then
            echo "dockerfile_exists=true" >> $GITHUB_OUTPUT
          else
            echo "dockerfile_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile_check.outputs.dockerfile_exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dockerfile_check.outputs.dockerfile_exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.dockerfile_check.outputs.dockerfile_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.vars.outputs.context }}
          file: ${{ steps.vars.outputs.dockerfile }}
          push: true
          # Immutable SHA tag (for rollback) plus the :latest tag compose pulls.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.service }}:${{ github.sha }}
          # No `platforms:` — the runner is already arm64, so this builds natively.
          # Layer cache keyed per infra service, as the app deploys do.
          cache-from: type=gha,scope=infra-${{ github.event.inputs.service }}
          cache-to: type=gha,mode=max,scope=infra-${{ github.event.inputs.service }}

  # Runs on the Pi itself. The runner dials out to GitHub, so nothing has to be
  # reachable from the internet — the old scp/ssh path needed an inbound port at
  # home, and the Cloudflare Tunnel that replaced it carries HTTP(S) only.
  deploy:
    needs: build
    runs-on: [self-hosted, tumbaland-pi]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate infrastructure .env file
        run: |
          # Core infrastructure secrets. First line truncates: the self-hosted
          # runner reuses its workspace, so appending to a leftover .env.infra
          # would stack a previous run's values under the current ones.
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" > .env.infra
          echo "ELASTIC_PASSWORD=${{ secrets.ELASTIC_PASSWORD }}" >> .env.infra
          echo "KIBANA_SYSTEM_PASSWORD=${{ secrets.KIBANA_SYSTEM_PASSWORD }}" >> .env.infra
          echo "KIBANA_ADMIN_PASSWORD=${{ secrets.KIBANA_ADMIN_PASSWORD }}" >> .env.infra
          echo "ELASTIC_ENCRYPTIONKEY=${{ secrets.ELASTIC_ENCRYPTIONKEY }}" >> .env.infra
          echo "XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${{ secrets.XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY }}" >> .env.infra
          echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}" >> .env.infra
          RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}" && echo "RABBITMQ_URL=amqp://admin:$RABBITMQ_PASSWORD@rabbitmq:5672/tumbaland" >> .env.infra

          # Beszel monitoring. BESZEL_KEY is an SSH public key and contains spaces,
          # so it must be quoted — compose strips the quotes when reading the env file.
          echo "BESZEL_KEY='${{ secrets.BESZEL_KEY }}'" >> .env.infra
          echo "BESZEL_TOKEN=${{ secrets.BESZEL_TOKEN }}" >> .env.infra

          echo "✅ Generated .env.infra"

      - name: Stage compose file into the deploy tree
        env:
          DEPLOY_DIR: ${{ needs.build.outputs.deploy_dir }}
          DEPLOY_PATH: ${{ needs.build.outputs.deploy_path }}
        run: |
          # Compose is deliberately NOT run out of the runner workspace: infra
          # services bind-mount relative paths (tumbaland-proxy's ./certs,
          # prometheus' ./data, beszel's ./data and ./socket). Run from the
          # workspace and those resolve inside _work/, which the runner wipes between
          # jobs — certs regenerated, datastores starting empty. The live data lives
          # under $DEPLOY_ROOT, so the compose file is copied to sit beside it,
          # exactly where scp used to put it.
          DEPLOY_ROOT="${{ vars.DEPLOY_ROOT }}"
          DEPLOY_ROOT="${DEPLOY_ROOT:-$HOME/tumbaland}"
          echo "DEPLOY_ROOT=$DEPLOY_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$DEPLOY_ROOT/$DEPLOY_DIR"
          cp .env.infra "$DEPLOY_ROOT/"
          # Compose file name varies by service (compose.yml vs docker-compose.yml),
          # so copy the one the build job resolved rather than assuming.
          cp "$DEPLOY_PATH" "$DEPLOY_ROOT/$DEPLOY_PATH"
          # Scripts bind-mounted by a service's compose file (elk's entrypoint.sh).
          # `|| continue`, not `&& cp`: steps run under `bash -e`,
          # and for a service with no scripts the glob stays unexpanded, so a
          # trailing failed test would abort the whole step.
          for script in "$DEPLOY_DIR"/*.sh; do
            [ -e "$script" ] || continue
            cp "$script" "$DEPLOY_ROOT/$DEPLOY_DIR/"
          done
          ls -al "$DEPLOY_ROOT/$DEPLOY_DIR"

      - name: Deploy infrastructure service
        env:
          DEPLOY_PATH: ${{ needs.build.outputs.deploy_path }}
        run: |
          cd "$DEPLOY_ROOT"
          export COMPOSE_HTTP_TIMEOUT=300
          docker network ls | grep -q tumbanet || docker network create tumbanet
          docker compose --env-file .env.infra -f "$DEPLOY_PATH" pull
          docker compose --env-file .env.infra -f "$DEPLOY_PATH" up -d
