
name: Deploy Single Service

run-name: Deploy ${{ github.event.inputs.service || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select a service to deploy'
        required: true
        type: choice
        options:
          - relationship-front
          - album-front
          - finance-front
          - shell-front
          - auth-front
          - album-service
          - auth-service
          - file-service
          - finance-service
          - public-service
          - relationship-service
          - tumbaland-proxy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          case "${{ github.event.inputs.service }}" in
            relationship-front)
              CONTEXT=./apps/frontend/relationship-front
              DOCKERFILE=./apps/frontend/relationship-front/Dockerfile
              DEPLOYPATH=apps/frontend/relationship-front/compose.yml
              DEPLOYDIR=apps/frontend/relationship-front
              ;;
            album-front)
              CONTEXT=./apps/frontend/album-front
              DOCKERFILE=./apps/frontend/album-front/Dockerfile
              DEPLOYPATH=apps/frontend/album-front/compose.yml
              DEPLOYDIR=apps/frontend/album-front
              ;;
            finance-front)
              CONTEXT=./apps/frontend/finance-front
              DOCKERFILE=./apps/frontend/finance-front/Dockerfile
              DEPLOYPATH=apps/frontend/finance-front/compose.yml
              DEPLOYDIR=apps/frontend/finance-front
              ;;
            shell-front)
              CONTEXT=./apps/frontend/shell-front
              DOCKERFILE=./apps/frontend/shell-front/Dockerfile
              DEPLOYPATH=apps/frontend/shell-front/compose.yml
              DEPLOYDIR=apps/frontend/shell-front
              ;;
            auth-front)
              CONTEXT=./apps/frontend/auth-front
              DOCKERFILE=./apps/frontend/auth-front/Dockerfile
              DEPLOYPATH=apps/frontend/auth-front/compose.yml
              DEPLOYDIR=apps/frontend/auth-front
              ;;
            album-service)
              CONTEXT=./apps/backend/album-service
              DOCKERFILE=./apps/backend/album-service/Dockerfile
              DEPLOYPATH=apps/backend/album-service/compose.yml
              DEPLOYDIR=apps/backend/album-service
              ;;
            auth-service)
              CONTEXT=./apps/backend/auth-service
              DOCKERFILE=./apps/backend/auth-service/Dockerfile
              DEPLOYPATH=apps/backend/auth-service/compose.yml
              DEPLOYDIR=apps/backend/auth-service
              ;;
            file-service)
              CONTEXT=./apps/backend/file-service
              DOCKERFILE=./apps/backend/file-service/Dockerfile
              DEPLOYPATH=apps/backend/file-service/compose.yml
              DEPLOYDIR=apps/backend/file-service
              ;;
            finance-service)
              CONTEXT=./apps/backend/finance-service
              DOCKERFILE=./apps/backend/finance-service/Dockerfile
              DEPLOYPATH=apps/backend/finance-service/compose.yml
              DEPLOYDIR=apps/backend/finance-service
              ;;
            public-service)
              CONTEXT=./apps/backend/public-service
              DOCKERFILE=./apps/backend/public-service/Dockerfile
              DEPLOYPATH=apps/backend/public-service/compose.yml
              DEPLOYDIR=apps/backend/public-service
              ;;
            relationship-service)
              CONTEXT=./apps/backend/relationship-service
              DOCKERFILE=./apps/backend/relationship-service/Dockerfile
              DEPLOYPATH=apps/backend/relationship-service/compose.yml
              DEPLOYDIR=apps/backend/relationship-service
              ;;
            tumbaland-proxy)
              CONTEXT=./apps/infra/tumbaland-proxy
              DOCKERFILE=./apps/infra/tumbaland-proxy/Dockerfile
              DEPLOYPATH=apps/infra/tumbaland-proxy/compose.yml
              DEPLOYDIR=apps/infra/tumbaland-proxy
              ;;
          esac
          echo "context=$CONTEXT" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "deploy_path=$DEPLOYPATH" >> $GITHUB_OUTPUT
          echo "deploy_dir=$DEPLOYDIR" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.vars.outputs.context }}
          file: ${{ steps.vars.outputs.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.service }}:latest
          platforms: linux/arm64

      - name: Generate .env file
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLOUD_KEY_FILE_BASE64=${{ secrets.GOOGLE_CLOUD_KEY_FILE_BASE64 }}" >> .env
          echo "AUTHORIZED_EMAILS=${{ vars.AUTHORIZED_EMAILS }}" >> .env
          echo "COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN }}" >> .env
          echo "GOOGLE_CLOUD_PROJECT_ID=${{ vars.GOOGLE_CLOUD_PROJECT_ID }}" >> .env
          echo "GOOGLE_CLOUD_BUCKET_NAME=${{ vars.GOOGLE_CLOUD_BUCKET_NAME }}" >> .env
          echo "CORS_ORIGIN=${{ vars.CORS_ORIGIN }}" >> .env
          echo "ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }}" >> .env
          echo "FILE_API_URL=${{ vars.FILE_API_URL }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_FILE_API_URL=${{ vars.VITE_FILE_API_URL }}" >> .env
          echo "VITE_ALBUM_API_URL=${{ vars.VITE_ALBUM_API_URL }}" >> .env
          echo "VITE_AUTH_SERVICE_URL=${{ vars.VITE_AUTH_SERVICE_URL }}" >> .env
          echo "VITE_AUTH_FRONT_URL=${{ vars.VITE_AUTH_FRONT_URL }}" >> .env
          echo "VITE_FINANCE_API_URL=${{ vars.VITE_FINANCE_API_URL }}" >> .env
          echo "VITE_RELATIONSHIP_URL=${{ vars.VITE_RELATIONSHIP_URL }}" >> .env
          echo "VITE_ALBUM_URL=${{ vars.VITE_ALBUM_URL }}" >> .env
          echo "VITE_FINANCE_URL=${{ vars.VITE_FINANCE_URL }}" >> .env
          echo "VITE_RELATIONSHIP_API_URL=${{ vars.VITE_RELATIONSHIP_API_URL }}" >> .env
          echo "VITE_PUBLIC_API_URL=${{ vars.VITE_PUBLIC_API_URL }}" >> .env

      - name: Copy .env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: .env
          target: ~/tumbaland/

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ${{ steps.vars.outputs.deploy_path }}
          target: ~/tumbaland/

      - name: SSH and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/tumbaland
            docker-compose --env-file .env -f ${{ steps.vars.outputs.deploy_path }} pull
            docker-compose --env-file .env -f ${{ steps.vars.outputs.deploy_path }} up -d
