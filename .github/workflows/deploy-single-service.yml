name: Deploy Application Service

run-name: Deploy App ${{ github.event.inputs.service || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select an application service to deploy'
        required: true
        type: choice
        options:
          - relationship-front
          - album-front
          - finance-front
          - shell-front
          - auth-front
          - account-front
          - payment-front
          - group-front
          - album-service
          - auth-service
          - finance-service
          - public-service
          - relationship-service
          - payment-service
          - group-service
          - file-service

# Ensure only one deployment runs at a time to prevent server overload
concurrency:
  group: tumbaland-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          case "${{ github.event.inputs.service }}" in
            relationship-front)
              CONTEXT=./apps/frontend/relationship-front
              DOCKERFILE=./apps/frontend/relationship-front/Dockerfile
              DEPLOYPATH=apps/frontend/relationship-front/compose.yml
              DEPLOYDIR=apps/frontend/relationship-front
              ;;
            album-front)
              CONTEXT=./apps/frontend/album-front
              DOCKERFILE=./apps/frontend/album-front/Dockerfile
              DEPLOYPATH=apps/frontend/album-front/compose.yml
              DEPLOYDIR=apps/frontend/album-front
              ;;
            finance-front)
              CONTEXT=./apps/frontend/finance-front
              DOCKERFILE=./apps/frontend/finance-front/Dockerfile
              DEPLOYPATH=apps/frontend/finance-front/compose.yml
              DEPLOYDIR=apps/frontend/finance-front
              ;;
            shell-front)
              CONTEXT=./apps/frontend/shell-front
              DOCKERFILE=./apps/frontend/shell-front/Dockerfile
              DEPLOYPATH=apps/frontend/shell-front/compose.yml
              DEPLOYDIR=apps/frontend/shell-front
              ;;
            auth-front)
              CONTEXT=./apps/frontend/auth-front
              DOCKERFILE=./apps/frontend/auth-front/Dockerfile
              DEPLOYPATH=apps/frontend/auth-front/compose.yml
              DEPLOYDIR=apps/frontend/auth-front
              ;;
            account-front)
              CONTEXT=./apps/frontend/account-front
              DOCKERFILE=./apps/frontend/account-front/Dockerfile
              DEPLOYPATH=apps/frontend/account-front/compose.yml
              DEPLOYDIR=apps/frontend/account-front
              ;;
            payment-front)
              CONTEXT=./apps/frontend/payment-front
              DOCKERFILE=./apps/frontend/payment-front/Dockerfile
              DEPLOYPATH=apps/frontend/payment-front/compose.yml
              DEPLOYDIR=apps/frontend/payment-front
              ;;
            group-front)
              CONTEXT=./apps/frontend/group-front
              DOCKERFILE=./apps/frontend/group-front/Dockerfile
              DEPLOYPATH=apps/frontend/group-front/compose.yml
              DEPLOYDIR=apps/frontend/group-front
              ;;
            album-service)
              CONTEXT=./apps/backend/album-service
              DOCKERFILE=./apps/backend/album-service/Dockerfile
              DEPLOYPATH=apps/backend/album-service/compose.yml
              DEPLOYDIR=apps/backend/album-service
              ;;
            auth-service)
              CONTEXT=./apps/backend/auth-service
              DOCKERFILE=./apps/backend/auth-service/Dockerfile
              DEPLOYPATH=apps/backend/auth-service/compose.yml
              DEPLOYDIR=apps/backend/auth-service
              ;;
            finance-service)
              CONTEXT=./apps/backend/finance-service
              DOCKERFILE=./apps/backend/finance-service/Dockerfile
              DEPLOYPATH=apps/backend/finance-service/compose.yml
              DEPLOYDIR=apps/backend/finance-service
              ;;
            public-service)
              CONTEXT=./apps/backend/public-service
              DOCKERFILE=./apps/backend/public-service/Dockerfile
              DEPLOYPATH=apps/backend/public-service/compose.yml
              DEPLOYDIR=apps/backend/public-service
              ;;
            relationship-service)
              CONTEXT=./apps/backend/relationship-service
              DOCKERFILE=./apps/backend/relationship-service/Dockerfile
              DEPLOYPATH=apps/backend/relationship-service/compose.yml
              DEPLOYDIR=apps/backend/relationship-service
              ;;
            payment-service)
              CONTEXT=./apps/backend/payment-service
              DOCKERFILE=./apps/backend/payment-service/Dockerfile
              DEPLOYPATH=apps/backend/payment-service/compose.yml
              DEPLOYDIR=apps/backend/payment-service
              ;;
            group-service)
              CONTEXT=./apps/backend/group-service
              DOCKERFILE=./apps/backend/group-service/Dockerfile
              DEPLOYPATH=apps/backend/group-service/compose.yml
              DEPLOYDIR=apps/backend/group-service
              ;;
            file-service)
              CONTEXT=./apps/backend/file-service
              DOCKERFILE=./apps/backend/file-service/Dockerfile
              DEPLOYPATH=apps/backend/file-service/compose.yml
              DEPLOYDIR=apps/backend/file-service
              ;;
          esac
          echo "context=$CONTEXT" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "deploy_path=$DEPLOYPATH" >> $GITHUB_OUTPUT
          echo "deploy_dir=$DEPLOYDIR" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.vars.outputs.context }}
          file: ${{ steps.vars.outputs.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.service }}:latest
          platforms: linux/arm64

      - name: Generate .env file
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > .env.app
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.app
          echo "INTERNAL_SERVICE_TOKEN=${{ secrets.INTERNAL_SERVICE_TOKEN }}" >> .env.app
          echo "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" >> .env.app
          echo "GOOGLE_CLOUD_KEY_FILE_BASE64=${{ secrets.GOOGLE_CLOUD_KEY_FILE_BASE64 }}" >> .env.app
          echo "COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN }}" >> .env.app
          echo "GOOGLE_CLOUD_PROJECT_ID=${{ vars.GOOGLE_CLOUD_PROJECT_ID }}" >> .env.app
          echo "GOOGLE_CLOUD_BUCKET_NAME=${{ vars.GOOGLE_CLOUD_BUCKET_NAME }}" >> .env.app
          echo "CORS_ORIGIN=${{ vars.CORS_ORIGIN }}" >> .env.app
          echo "ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }}" >> .env.app
          echo "GROUP_API_URL=${{ vars.GROUP_API_URL }}" >> .env.app
          echo "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" >> .env.app
          echo "ALBUM_API_URL=${{ vars.ALBUM_API_URL }}" >> .env.app
          echo "AUTH_SERVICE_URL=${{ vars.AUTH_SERVICE_URL }}" >> .env.app
          echo "AUTH_FRONT_URL=${{ vars.AUTH_FRONT_URL }}" >> .env.app
          echo "FINANCE_API_URL=${{ vars.FINANCE_API_URL }}" >> .env.app
          echo "RELATIONSHIP_FRONT_URL=${{ vars.RELATIONSHIP_FRONT_URL }}" >> .env.app
          echo "ALBUM_FRONT_URL=${{ vars.ALBUM_FRONT_URL }}" >> .env.app
          echo "FINANCE_FRONT_URL=${{ vars.FINANCE_FRONT_URL }}" >> .env.app
          echo "RELATIONSHIP_API_URL=${{ vars.RELATIONSHIP_API_URL }}" >> .env.app
          echo "PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}" >> .env.app
          echo "OBJECT_DETECTION_API_URL=${{ vars.OBJECT_DETECTION_API_URL }}" >> .env.app
          echo "SEGMENTATION_API_URL=${{ vars.SEGMENTATION_API_URL }}" >> .env.app
          echo "PAYMENT_API_URL=${{ vars.PAYMENT_API_URL }}" >> .env.app
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env.app
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env.app
          echo "PAYMENT_FRONT_URL=${{ vars.PAYMENT_FRONT_URL }}" >> .env.app
          echo "PAYMENT_URL=${{ vars.PAYMENT_URL }}" >> .env.app
          echo "GROUP_FRONT_URL=${{ vars.GROUP_FRONT_URL }}" >> .env.app
          echo "ACCOUNT_FRONT_URL=${{ vars.ACCOUNT_FRONT_URL }}" >> .env.app
          echo "SHELL_FRONT_URL=${{ vars.SHELL_FRONT_URL }}" >> .env.app
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> .env.app
          echo "FILE_ACCESS_SECRET=${{ secrets.FILE_ACCESS_SECRET }}" >> .env.app
          echo "LOGSTASH_HTTP_URL=${{ vars.LOGSTASH_HTTP_URL }}" >> .env.app
          echo "FILE_SERVICE_URL=${{ vars.FILE_SERVICE_URL }}" >> .env.app
          echo "FILE_SERVICE_API_KEY=${{ secrets.FILE_SERVICE_API_KEY }}" >> .env.app
          echo "FILE_SERVICE_HMAC_SECRET=${{ secrets.FILE_SERVICE_HMAC_SECRET }}" >> .env.app
          echo "FILE_SERVICE_PUBLIC_URL=${{ vars.FILE_SERVICE_PUBLIC_URL }}" >> .env.app

      - name: Copy .env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: .env.app
          target: ~/tumbaland/

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ${{ steps.vars.outputs.deploy_path }}
          target: ~/tumbaland/

      - name: SSH and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/tumbaland
            export COMPOSE_HTTP_TIMEOUT=300
            docker network ls | grep -q tumbanet || docker network create tumbanet
            docker compose --env-file .env.app -f ${{ steps.vars.outputs.deploy_path }} pull
            docker compose --env-file .env.app -f ${{ steps.vars.outputs.deploy_path }} up -d
