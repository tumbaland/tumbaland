name: Deploy Application Service

run-name: Deploy App ${{ github.event.inputs.service || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select an application service to deploy'
        required: true
        type: choice
        options:
          - relationship-front
          - album-front
          - finance-front
          - shell-front
          - auth-front
          - account-front
          - payment-front
          - group-front
          - chat-front
          - album-service
          - chat-service
          - auth-service
          - finance-service
          - public-service
          - relationship-service
          - payment-service
          - group-service
          - file-service
          - mcp-service

# Ensure only one deployment runs at a time to prevent server overload
concurrency:
  group: tumbaland-deployment
  cancel-in-progress: false

jobs:
  # Native ARM64 hosted runner: builds the arm64 image directly instead of
  # emulating it under QEMU on an x64 runner (the previous `platforms: linux/arm64`
  # path), which was the dominant cost of every deploy — and keeps the build off
  # the Pi, which only has to pull the result.
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      deploy_path: ${{ steps.vars.outputs.deploy_path }}
      deploy_dir: ${{ steps.vars.outputs.deploy_dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          # Convention: names ending in -front live under apps/frontend, everything
          # else (the -service backends) under apps/backend. Each dir has a
          # Dockerfile and a compose.yml.
          case "$SERVICE" in
            *-front) TIER=frontend ;;
            *)       TIER=backend ;;
          esac
          DEPLOYDIR="apps/$TIER/$SERVICE"
          echo "deploy_path=$DEPLOYDIR/compose.yml" >> $GITHUB_OUTPUT
          echo "deploy_dir=$DEPLOYDIR" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Dockerfile, context and build arguments; see release.yml.
      - name: Resolve the build
        id: build
        run: node scripts/image-build.mjs "${{ github.event.inputs.service }}" --version "${{ steps.vars.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.build.outputs.context }}
          file: ${{ steps.build.outputs.file }}
          push: true
          build-args: ${{ steps.build.outputs.build-args }}
          # Immutable SHA tag (for rollback) plus the :latest tag the compose files pull.
          # The `tumbaland-` prefix is load-bearing: the Docker Hub account is shared
          # with visin, which has its own group-service, auth-service, file-service,
          # auth-front and account-front. Unprefixed, both projects pushed to the same
          # `:latest` and whichever deployed last silently replaced the other's image.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tumbaland-${{ github.event.inputs.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tumbaland-${{ github.event.inputs.service }}:${{ github.sha }}
          # Reuse the npm-install/build layers across runs via the GitHub Actions cache.
          cache-from: type=gha,scope=${{ github.event.inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ github.event.inputs.service }}

  # Runs on the Pi itself: the runner dials out to GitHub, so the deploy needs no
  # inbound port at home. Replaces the old scp + ssh sequence, which depended on
  # the public IP being reachable — it no longer is, ingress comes through the
  # Cloudflare Tunnel and that carries HTTP(S) only, not SSH.
  deploy:
    needs: build
    runs-on: [self-hosted, tumbaland-pi]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: bash .github/scripts/write-deploy-env.sh
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_ENCRYPTION_SECRET: ${{ secrets.API_KEY_ENCRYPTION_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_NATIVE_CLIENT_IDS: ${{ vars.GOOGLE_NATIVE_CLIENT_IDS }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GROUP_API_URL: ${{ vars.GROUP_API_URL }}
          GROUP_INTERNAL_URL: ${{ vars.GROUP_INTERNAL_URL }}
          ALBUM_API_URL: ${{ vars.ALBUM_API_URL }}
          ALBUM_INTERNAL_URL: ${{ vars.ALBUM_INTERNAL_URL }}
          AUTH_SERVICE_URL: ${{ vars.AUTH_SERVICE_URL }}
          AUTH_FRONT_URL: ${{ vars.AUTH_FRONT_URL }}
          FINANCE_API_URL: ${{ vars.FINANCE_API_URL }}
          FINANCE_INTERNAL_URL: ${{ vars.FINANCE_INTERNAL_URL }}
          RELATIONSHIP_FRONT_URL: ${{ vars.RELATIONSHIP_FRONT_URL }}
          ALBUM_FRONT_URL: ${{ vars.ALBUM_FRONT_URL }}
          FINANCE_FRONT_URL: ${{ vars.FINANCE_FRONT_URL }}
          RELATIONSHIP_API_URL: ${{ vars.RELATIONSHIP_API_URL }}
          RELATIONSHIP_INTERNAL_URL: ${{ vars.RELATIONSHIP_INTERNAL_URL }}
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PAYMENT_API_URL: ${{ vars.PAYMENT_API_URL }}
          PAYMENT_INTERNAL_URL: ${{ vars.PAYMENT_INTERNAL_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYMENT_FRONT_URL: ${{ vars.PAYMENT_FRONT_URL }}
          PAYMENT_URL: ${{ vars.PAYMENT_URL }}
          GROUP_FRONT_URL: ${{ vars.GROUP_FRONT_URL }}
          ACCOUNT_FRONT_URL: ${{ vars.ACCOUNT_FRONT_URL }}
          SHELL_FRONT_URL: ${{ vars.SHELL_FRONT_URL }}
          FILE_SERVICE_URL: ${{ vars.FILE_SERVICE_URL }}
          FILE_SERVICE_API_KEY: ${{ secrets.FILE_SERVICE_API_KEY }}
          FILE_SERVICE_HMAC_SECRET: ${{ secrets.FILE_SERVICE_HMAC_SECRET }}
          FILE_SERVICE_PUBLIC_URL: ${{ vars.FILE_SERVICE_PUBLIC_URL }}
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
          CHAT_INTERNAL_URL: ${{ vars.CHAT_INTERNAL_URL }}
          CHAT_FRONT_URL: ${{ vars.CHAT_FRONT_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          CLOUDFLARE_TURN_KEY_ID: ${{ vars.CLOUDFLARE_TURN_KEY_ID }}
          CLOUDFLARE_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}

      - name: Stage compose file into the deploy tree
        env:
          DEPLOY_DIR: ${{ needs.build.outputs.deploy_dir }}
        run: |
          # Compose runs from $DEPLOY_ROOT, not the runner workspace: file-service's
          # volume binds ${FILE_DATA_PATH:-./data} relative to its compose file, and
          # the workspace is wiped between jobs — running from there would point it
          # at an empty directory. Same location scp used to write to.
          DEPLOY_ROOT="${{ vars.DEPLOY_ROOT }}"
          DEPLOY_ROOT="${DEPLOY_ROOT:-$HOME/tumbaland}"
          echo "DEPLOY_ROOT=$DEPLOY_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$DEPLOY_ROOT/$DEPLOY_DIR"
          cp .env.app "$DEPLOY_ROOT/"
          cp "$DEPLOY_DIR/compose.yml" "$DEPLOY_ROOT/$DEPLOY_DIR/"

      - name: Deploy service
        env:
          DEPLOY_PATH: ${{ needs.build.outputs.deploy_path }}
        run: |
          cd "$DEPLOY_ROOT"
          export COMPOSE_HTTP_TIMEOUT=300
          docker network ls | grep -q tumbanet || docker network create tumbanet
          docker compose --env-file .env.app -f "$DEPLOY_PATH" pull
          docker compose --env-file .env.app -f "$DEPLOY_PATH" up -d
