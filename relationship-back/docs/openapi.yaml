openapi: 3.0.3
info:
  title: Relationship Activity Tracking API
  description: |
    A comprehensive API for tracking relationship activities with date, hours, and activity details.
    This API allows you to create, read, update, and delete activities, as well as get statistics
    and insights about your relationship activities.
    
    ## Features
    - Full CRUD operations for activities
    - Activity statistics and analytics
    - Date range filtering
    - Recent activities tracking
    - Activity type management
    
    ## Activity Structure
    Each activity contains:
    - **Date**: When the activity took place
    - **Hours**: Duration of the activity (integer)
    - **Activity Object**: Contains type and description
      - **Type**: Category of activity (movies, cooking, dining, etc.)
      - **Description**: Detailed description of what was done
      
  version: 1.0.0
  contact:
    name: Tumbaland Development Team
    email: dev@tumbaland.com
  license:
    name: ISC
    
servers:
  - url: http://localhost:4002
    description: Development server
  - url: https://api.tumbaland.com
    description: Production server (when deployed)

paths:
  /health:
    get:
      summary: Health Check
      description: Check if the API service is running and connected to MongoDB
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "relationship-back"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-25T10:30:00.000Z"
                  mongodb:
                    type: string
                    example: "connected"

  /api/activities:
    get:
      summary: Get Activities
      description: |
        Retrieve a paginated list of activities with optional filtering by activity type,
        date range, and pagination parameters.
      tags:
        - Activities
      parameters:
        - name: activityType
          in: query
          description: Filter by activity type
          required: false
          schema:
            type: string
            enum: [movies, cooking, dining, date, walk, shopping, gaming, other]
          example: "movies"
        - name: startDate
          in: query
          description: Filter activities from this date (inclusive)
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: endDate
          in: query
          description: Filter activities until this date (inclusive)
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-31"
        - name: page
          in: query
          description: Page number for pagination (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Number of activities per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: List of activities with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      activities:
                        type: array
                        items:
                          $ref: '#/components/schemas/Activity'
                      total:
                        type: integer
                        description: Total number of activities matching the filter
                        example: 150
                      page:
                        type: integer
                        description: Current page number
                        example: 1
                      totalPages:
                        type: integer
                        description: Total number of pages
                        example: 8
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create Activity
      description: Create a new activity with date, hours, and activity details
      tags:
        - Activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
            examples:
              movie_night:
                summary: Movie Night Example
                value:
                  date: "2024-01-25"
                  hours: 3
                  activity:
                    type: "movies"
                    description: "Watched a romantic comedy at the cinema with popcorn"
              cooking_together:
                summary: Cooking Together Example
                value:
                  date: "2024-01-24"
                  hours: 2
                  activity:
                    type: "cooking"
                    description: "Made homemade pasta with marinara sauce from scratch"
      responses:
        '201':
          description: Activity created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activities/{id}:
    get:
      summary: Get Activity by ID
      description: Retrieve a specific activity by its unique identifier
      tags:
        - Activities
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the activity
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Activity details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Activity'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update Activity
      description: Update an existing activity by its ID
      tags:
        - Activities
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the activity
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
            example:
              date: "2024-01-25"
              hours: 4
              activity:
                type: "movies"
                description: "Extended movie marathon with multiple films and snacks"
      responses:
        '200':
          description: Activity updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete Activity
      description: Delete an activity by its ID
      tags:
        - Activities
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the activity
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Activity deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Activity deleted successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activities/recent:
    get:
      summary: Get Recent Activities
      description: Get the most recently created activities
      tags:
        - Activities
      parameters:
        - name: limit
          in: query
          description: Number of recent activities to retrieve
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10
      responses:
        '200':
          description: List of recent activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activities/stats:
    get:
      summary: Get Activity Statistics
      description: |
        Get comprehensive statistics about activities, including counts, total hours,
        and averages grouped by activity type.
      tags:
        - Analytics
      parameters:
        - name: startDate
          in: query
          description: Calculate stats from this date (inclusive)
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: endDate
          in: query
          description: Calculate stats until this date (inclusive)
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-31"
      responses:
        '200':
          description: Activity statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      byType:
                        type: array
                        description: Statistics grouped by activity type
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              description: Activity type
                              example: "movies"
                            count:
                              type: integer
                              description: Number of activities of this type
                              example: 5
                            totalHours:
                              type: integer
                              description: Total hours spent on this activity type
                              example: 15
                            avgHours:
                              type: number
                              description: Average hours per activity of this type
                              example: 3.0
                      overall:
                        type: object
                        description: Overall statistics across all activities
                        properties:
                          totalActivities:
                            type: integer
                            description: Total number of activities
                            example: 25
                          totalHours:
                            type: integer
                            description: Total hours across all activities
                            example: 65
                          avgHours:
                            type: number
                            description: Average hours per activity
                            example: 2.6
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activities/date-range:
    get:
      summary: Get Activities by Date Range
      description: Retrieve activities within a specific date range
      tags:
        - Activities
      parameters:
        - name: startDate
          in: query
          required: true
          description: Start date for the range (inclusive)
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: endDate
          in: query
          required: true
          description: End date for the range (inclusive)
          schema:
            type: string
            format: date
          example: "2024-01-31"
      responses:
        '200':
          description: Activities within the specified date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
        '400':
          description: Missing or invalid date parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Both startDate and endDate are required"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activities/types:
    get:
      summary: Get Activity Types
      description: Get a list of all available activity types
      tags:
        - Reference
      responses:
        '200':
          description: List of available activity types
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                    example: ["movies", "cooking", "dining", "date", "walk", "shopping", "gaming", "other"]
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Activity:
      type: object
      description: A relationship activity record
      properties:
        _id:
          type: string
          description: Unique identifier (MongoDB ObjectId)
          example: "507f1f77bcf86cd799439011"
        date:
          type: string
          format: date-time
          description: Date and time when the activity took place
          example: "2024-01-25T00:00:00.000Z"
        hours:
          type: integer
          minimum: 1
          description: Duration of the activity in hours
          example: 3
        activity:
          type: object
          description: Activity details
          properties:
            type:
              type: string
              enum: [movies, cooking, dining, date, walk, shopping, gaming, other]
              description: Category of the activity
              example: "movies"
            description:
              type: string
              maxLength: 500
              description: Detailed description of the activity
              example: "Watched a romantic comedy at the cinema with popcorn and drinks"
          required:
            - type
            - description
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created
          example: "2024-01-25T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was last updated
          example: "2024-01-25T10:30:00.000Z"
      required:
        - _id
        - date
        - hours
        - activity
        - createdAt
        - updatedAt

    CreateActivityRequest:
      type: object
      description: Request payload for creating a new activity
      properties:
        date:
          type: string
          format: date
          description: Date when the activity took place (YYYY-MM-DD)
          example: "2024-01-25"
        hours:
          type: integer
          minimum: 1
          description: Duration of the activity in hours
          example: 3
        activity:
          type: object
          description: Activity details
          properties:
            type:
              type: string
              enum: [movies, cooking, dining, date, walk, shopping, gaming, other]
              description: Category of the activity
              example: "movies"
            description:
              type: string
              maxLength: 500
              description: Detailed description of the activity
              example: "Watched a romantic comedy at the cinema with popcorn and drinks"
          required:
            - type
            - description
      required:
        - date
        - hours
        - activity

    UpdateActivityRequest:
      type: object
      description: Request payload for updating an existing activity
      properties:
        date:
          type: string
          format: date
          description: Date when the activity took place (YYYY-MM-DD)
          example: "2024-01-25"
        hours:
          type: integer
          minimum: 1
          description: Duration of the activity in hours
          example: 3
        activity:
          type: object
          description: Activity details
          properties:
            type:
              type: string
              enum: [movies, cooking, dining, date, walk, shopping, gaming, other]
              description: Category of the activity
              example: "movies"
            description:
              type: string
              maxLength: 500
              description: Detailed description of the activity
              example: "Watched a romantic comedy at the cinema with popcorn and drinks"

    Error:
      type: object
      description: Error response format
      properties:
        error:
          type: string
          description: Error message
          example: "Validation failed"
        message:
          type: string
          description: Detailed error description
          example: "Missing required fields: date, hours, and activity are required"
      required:
        - error

  responses:
    BadRequest:
      description: Bad request - validation failed or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_fields:
              summary: Missing Required Fields
              value:
                error: "Missing required fields: date, hours, and activity are required"
            invalid_activity:
              summary: Invalid Activity Object
              value:
                error: "Activity object must contain both type and description"
            invalid_date:
              summary: Invalid Date Format
              value:
                error: "Invalid date format. Use YYYY-MM-DD"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Activity not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"

  parameters:
    ActivityId:
      name: id
      in: path
      required: true
      description: Unique identifier of the activity (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      example: "507f1f77bcf86cd799439011"

tags:
  - name: Health
    description: Service health and status endpoints
  - name: Activities
    description: CRUD operations for relationship activities
  - name: Analytics
    description: Statistics and analytics for activities
  - name: Reference
    description: Reference data and lookup endpoints
