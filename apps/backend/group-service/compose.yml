services:
  group-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/tumbaland-group-service:latest
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5006:5006'
    environment:
      - PORT=5006
      - NODE_ENV=production
      - SERVICE_NAME=group-service
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      # Also gates /internal/groups/:id/owner, which album- and finance-service
      # read to pick the quota subject for anything held in a group.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Group membership is asked of group-service on each request (backend-core currentGroupsOf).
      - GROUP_INTERNAL_URL=${GROUP_INTERNAL_URL}
      - AUTH_API_URL=${AUTH_API_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Entitlements: the seats chokepoint checks an added member against the
      # group owner's plan. No group URL — this service owns that data.
      - PAYMENT_INTERNAL_URL=${PAYMENT_INTERNAL_URL}
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
