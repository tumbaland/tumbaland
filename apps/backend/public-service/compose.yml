services:
  public-service:
    build:
      # The repository root: images install from the root lockfile.
      context: ../../..
      dockerfile: docker/Dockerfile.back
      args:
        APP: public-service
        PORT: 5003
    image: toomastahves/tumbaland-public-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5003:5003'
    environment:
      - PORT=5003
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN}
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
