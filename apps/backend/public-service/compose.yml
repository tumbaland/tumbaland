services:
  public-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/public-service:latest
    restart: unless-stopped
    ports:
      - '5003:5003'
    environment:
      - PORT=5003
      - NODE_ENV=production
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
