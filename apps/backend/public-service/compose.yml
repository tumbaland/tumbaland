services:
  public-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/public-service:latest
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
