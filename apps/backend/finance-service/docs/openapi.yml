openapi: 3.0.3
info:
  title: Tumbaland Finance Service API
  description: |
    Personal finance tracking: monthly net-worth snapshots per asset class,
    market-traded holdings with daily price collection, and dashboard analytics.
  version: 2.0.0
  contact:
    name: Tumbaland Support
    email: support@tumbaland.com

servers:
  - url: http://localhost:4003
    description: Development server
  - url: https://api.tumbaland.com/finance
    description: Production server

tags:
  - name: Health
    description: Service health monitoring
  - name: Monitoring
    description: Service metrics and monitoring
  - name: Asset Classes
    description: Categories tracked in monthly check-ins (e.g. Cash, Investments, Real estate)
  - name: Snapshots
    description: Monthly net-worth check-ins (one document per month with all asset class values)
  - name: Holdings
    description: ETF/stock positions, enriched with latest prices
  - name: Tracked Tickers
    description: Instruments whose prices are fetched daily from Alpha Vantage
  - name: Ticker Price History
    description: Historical price data for tracked instruments
  - name: Dashboard
    description: Net worth, allocation and investment analytics

security:
  - cookieAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service is unhealthy (e.g. MongoDB not connected)

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      tags: [Monitoring]
      security: []
      responses:
        '200':
          description: Metrics data
          content:
            text/plain:
              schema:
                type: string

  /api/asset-classes:
    get:
      summary: List asset classes
      description: Personal classes by default; pass groupId for a group context.
      tags: [Asset Classes]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of asset classes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetClass'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create asset class
      tags: [Asset Classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetClassInput'
      responses:
        '201':
          description: Asset class created
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/asset-classes/{id}:
    put:
      summary: Update asset class
      tags: [Asset Classes]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetClassInput'
      responses:
        '200':
          description: Asset class updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete asset class
      tags: [Asset Classes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Asset class deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/snapshots:
    get:
      summary: List monthly snapshots
      description: Sorted by date descending. Personal snapshots by default; pass groupId for a group context.
      tags: [Snapshots]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Snapshot'
        '403':
          $ref: '#/components/responses/Forbidden'

  # One path for two keys: the API puts by month and deletes by id, and
  # OpenAPI cannot hold two paths that differ only in a parameter's name.
  /api/snapshots/{key}:
    put:
      summary: Create or replace the snapshot for a month (the monthly check-in)
      description: Upserts the full set of asset class values for the month in one call.
      tags: [Snapshots]
      parameters:
        - name: key
          in: path
          required: true
          description: The month, YYYY-MM
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-07'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/SnapshotEntry'
                groupId:
                  type: string
      responses:
        '200':
          description: Snapshot saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Delete a snapshot
      tags: [Snapshots]
      parameters:
        - name: key
          in: path
          required: true
          description: The snapshot's id (not its month)
          schema:
            type: string
      responses:
        '200':
          description: Snapshot deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/holdings:
    get:
      summary: List holdings with price enrichment
      description: >
        Personal holdings by default; pass groupId for a group context. Each holding is
        enriched with displayName (from its tracked ticker), latestPrice, latestPriceDate,
        athPrice, currentValue, valueIncrease and percentIncrease.
      tags: [Holdings]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of holdings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Holding'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create holding
      description: >
        Also starts tracking the holding's ticker in the same context (if not already
        tracked) so the daily price job covers it. Pass displayName to name the
        auto-created tracked ticker.
      tags: [Holdings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldingInput'
      responses:
        '201':
          description: Holding created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/holdings/{id}:
    put:
      summary: Update holding
      tags: [Holdings]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldingInput'
      responses:
        '200':
          description: Holding updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete holding
      tags: [Holdings]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Holding deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tracked-tickers:
    get:
      summary: List tracked tickers
      tags: [Tracked Tickers]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of tracked tickers
    post:
      summary: Track a ticker
      tags: [Tracked Tickers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedTickerInput'
      responses:
        '201':
          description: Ticker tracked

  /api/tracked-tickers/search:
    get:
      summary: Search ticker symbols
      description: Alpha Vantage SYMBOL_SEARCH (costs 1 API call; free plan is 25/day).
      tags: [Tracked Tickers]
      parameters:
        - name: q
          in: query
          required: true
          description: Search term, minimum 2 characters
          schema:
            type: string
      responses:
        '200':
          description: Matching symbols
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Alpha Vantage rate limit exhausted

  /api/tracked-tickers/{id}:
    put:
      summary: Update tracked ticker
      tags: [Tracked Tickers]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedTickerInput'
      responses:
        '200':
          description: Ticker updated
    delete:
      summary: Stop tracking a ticker
      description: Saved price history is kept.
      tags: [Tracked Tickers]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ticker deleted

  /api/ticker-price-history:
    get:
      summary: Get price history for the caller's tracked tickers
      description: >-
        Returns rows only for tickers tracked in the caller's current context
        (personal, or the group they belong to). Results are capped at `limit`
        rows (default 1000, maximum 5000), so narrow the query with `ticker`
        and a date range rather than paging through everything.
      tags: [Ticker Price History]
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          description: Restrict to a single ticker.
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Inclusive lower bound on the price date.
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Inclusive upper bound on the price date.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
      responses:
        '200':
          description: Price history records
        '400':
          description: Invalid date or limit

  /api/ticker-price-history/quota:
    get:
      summary: Remaining Alpha Vantage calls for today
      description: >-
        The provider quota is shared by the whole deployment, not per user, and
        is fixed at 25 calls per day. Endpoints that call the provider fail with
        429 once it reaches zero.
      tags: [Ticker Price History]
      responses:
        '200':
          description: Quota status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          limit:
                            type: integer
                          used:
                            type: integer
                          remaining:
                            type: integer
                          date:
                            type: string
                            format: date

  /api/ticker-price-history/fetch:
    post:
      summary: Fetch and save the latest price for a tracked ticker
      description: >-
        Spends one call from the shared daily Alpha Vantage quota. The ticker
        must already be tracked in the caller's context. Rate limited per client
        to 25 requests per hour; the shared daily quota of 25 is the hard limit.
      tags: [Ticker Price History]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker]
              properties:
                ticker:
                  type: string
      responses:
        '200':
          description: Prices fetched and saved
        '403':
          description: Ticker is not tracked in this context
        '429':
          description: Daily quota exhausted or client rate limit hit

  /api/ticker-price-history/fetch-all:
    post:
      summary: Fetch ~100 days of history for a tracked ticker
      description: >-
        Spends one call from the shared daily Alpha Vantage quota. The ticker
        must already be tracked in the caller's context. Rate limited per client
        to 25 requests per hour; the shared daily quota of 25 is the hard limit.
      tags: [Ticker Price History]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker]
              properties:
                ticker:
                  type: string
      responses:
        '200':
          description: History fetched and saved
        '403':
          description: Ticker is not tracked in this context
        '429':
          description: Daily quota exhausted or client rate limit hit

  /api/ticker-price-history/fetch-weekly:
    post:
      summary: Fetch the full weekly history for a tracked ticker
      description: >-
        One call returns ten to twenty years of weekly closes, stored as their
        own series beside the daily one rather than mixed into it. Spends one
        call from the shared daily Alpha Vantage quota, and is rate limited per
        client like the daily fetch.
      tags: [Ticker Price History]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker]
              properties:
                ticker:
                  type: string
      responses:
        '200':
          description: Weekly history fetched and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      ticker: { type: string }
                      recordsCount: { type: integer }
        '403':
          description: Ticker is not tracked in this context
        '429':
          description: Daily quota exhausted or client rate limit hit

  /api/ticker-price-history/coverage:
    get:
      summary: How much price history each tracked ticker holds, and how fresh it is
      description: >-
        Per tracked ticker, the daily and the weekly series: how many bars,
        the first and last date, and when it was last written. Tells apart an
        instrument that is new, a daily job that stopped, and history nobody
        ever fetched.
      tags: [Ticker Price History]
      responses:
        '200':
          description: Coverage per ticker
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker: { type: string }
                        daily: { $ref: '#/components/schemas/IntervalCoverage' }
                        weekly: { $ref: '#/components/schemas/IntervalCoverage' }

  /api/ticker-price-history/{id}:
    delete:
      summary: Delete a price record
      description: Allowed only for records whose ticker the caller tracks.
      tags: [Ticker Price History]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Record deleted
        '403':
          description: Ticker is not tracked in this context

  /api/trades:
    get:
      summary: List trades
      description: >-
        The event log a position is replayed from. Newest first, scoped to the
        caller's personal or group context.
      tags: [Trades]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: ticker
          in: query
          schema:
            type: string
          description: Restrict to a single ticker.
      responses:
        '200':
          description: Trades
    post:
      summary: Record a trade
      description: >-
        Also rewrites the matching holding, which is a materialized view of this
        log. A position that closes at zero removes its holding.
      tags: [Trades]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeInput'
      responses:
        '201':
          description: Trade recorded
        '400':
          description: Field combination does not match the trade type
        '403':
          description: Not a member of the target group

  /api/trades/position/{ticker}:
    get:
      summary: Replayed position for one ticker
      description: >-
        Quantity, average cost, realized P/L, dividends and fees, derived by
        replaying every trade for the ticker using average cost.
      tags: [Trades]
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Position
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Position'

  /api/trades/{id}:
    put:
      summary: Update a trade
      description: Resyncs the affected holdings, both of them if the ticker changed.
      tags: [Trades]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeInput'
      responses:
        '200':
          description: Trade updated
        '400':
          description: Resulting document does not match its trade type
        '403':
          description: Access denied
        '404':
          description: Trade not found
    delete:
      summary: Delete a trade
      description: Resyncs the holding from the remaining trades.
      tags: [Trades]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Trade deleted
        '403':
          description: Access denied
        '404':
          description: Trade not found

  /api/statement-settings:
    get:
      summary: How the account holder's name appears on their statements
      description: >-
        Used by the statement import to tell a transfer between the owner's own
        accounts from a payment to someone else.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      ownerNames:
                        type: array
                        items: { type: string }
                        example: ["ALEX SMITH", "SMITH ALEX"]
    put:
      summary: Save how the account holder's name appears on their statements
      description: Replaces the list; there is one settings document per owner or group.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerNames]
              properties:
                ownerNames:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      ownerNames:
                        type: array
                        items: { type: string }
        '400':
          description: Invalid list
        '403':
          description: Not a member of that group

  /api/transactions:
    get:
      summary: List cash-flow transactions
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Free text over the note, which carries counterparty and description.
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, amount]
            default: date
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
        - name: skip
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of transactions with totals over the whole filtered set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                          totals:
                            type: object
                            description: >-
                              Over everything the filter matches, not just this
                              page — summing the page would report a number that
                              changes as you scroll.
                            properties:
                              count:
                                type: integer
                              income:
                                type: number
                              expense:
                                type: number
                              net:
                                type: number
                          hasMore:
                            type: boolean
        '400':
          description: Invalid date, type, limit or skip

  /api/transactions/categories:
    get:
      summary: Categories in use
      description: Every category used by a transaction or named by a budget, sorted.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Category names

  /api/transactions/summary:
    get:
      summary: Cash-flow summary
      description: >-
        Per-month income, expense and savings rate; spending per category
        against its budget; and the split of the latest net-worth change between
        money contributed and market movement.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: months
          in: query
          schema:
            type: integer
            minimum: 1
            default: 12
          description: How many months back to cover.
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CashflowSummary'
        '400':
          description: Invalid months value

  /api/transactions/import:
    post:
      summary: Import a bank statement, or an edited export
      description: >-
        Body is raw CSV sent as `text/csv` — a decade of one account runs well
        past the JSON body limit.

        Two shapes are accepted and the shape is detected from the file itself,
        so the caller does not have to say which it holds:

        `seb` — a SEB account statement. Re-importing a period that overlaps one
        already loaded is the expected way to use this: rows are matched on the
        bank's archive reference, so an overlap is recognised and counted as a
        duplicate rather than added again. Transfers between the owner's own
        accounts and self-transfers are left out — see the `skipped` map for what
        and why.

        `pensionikeskus` — an account statement from
        https://public.pensionikeskus.ee, the central Estonian pension registry.
        One export covers every pillar and every fund manager, and the `Sammas`
        column states the pillar outright, so nothing is guessed from a fund
        name. Each contribution appears three times in the file — cash arriving,
        cash leaving for the fund, units bought — and only the unit purchase is
        read, so a contribution counts once. The euro amount is price × units;
        the file states neither directly.

        II pillar is imported as a *pair*: the money into the fund and the same
        amount as the gross pay it came out of. It is deducted before pay
        reaches a bank account, so no account statement can ever record it, and
        writing only the outgoing leg would show money leaving an account that
        never received it. III pillar is paid by bank transfer that the account
        statement already records, so each one is matched against that transfer
        (same amount, within seven days) and only genuinely unmatched
        contributions are written.

        The file is ISO-8859-1 rather than UTF-8; the body is read as raw bytes
        and the encoding sniffed, so callers should send the file unmodified.

        `tumbaland` — a file previously produced by
        `GET /api/transactions/export`, with the categories edited. Only the
        `category` column is read back; rows are matched by `id`. This is the
        round trip for categorising in a spreadsheet: export what is
        uncategorised, fill it in, send it back.

        The response's `format` says which shape was read.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: format
          in: query
          schema:
            type: string
            enum: [seb, tumbaland, pensionikeskus]
          description: >-
            Optional assertion about what the file is. When it disagrees with
            the detected shape the request is rejected rather than guessed at:
            reading a statement as a category list would silently do nothing.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: >-
            Import result — a statement result, a recategorise result, or a
            pension result. `format` says which shape was read.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: object
                            title: Statement import
                            properties:
                              format:
                                type: string
                                enum: [seb]
                              imported:
                                type: integer
                              duplicates:
                                type: integer
                                description: Rows already held from an overlapping import
                              skipped:
                                type: object
                                additionalProperties:
                                  type: integer
                              period:
                                type: object
                                nullable: true
                                properties:
                                  from:
                                    type: string
                                    format: date
                                  to:
                                    type: string
                                    format: date
                              rows:
                                type: integer
                              categories:
                                type: array
                                items:
                                  type: object
                          - type: object
                            title: Pension import
                            properties:
                              format:
                                type: string
                                enum: [pensionikeskus]
                              kind:
                                type: string
                                enum: [pension]
                              imported:
                                type: integer
                                description: Contributions written as new transactions
                              duplicates:
                                type: integer
                                description: Already held from an earlier overlapping import
                              coveredByBank:
                                type: integer
                                description: >-
                                  III pillar contributions already present as the
                                  bank transfer that paid for them, so importing
                                  them would count the same money twice
                              contributions:
                                type: integer
                                description: Every unit purchase the file contained
                              skipped:
                                type: object
                                additionalProperties:
                                  type: integer
                              period:
                                type: object
                                nullable: true
                                properties:
                                  from: { type: string, format: date }
                                  to: { type: string, format: date }
                              funds:
                                type: array
                                items:
                                  type: string
                              byPillar:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    pillar: { type: string, enum: [II, III] }
                                    count: { type: integer }
                                    amount: { type: number }
                                    action: { type: string }
                          - type: object
                            title: Category import
                            properties:
                              format:
                                type: string
                                enum: [tumbaland]
                              kind:
                                type: string
                                enum: [categories]
                              updated:
                                type: integer
                              unchanged:
                                type: integer
                                description: Rows already in the category the file gives
                              notFound:
                                type: integer
                                description: Ids in the file matching nothing in this scope
                              malformed:
                                type: integer
                                description: Rows with no usable id or category
                              categories:
                                type: array
                                items:
                                  type: object
        '400':
          description: >-
            Empty file; a file that is none of the three shapes; a pension
            statement with no unit purchases in it; or a `format` that disagrees
            with what the file actually is
        '403':
          description: Not a member of the target group

  /api/transactions/export:
    get:
      summary: Export transactions as CSV
      description: >-
        The rows the same filters as `GET /api/transactions` would match,
        as a semicolon-separated CSV attachment with a UTF-8 BOM — the shape
        Excel and LibreOffice open without an import wizard.

        The `id` column is what makes the round trip work: edit the `category`
        column and send the file back to `POST /api/transactions/import` to
        apply the changes. Exporting with `category=Uncategorised` is the
        intended way to categorise a backlog in bulk.

        Paging does not apply — the export covers the whole filtered set, capped
        at 20000 rows.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [tumbaland]
            default: tumbaland
          description: >-
            Only the Tumbaland shape is produced. `seb` is rejected: emitting a
            file that claims to be a bank statement would fabricate a record.
      responses:
        '200':
          description: CSV attachment, named after the filter it came from
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid date, type or format

  /api/transactions/analytics:
    get:
      summary: Long-run cash-flow trends
      description: >-
        Income and spending year on year and month by month, which categories
        moved most, and where income came from. Aggregated in the database — the
        history runs to thousands of rows and only the totals are wanted.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Analytics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Analytics'

  /api/transactions/recategorise:
    post:
      summary: Move every row in one category to another
      description: >-
        Categorising a decade of imports one row at a time is not realistic — a
        single unmatched merchant can account for hundreds of rows. Deliberately
        narrowed to one source category plus an optional text match rather than
        accepting an arbitrary filter, so a bulk change cannot reach anything
        already sorted.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromCategory, toCategory]
              properties:
                fromCategory:
                  type: string
                toCategory:
                  type: string
                search:
                  type: string
                  description: Narrow to rows whose note contains this text.
      responses:
        '200':
          description: How many rows moved
        '400':
          description: fromCategory or toCategory missing

  /api/transactions/recurring:
    get:
      summary: Subscriptions and other recurring payments found in the statements
      description: >-
        Groups expenses by merchant and keeps the ones that come at a steady
        cadence (weekly to yearly, at least three charges). Each carries its
        typical amount, what it costs per month and year, when the next charge
        is due, and whether the price changed. Lapsed ones stay in the list,
        marked, but out of the totals.
      tags: [Cash Flow]
      parameters:
        - name: months
          in: query
          schema: { type: integer, minimum: 1, default: 24 }
          description: How far back to look for a pattern
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The recurring payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/RecurringReport' }
        '400':
          description: months is not a positive whole number
        '403':
          description: Not a member of that group

  /api/transactions/{id}/category:
    patch:
      summary: Change one transaction's category
      description: >-
        The only field an imported row can be edited through: everything else
        came from the bank and re-importing would overwrite a local change,
        whereas the category is ours.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category:
                  type: string
      responses:
        '200':
          description: Category updated
        '400':
          description: category missing
        '404':
          description: Transaction not found

  /api/transactions/{id}:
    delete:
      summary: Delete a transaction
      description: >-
        Entries come from statement imports rather than by hand, so there is no
        create or update route. Delete remains, for backing out a bad import —
        re-importing the statement would bring the row back.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Transaction deleted
        '404':
          description: Transaction not found


  /api/category-rules:
    get:
      summary: The owner's categorisation rules, in the order they run
      description: >-
        These decide where an imported transaction lands. They used to be a list
        compiled into the service — which named the owner's employers, bank and
        merchants in source, and meant a merchant it did not know stayed
        uncategorised until someone shipped a release. Now they are per-owner
        data. The first rule that matches wins, so order is load-bearing.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Rules, lowest priority first
    post:
      summary: Teach the app a categorisation
      description: >-
        Writing a rule for text that already has one replaces it rather than
        failing — the second correction is the one the owner means. `matchType`
        defaults to `text`, a diacritic-folded case-insensitive substring test,
        which is all the UI writes; `regex` exists for the rules migrated out of
        source, whose lookaheads no substring can express.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern, category]
              properties:
                pattern:
                  type: string
                matchType:
                  type: string
                  enum: [text, regex]
                  default: text
                category:
                  type: string
                type:
                  type: string
                  enum: [income, expense]
                  description: Restricts the rule to one direction; omit for either.
                note:
                  type: string
      responses:
        '201':
          description: Rule created
        '200':
          description: An existing rule for the same text was replaced
        '400':
          description: Missing field, unknown match type, or an uncompilable regex

  /api/category-rules/apply:
    post:
      summary: Run the rules over transactions already imported
      description: >-
        A new rule otherwise only takes effect on the next statement, leaving the
        backlog that prompted it untouched. `onlyUncategorised` defaults to true
        so a rule written today cannot quietly undo a category set by hand.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                onlyUncategorised:
                  type: boolean
                  default: true
      responses:
        '200':
          description: How many rows were examined and how many moved

  /api/category-rules/{id}:
    put:
      summary: Edit a rule
      description: >-
        `type: null` clears the direction restriction, which is distinct from
        omitting it — omitting leaves the restriction as it was, so a rename
        cannot silently widen a rule to both directions.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                category:
                  type: string
                type:
                  type: string
                  enum: [income, expense]
                  nullable: true
                note:
                  type: string
      responses:
        '200':
          description: Rule updated
        '400':
          description: Blank pattern, or a rename that breaks a regex rule
        '404':
          description: Rule not found
    delete:
      summary: Delete a rule
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Rule deleted
        '404':
          description: Rule not found

  /api/category-rules/{id}/move:
    post:
      summary: Move a rule one place earlier or later
      description: >-
        The first rule that matches wins, so a specific rule has to be orderable
        ahead of a broader one.
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [up, down]
      responses:
        '200':
          description: The rules in their new order

  /api/dashboard:
    get:
      summary: Get dashboard data
      description: KPIs, net worth history, latest allocation and holdings summary.
      tags: [Dashboard]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DashboardData'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT issued by the auth service (httpOnly cookie)

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: query
      required: false
      description: Group context; caller must be a member. Omit for personal data.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    IntervalCoverage:
      type: object
      properties:
        count: { type: integer }
        first: { type: string, format: date, nullable: true, description: Oldest close held }
        last: { type: string, format: date, nullable: true, description: Newest close held }
        fetchedAt:
          type: string
          format: date-time
          nullable: true
          description: The newest write across the series
    RecurringPayment:
      type: object
      properties:
        key: { type: string, description: The normalised merchant it was grouped on }
        merchant: { type: string }
        category: { type: string }
        cadence: { type: string, enum: [weekly, biweekly, monthly, quarterly, yearly] }
        intervalDays: { type: number, description: Median days between charges }
        occurrences: { type: integer }
        regularity: { type: number, description: 'Share of the gaps that fit the cadence, 0 to 1' }
        amount: { type: number, description: Median charge }
        amountVariation: { type: number }
        monthlyEquivalent: { type: number }
        yearlyEquivalent: { type: number }
        firstCharge: { type: string, format: date }
        lastCharge: { type: string, format: date }
        nextExpected: { type: string, format: date }
        daysUntilNext: { type: integer, description: Negative once the expected date has passed }
        status: { type: string, enum: [active, due, lapsed] }
        priceChange:
          type: object
          nullable: true
          properties:
            previousAmount: { type: number }
            currentAmount: { type: number }
            changedOn: { type: string, format: date }
    RecurringReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        monthlyTotal: { type: number, description: What the still-running ones cost per month }
        yearlyTotal: { type: number }
        lapsedCount: { type: integer }
        payments:
          type: array
          description: Most expensive per month first
          items: { $ref: '#/components/schemas/RecurringPayment' }
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string

    AssetClass:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Real estate
        description:
          type: string
        color:
          type: string
          example: '#ec4899'
        kind:
          type: string
          enum: [asset, liability]
          default: asset
          description: >-
            Liability classes subtract from net worth. Their snapshot values are
            still stored as positive magnitudes. Absent on classes created
            before this field existed; treat a missing value as `asset`.
        userId:
          type: string
        groupId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetClassInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        kind:
          type: string
          enum: [asset, liability]
          default: asset
        groupId:
          type: string

    SnapshotEntry:
      type: object
      required: [assetClassId, value]
      properties:
        assetClassId:
          type: string
        value:
          type: number
          minimum: 0
          description: >-
            Current value of the asset class, as a positive magnitude. For a
            liability class this is the balance owed, which the dashboard
            subtracts from net worth.
        gain:
          type: number
          default: 0
          description: Cumulative gain vs invested (0 for classes without a meaningful cost basis)

    Snapshot:
      type: object
      properties:
        _id:
          type: string
        date:
          type: string
          format: date-time
          description: First of the month, UTC
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotEntry'
        userId:
          type: string
        groupId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Holding:
      type: object
      properties:
        _id:
          type: string
        ticker:
          type: string
          example: VUSA.DEX
        quantity:
          type: number
        avgBuyPrice:
          type: number
        buyDate:
          type: string
          format: date
        notes:
          type: string
        userId:
          type: string
        groupId:
          type: string
        displayName:
          type: string
          description: From the matching tracked ticker
        currency:
          type: string
          description: >-
            Currency the per-share amounts (avgBuyPrice, latestPrice, athPrice)
            are quoted in, taken from the tracked ticker.
          example: USD
        baseCurrency:
          type: string
          description: Currency the totals (costBasis, currentValue, valueIncrease) are in.
          example: EUR
        fxRate:
          type: number
          description: Rate applied to convert currency into baseCurrency; absent when unknown.
        missingFxRate:
          type: boolean
          description: >-
            True when no exchange rate was available, in which case the
            converted totals are omitted rather than reported unconverted.
        latestPrice:
          type: number
        latestPriceDate:
          type: string
          format: date-time
        athPrice:
          type: number
        costBasis:
          type: number
          description: quantity x avgBuyPrice, in baseCurrency
        realizedGain:
          type: number
          description: From the trade log, in baseCurrency; zero without trades
        dividends:
          type: number
          description: From the trade log, in baseCurrency
        tradeFees:
          type: number
          description: From the trade log, in baseCurrency
        tradeCount:
          type: integer
          description: How many trades back this position; zero if entered by hand
        currentValue:
          type: number
          description: In baseCurrency
        valueIncrease:
          type: number
          description: In baseCurrency
        percentIncrease:
          type: number
          description: Currency-independent, so present even without an exchange rate

    HoldingInput:
      type: object
      required: [ticker, quantity, avgBuyPrice]
      properties:
        ticker:
          type: string
        displayName:
          type: string
          description: Used to name the auto-created tracked ticker
        currency:
          type: string
          description: >-
            ISO 4217 code the instrument is quoted in, stored on the tracked
            ticker. Leave unset to treat its prices as already being in the
            base currency.
          example: USD
        quantity:
          type: number
        avgBuyPrice:
          type: number
        buyDate:
          type: string
          format: date
        notes:
          type: string
        groupId:
          type: string

    TrackedTickerInput:
      type: object
      required: [ticker, displayName]
      properties:
        ticker:
          type: string
        displayName:
          type: string
        description:
          type: string
        currency:
          type: string
          description: ISO 4217 code the instrument is quoted in
          example: USD
        isActive:
          type: boolean
          default: true
          description: Whether the daily price job fetches this ticker
        groupId:
          type: string

    TradeInput:
      type: object
      required: [ticker, type, date]
      properties:
        ticker:
          type: string
        type:
          type: string
          enum: [buy, sell, dividend, fee]
        date:
          type: string
          format: date
        quantity:
          type: number
          minimum: 0
          description: Shares — required for buy and sell
        price:
          type: number
          minimum: 0
          description: Per share — required for buy and sell
        amount:
          type: number
          minimum: 0
          description: Cash total — required for dividend and fee
        fees:
          type: number
          minimum: 0
          description: Transaction costs on a buy or sell
        notes:
          type: string
        groupId:
          type: string

    Position:
      type: object
      description: >-
        Derived by replaying a ticker's trades using average cost, so a sell's
        realized gain does not depend on which lot the user believes they sold.
      properties:
        ticker:
          type: string
        quantity:
          type: number
        avgBuyPrice:
          type: number
          description: Average cost per remaining share, fees included
        costBasis:
          type: number
        realizedGain:
          type: number
          description: Crystallised by sells, net of fees
        dividends:
          type: number
          description: Income received; not deducted from cost basis
        fees:
          type: number
        netInvested:
          type: number
          description: Cash in minus cash out
        tradeCount:
          type: integer

    TransactionInput:
      type: object
      required: [date, amount, type, category]
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
          minimum: 0
          description: Positive magnitude; direction is carried by `type`
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        note:
          type: string
        groupId:
          type: string


    PeriodTotals:
      type: object
      properties:
        income:
          type: number
        expense:
          type: number
          description: Everything that left the account, consumption and investing alike
        consumption:
          type: number
          description: What was actually consumed — expense less money moved into assets
        invested:
          type: number
        savings:
          type: number
          description: income − consumption; investing counts as kept, not spent
        savingsRate:
          type: number
          nullable: true
        months:
          type: integer
        from:
          type: string
          example: '2025-09'
        to:
          type: string
          example: '2026-08'

    Analytics:
      type: object
      properties:
        trailing:
          type: object
          description: >-
            The last twelve months of data and the twelve before. Calendar years
            are the wrong comparison for most of the year — in March, "this
            year" is two months against twelve — so the headline figures and
            every category comparison use these. Anchored on the newest month
            with data rather than on today, because an import can lag.
          properties:
            current:
              $ref: '#/components/schemas/PeriodTotals'
            previous:
              type: object
              allOf:
                - $ref: '#/components/schemas/PeriodTotals'
              nullable: true
        years:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              partial:
                type: boolean
                description: Fewer than twelve months of data — not comparable with a full year
              months:
                type: integer
              income:
                type: number
              expense:
                type: number
              savings:
                type: number
              savingsRate:
                type: number
                nullable: true
              incomeChange:
                type: number
                nullable: true
                description: Against the previous year; null for the first on record
              incomeChangePct:
                type: number
                nullable: true
              expenseChange:
                type: number
                nullable: true
              expenseChangePct:
                type: number
                nullable: true
        months:
          type: array
          description: >-
            Continuous month series, zero-filled. A gap would otherwise be drawn
            as a straight line between two distant months.
          items:
            type: object
            properties:
              period:
                type: string
                example: '2026-07'
              income:
                type: number
              expense:
                type: number
              savings:
                type: number
        categoryTrends:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              byYear:
                type: object
                additionalProperties:
                  type: number
              total:
                type: number
              latest:
                type: number
              previous:
                type: number
              change:
                type: number
              changePct:
                type: number
                nullable: true
              perMonth:
                type: number
                description: Trailing-window spend divided by the window length
        incomeSources:
          type: array
          items:
            type: object
        monthlyAverages:
          type: array
          items:
            type: object
        currency:
          type: string

    CashflowSummary:
      type: object
      properties:
        months:
          type: array
          items:
            $ref: '#/components/schemas/MonthSummary'
        categories:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              spent:
                type: number
                description: Monthly average across the months that have transactions
        totals:
          $ref: '#/components/schemas/MonthSummary'
        growth:
          type: object
          nullable: true
          description: Null until there are two check-ins to compare
          properties:
            from:
              type: string
            to:
              type: string
            netWorthChange:
              type: number
            contributions:
              type: number
            marketGrowth:
              type: number
              description: netWorthChange − contributions
            complete:
              type: boolean
              description: >-
                False when the period has no transactions, in which case
                contributions are a lower bound and the remainder is not purely
                market movement.

    MonthSummary:
      type: object
      properties:
        month:
          type: string
          example: '2026-07'
        income:
          type: number
        expense:
          type: number
        savings:
          type: number
          description: income − expense
        savingsRate:
          type: number
          nullable: true
          description: Share of income saved. Null when no income came in.

    DashboardData:
      type: object
      properties:
        kpis:
          type: object
          properties:
            netWorth:
              type: number
              description: assets - liabilities at the latest check-in
            assets:
              type: number
            liabilities:
              type: number
              description: Positive magnitude of what is owed
            asOf:
              type: string
              format: date-time
              nullable: true
            monthChange:
              type: number
              nullable: true
              description: >-
                Change against the check-in exactly one calendar month earlier.
                Null when there is no check-in at that offset — a gap in the
                history is not a change of zero.
            monthChangePct:
              type: number
              nullable: true
              description: Null when the baseline is missing or not positive
            yearChange:
              type: number
              nullable: true
              description: As monthChange, against twelve months earlier
            yearChangePct:
              type: number
              nullable: true
            totalGain:
              type: number
            totalGainPct:
              type: number
        netWorthHistory:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              total:
                type: number
                description: assets - liabilities
              assets:
                type: number
              liabilities:
                type: number
              byClass:
                type: object
                description: Per-class value, negative for liability classes
                additionalProperties:
                  type: number
        allocation:
          type: array
          items:
            type: object
            properties:
              assetClassId:
                type: string
              name:
                type: string
              color:
                type: string
              value:
                type: number
              gain:
                type: number
              percentage:
                type: number
                description: Share of gross assets, not of net worth
          description: Asset classes only; liability classes are listed separately
        liabilities:
          type: array
          items:
            type: object
            properties:
              assetClassId:
                type: string
              name:
                type: string
              color:
                type: string
              value:
                type: number
                description: Positive magnitude owed
        assetColors:
          type: object
          additionalProperties:
            type: string
        currency:
          type: string
          description: Base currency every amount in this payload is expressed in
          example: EUR
        cashflow:
          type: object
          nullable: true
          description: Null until there are transactions to explain the change with
          properties:
            latestMonth:
              type: object
              allOf:
                - $ref: '#/components/schemas/MonthSummary'
              nullable: true
            averageSavingsRate:
              type: number
              nullable: true
              description: Mean rate across the months that have transactions
            growth:
              type: object
              nullable: true
              description: See the growth block on /api/transactions/summary
        holdings:
          type: object
          nullable: true
          properties:
            count:
              type: integer
            totalValue:
              type: number
            totalCost:
              type: number
            gain:
              type: number
            gainPct:
              type: number
            unconverted:
              type: integer
              description: Holdings left out of these totals for want of an exchange rate
