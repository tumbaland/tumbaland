openapi: 3.0.3
info:
  title: Tumbaland Finance Service API
  description: |
    Personal finance tracking: monthly net-worth snapshots per asset class,
    market-traded holdings with daily price collection, and dashboard analytics.
  version: 2.0.0
  contact:
    name: Tumbaland Support
    email: support@tumbaland.com

servers:
  - url: http://localhost:4003
    description: Development server
  - url: https://api.tumbaland.com/finance
    description: Production server

tags:
  - name: Health
    description: Service health monitoring
  - name: Monitoring
    description: Service metrics and monitoring
  - name: Asset Classes
    description: Categories tracked in monthly check-ins (e.g. Cash, Investments, Real estate)
  - name: Snapshots
    description: Monthly net-worth check-ins (one document per month with all asset class values)
  - name: Holdings
    description: ETF/stock positions, enriched with latest prices
  - name: Tracked Tickers
    description: Instruments whose prices are fetched daily from Alpha Vantage
  - name: Ticker Price History
    description: Historical price data for tracked instruments
  - name: Dashboard
    description: Net worth, allocation and investment analytics

security:
  - cookieAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service is unhealthy (e.g. MongoDB not connected)

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      tags: [Monitoring]
      security: []
      responses:
        '200':
          description: Metrics data
          content:
            text/plain:
              schema:
                type: string

  /api/asset-classes:
    get:
      summary: List asset classes
      description: Personal classes by default; pass groupId for a group context.
      tags: [Asset Classes]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of asset classes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetClass'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create asset class
      tags: [Asset Classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetClassInput'
      responses:
        '201':
          description: Asset class created
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/asset-classes/{id}:
    put:
      summary: Update asset class
      tags: [Asset Classes]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetClassInput'
      responses:
        '200':
          description: Asset class updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete asset class
      tags: [Asset Classes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Asset class deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/snapshots:
    get:
      summary: List monthly snapshots
      description: Sorted by date descending. Personal snapshots by default; pass groupId for a group context.
      tags: [Snapshots]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Snapshot'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/snapshots/{month}:
    put:
      summary: Create or replace the snapshot for a month (the monthly check-in)
      description: Upserts the full set of asset class values for the month in one call.
      tags: [Snapshots]
      parameters:
        - name: month
          in: path
          required: true
          description: Month key, YYYY-MM
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-07'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/SnapshotEntry'
                groupId:
                  type: string
      responses:
        '200':
          description: Snapshot saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/snapshots/{id}:
    delete:
      summary: Delete a snapshot
      tags: [Snapshots]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Snapshot deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/holdings:
    get:
      summary: List holdings with price enrichment
      description: >
        Personal holdings by default; pass groupId for a group context. Each holding is
        enriched with displayName (from its tracked ticker), latestPrice, latestPriceDate,
        athPrice, currentValue, valueIncrease and percentIncrease.
      tags: [Holdings]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of holdings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Holding'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create holding
      description: >
        Also starts tracking the holding's ticker in the same context (if not already
        tracked) so the daily price job covers it. Pass displayName to name the
        auto-created tracked ticker.
      tags: [Holdings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldingInput'
      responses:
        '201':
          description: Holding created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/holdings/{id}:
    put:
      summary: Update holding
      tags: [Holdings]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldingInput'
      responses:
        '200':
          description: Holding updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete holding
      tags: [Holdings]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Holding deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tracked-tickers:
    get:
      summary: List tracked tickers
      tags: [Tracked Tickers]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: List of tracked tickers
    post:
      summary: Track a ticker
      tags: [Tracked Tickers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedTickerInput'
      responses:
        '201':
          description: Ticker tracked

  /api/tracked-tickers/search:
    get:
      summary: Search ticker symbols
      description: Alpha Vantage SYMBOL_SEARCH (costs 1 API call; free plan is 25/day).
      tags: [Tracked Tickers]
      parameters:
        - name: q
          in: query
          required: true
          description: Search term, minimum 2 characters
          schema:
            type: string
      responses:
        '200':
          description: Matching symbols
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Alpha Vantage rate limit exhausted

  /api/tracked-tickers/{id}:
    put:
      summary: Update tracked ticker
      tags: [Tracked Tickers]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedTickerInput'
      responses:
        '200':
          description: Ticker updated
    delete:
      summary: Stop tracking a ticker
      description: Saved price history is kept.
      tags: [Tracked Tickers]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ticker deleted

  /api/ticker-price-history:
    get:
      summary: Get all price history records
      tags: [Ticker Price History]
      responses:
        '200':
          description: Price history records

  /api/ticker-price-history/fetch:
    post:
      summary: Fetch and save latest prices
      description: Fetches the latest quote for one ticker, or for all tracked tickers when body is empty.
      tags: [Ticker Price History]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticker:
                  type: string
      responses:
        '200':
          description: Prices fetched and saved
        '429':
          description: Alpha Vantage rate limit exhausted

  /api/ticker-price-history/fetch-all:
    post:
      summary: Fetch ~100 days of history for a ticker
      tags: [Ticker Price History]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker]
              properties:
                ticker:
                  type: string
      responses:
        '200':
          description: History fetched and saved
        '429':
          description: Alpha Vantage rate limit exhausted

  /api/ticker-price-history/{id}:
    delete:
      summary: Delete a price record
      tags: [Ticker Price History]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Record deleted

  /api/dashboard:
    get:
      summary: Get dashboard data
      description: KPIs, net worth history, latest allocation and holdings summary.
      tags: [Dashboard]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DashboardData'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT issued by the auth service (httpOnly cookie)

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: query
      required: false
      description: Group context; caller must be a member. Omit for personal data.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string

    AssetClass:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Real estate
        description:
          type: string
        color:
          type: string
          example: '#ec4899'
        userId:
          type: string
        groupId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetClassInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        groupId:
          type: string

    SnapshotEntry:
      type: object
      required: [assetClassId, value]
      properties:
        assetClassId:
          type: string
        value:
          type: number
          minimum: 0
          description: Current value of the asset class
        gain:
          type: number
          default: 0
          description: Cumulative gain vs invested (0 for classes without a meaningful cost basis)

    Snapshot:
      type: object
      properties:
        _id:
          type: string
        date:
          type: string
          format: date-time
          description: First of the month, UTC
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotEntry'
        userId:
          type: string
        groupId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Holding:
      type: object
      properties:
        _id:
          type: string
        ticker:
          type: string
          example: VUSA.DEX
        quantity:
          type: number
        avgBuyPrice:
          type: number
        buyDate:
          type: string
          format: date
        notes:
          type: string
        userId:
          type: string
        groupId:
          type: string
        displayName:
          type: string
          description: From the matching tracked ticker
        latestPrice:
          type: number
        latestPriceDate:
          type: string
          format: date-time
        athPrice:
          type: number
        currentValue:
          type: number
        valueIncrease:
          type: number
        percentIncrease:
          type: number

    HoldingInput:
      type: object
      required: [ticker, quantity, avgBuyPrice]
      properties:
        ticker:
          type: string
        displayName:
          type: string
          description: Used to name the auto-created tracked ticker
        quantity:
          type: number
        avgBuyPrice:
          type: number
        buyDate:
          type: string
          format: date
        notes:
          type: string
        groupId:
          type: string

    TrackedTickerInput:
      type: object
      required: [ticker, displayName]
      properties:
        ticker:
          type: string
        displayName:
          type: string
        description:
          type: string
        isActive:
          type: boolean
          default: true
          description: Whether the daily price job fetches this ticker
        groupId:
          type: string

    DashboardData:
      type: object
      properties:
        kpis:
          type: object
          properties:
            netWorth:
              type: number
            asOf:
              type: string
              format: date-time
              nullable: true
            monthChange:
              type: number
            monthChangePct:
              type: number
            yearChange:
              type: number
            yearChangePct:
              type: number
            totalGain:
              type: number
            totalGainPct:
              type: number
        netWorthHistory:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              total:
                type: number
              byClass:
                type: object
                additionalProperties:
                  type: number
        allocation:
          type: array
          items:
            type: object
            properties:
              assetClassId:
                type: string
              name:
                type: string
              color:
                type: string
              value:
                type: number
              gain:
                type: number
              percentage:
                type: number
        assetColors:
          type: object
          additionalProperties:
            type: string
        holdings:
          type: object
          nullable: true
          properties:
            count:
              type: integer
            totalValue:
              type: number
            totalCost:
              type: number
            gain:
              type: number
            gainPct:
              type: number
