openapi: 3.0.3
info:
  title: Tumbaland Finance Service API
  description: API for managing financial data including asset classes, allocations, portfolios, and market data
  version: 1.0.0
  contact:
    name: Tumbaland Support
    email: support@tumbaland.com

servers:
  - url: http://localhost:4003
    description: Development server
  - url: https://api.tumbaland.com/finance
    description: Production server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Check if the finance service is running
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      description: Get service metrics for monitoring
      tags:
        - Monitoring
      responses:
        '200':
          description: Metrics data
          content:
            text/plain:
              schema:
                type: string

  /api/asset-classes:
    get:
      summary: Get asset classes
      description: Retrieve all asset classes for the authenticated user or specified group
      tags:
        - Asset Classes
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          description: Optional group ID to filter asset classes
          schema:
            type: string
      responses:
        '200':
          description: List of asset classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetClass'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create asset class
      description: Create a new asset class for the authenticated user
      tags:
        - Asset Classes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetClassCreate'
      responses:
        '201':
          description: Asset class created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetClass'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/asset-classes/{id}:
    put:
      summary: Update asset class
      description: Update an existing asset class
      tags:
        - Asset Classes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Asset class ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetClassUpdate'
      responses:
        '200':
          description: Asset class updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetClass'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset class not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete asset class
      description: Delete an asset class
      tags:
        - Asset Classes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Asset class ID
          schema:
            type: string
      responses:
        '200':
          description: Asset class deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset class not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/asset-allocations:
    get:
      summary: Get asset allocations
      description: Retrieve all asset allocations for the authenticated user or specified group
      tags:
        - Asset Allocations
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          description: Optional group ID to filter allocations
          schema:
            type: string
        - name: startDate
          in: query
          description: Start date filter (ISO format)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date filter (ISO format)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of asset allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetAllocation'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create asset allocation
      description: Create a new asset allocation for the authenticated user
      tags:
        - Asset Allocations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetAllocationCreate'
      responses:
        '201':
          description: Asset allocation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAllocation'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/asset-allocations/{id}:
    put:
      summary: Update asset allocation
      description: Update an existing asset allocation
      tags:
        - Asset Allocations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Asset allocation ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetAllocationUpdate'
      responses:
        '200':
          description: Asset allocation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAllocation'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset allocation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete asset allocation
      description: Delete an asset allocation
      tags:
        - Asset Allocations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Asset allocation ID
          schema:
            type: string
      responses:
        '200':
          description: Asset allocation deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset allocation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ticker-price-history:
    get:
      summary: Get ticker price history
      description: Retrieve historical price data for tracked tickers
      tags:
        - Ticker Price History
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          description: Optional group ID to filter price history
          schema:
            type: string
        - name: ticker
          in: query
          description: Filter by specific ticker symbol
          schema:
            type: string
        - name: startDate
          in: query
          description: Start date filter (ISO format)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date filter (ISO format)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of ticker price history records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TickerPriceHistory'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Fetch and save latest ticker prices
      description: Fetch latest prices from external APIs and save to database
      tags:
        - Ticker Price History
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prices fetched and saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAndSavePricesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ticker-price-history/fetch-all:
    post:
      summary: Fetch and save all historical prices for tickers
      description: Fetch complete historical price data for all tracked tickers
      tags:
        - Ticker Price History
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historical prices fetched and saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAndSavePricesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ticker-price-history/{id}:
    delete:
      summary: Delete ticker price history record
      description: Delete a specific price history record
      tags:
        - Ticker Price History
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Price history record ID
          schema:
            type: string
      responses:
        '200':
          description: Price history record deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Price history record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tracked-tickers:
    get:
      summary: Get tracked tickers
      description: Retrieve all tracked tickers for the authenticated user or specified group
      tags:
        - Tracked Tickers
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          description: Optional group ID to filter tracked tickers
          schema:
            type: string
      responses:
        '200':
          description: List of tracked tickers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackedTicker'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Add tracked ticker
      description: Add a new ticker to track
      tags:
        - Tracked Tickers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedTickerCreate'
      responses:
        '201':
          description: Tracked ticker added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedTicker'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tracked-tickers/{id}:
    put:
      summary: Update tracked ticker
      description: Update an existing tracked ticker
      tags:
        - Tracked Tickers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tracked ticker ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedTickerUpdate'
      responses:
        '200':
          description: Tracked ticker updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedTicker'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tracked ticker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Remove tracked ticker
      description: Remove a tracked ticker
      tags:
        - Tracked Tickers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tracked ticker ID
          schema:
            type: string
      responses:
        '200':
          description: Tracked ticker removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tracked ticker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user-portfolio:
    get:
      summary: Get user portfolios
      description: Retrieve all user portfolio holdings
      tags:
        - User Portfolio
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          description: Optional group ID to filter portfolios
          schema:
            type: string
      responses:
        '200':
          description: List of user portfolio holdings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPortfolio'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Add portfolio holding
      description: Add a new holding to the user portfolio
      tags:
        - User Portfolio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPortfolioCreate'
      responses:
        '201':
          description: Portfolio holding added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPortfolio'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user-portfolio/{id}:
    put:
      summary: Update portfolio holding
      description: Update an existing portfolio holding
      tags:
        - User Portfolio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Portfolio holding ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPortfolioUpdate'
      responses:
        '200':
          description: Portfolio holding updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPortfolio'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Portfolio holding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Remove portfolio holding
      description: Remove a holding from the user portfolio
      tags:
        - User Portfolio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Portfolio holding ID
          schema:
            type: string
      responses:
        '200':
          description: Portfolio holding removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Portfolio holding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/dashboard:
    get:
      summary: Get dashboard data
      description: Retrieve comprehensive dashboard data including KPIs, portfolio history, and asset allocation
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          description: Optional group ID to filter dashboard data
          schema:
            type: string
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AssetClass:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        userId:
          type: string
        groupId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - _id
        - name
        - userId

    AssetClassCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        color:
          type: string
        groupId:
          type: string
      required:
        - name

    AssetClassUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        color:
          type: string
      additionalProperties: false

    AssetAllocation:
      type: object
      properties:
        _id:
          type: string
        assetClassId:
          type: string
        totalValue:
          type: number
          minimum: 0
        gain:
          type: number
        date:
          type: string
          format: date-time
        userId:
          type: string
        groupId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - _id
        - assetClassId
        - totalValue
        - gain
        - date
        - userId

    AssetAllocationCreate:
      type: object
      properties:
        assetClassId:
          type: string
        totalValue:
          type: number
          minimum: 0
        gain:
          type: number
        date:
          type: string
          format: date-time
        groupId:
          type: string
      required:
        - assetClassId
        - totalValue
        - gain
        - date

    AssetAllocationUpdate:
      type: object
      properties:
        assetClassId:
          type: string
        totalValue:
          type: number
          minimum: 0
        gain:
          type: number
        date:
          type: string
          format: date-time
      required:
        - assetClassId
        - totalValue
        - gain
        - date

    TickerPriceHistory:
      type: object
      properties:
        date:
          type: string
          format: date
        ticker:
          type: string
        price:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        volume:
          type: number
      required:
        - date
        - ticker
        - price

    FetchAndSavePricesResponse:
      type: object
      properties:
        message:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/TickerPriceHistory'
      required:
        - message
        - results

    TrackedTicker:
      type: object
      properties:
        _id:
          type: string
        ticker:
          type: string
        displayName:
          type: string
        description:
          type: string
        dateAdded:
          type: string
          format: date-time
        isActive:
          type: boolean
      required:
        - _id
        - ticker
        - displayName
        - dateAdded
        - isActive

    TrackedTickerCreate:
      type: object
      properties:
        ticker:
          type: string
        displayName:
          type: string
        description:
          type: string
        isActive:
          type: boolean
          default: true
      required:
        - ticker
        - displayName

    TrackedTickerUpdate:
      type: object
      properties:
        ticker:
          type: string
        displayName:
          type: string
        description:
          type: string
        isActive:
          type: boolean
      required:
        - ticker
        - displayName

    UserPortfolio:
      type: object
      properties:
        ticker:
          type: string
        quantity:
          type: number
        avgBuyPrice:
          type: number
        buyDate:
          type: string
          format: date
        notes:
          type: string
        latestPrice:
          type: number
        athPrice:
          type: number
        currentValue:
          type: number
        valueIncrease:
          type: number
        percentIncrease:
          type: number
      required:
        - ticker
        - quantity
        - avgBuyPrice

    UserPortfolioCreate:
      type: object
      properties:
        ticker:
          type: string
        quantity:
          type: number
        avgBuyPrice:
          type: number
        buyDate:
          type: string
          format: date
        notes:
          type: string
      required:
        - ticker
        - quantity
        - avgBuyPrice

    UserPortfolioUpdate:
      type: object
      properties:
        ticker:
          type: string
        quantity:
          type: number
        avgBuyPrice:
          type: number
        buyDate:
          type: string
          format: date
        notes:
          type: string
      required:
        - ticker
        - quantity
        - avgBuyPrice

    DashboardResponse:
      type: object
      properties:
        kpis:
          type: object
          properties:
            totalPortfolioValue:
              type: number
            totalInvested:
              type: number
            totalGains:
              type: number
            totalGainsPercentage:
              type: number
            monthlyChange:
              type: number
