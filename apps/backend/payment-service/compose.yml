services:
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/tumbaland-payment-service:latest
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5005:5005'
    environment:
      - PORT=5005
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYMENT_URL=${PAYMENT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Gates /internal/entitlements, which every other service reads.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Group membership is asked of group-service on each request (backend-core currentGroupsOf).
      - GROUP_INTERNAL_URL=${GROUP_INTERNAL_URL}
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
