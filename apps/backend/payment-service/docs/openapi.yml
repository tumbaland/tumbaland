openapi: 3.0.3
info:
  title: Payment Service API
  description: API for payment processing, subscription management, and plan administration
  version: 1.0.0
  contact:
    name: Tumbaland Team
servers:
  - url: http://localhost:5005
    description: Development server
  - url: https://payment-api.tumbaland.eu
    description: Production server

tags:
  - name: Health
    description: Service health monitoring
  - name: Plans
    description: Subscription plan management operations
  - name: Subscriptions
    description: User subscription management and lifecycle
  - name: Payments
    description: Payment processing and history
  - name: Webhooks
    description: External webhook handling (Stripe)

components:
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error description"
      required:
        - success
        - message

    Payment:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        userEmail:
          type: string
          format: email
          example: "user@example.com"
        amountCents:
          type: integer
          minimum: 0
          example: 2999
        currency:
          type: string
          default: "eur"
          example: "eur"
        type:
          type: string
          enum: ["subscription", "one_time"]
          example: "one_time"
        status:
          type: string
          enum: ["succeeded", "pending", "failed", "refunded"]
          example: "succeeded"
        stripePaymentIntentId:
          type: string
          nullable: true
          example: "pi_1234567890"
        stripeChargeId:
          type: string
          nullable: true
          example: "ch_1234567890"
        metadata:
          type: object
          nullable: true
          description: "Additional payment metadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userEmail
        - amountCents
        - type
        - status

    Plan:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: "Pro Plan"
        code:
          type: string
          example: "pro"
        description:
          type: string
          nullable: true
          example: "Professional plan with advanced features"
        priceMonthlyCents:
          type: integer
          minimum: 0
          example: 2999
        priceYearlyCents:
          type: integer
          nullable: true
          minimum: 0
          example: 29990
        features:
          type: array
          items:
            type: string
          example: ["Unlimited albums", "Advanced analytics", "Priority support"]
        isActive:
          type: boolean
          default: true
          example: true
        stripePriceId:
          type: string
          nullable: true
          example: "price_1234567890"
        isPublic:
          type: boolean
          description: Shown on the pricing page
        limits:
          $ref: '#/components/schemas/PlanLimits'
        effectiveLimits:
          $ref: '#/components/schemas/PlanLimits'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - code
        - priceMonthlyCents
        - features
        - isActive

    PlanLimits:
      type: object
      description: Every key is optional. A ceiling is a whole number, or -1 for unlimited.
      properties:
        meters:
          type: object
          additionalProperties: { type: integer, minimum: -1 }
          example: { storageBytes: 1073741824 }
        features:
          type: object
          additionalProperties: { type: boolean }
        retentionDays: { type: integer, minimum: -1 }

    ResolvedEntitlements:
      type: object
      properties:
        email: { type: string }
        planCode: { type: string }
        status: { type: string, nullable: true }
        limits: { $ref: '#/components/schemas/PlanLimits' }
        upgradeTo: { type: string }
        isComp: { type: boolean, description: Granted by an admin rather than bought }
        hasOverride: { type: boolean, description: A per-person override adjusted the plan's limits }

    EntitlementOverride:
      type: object
      properties:
        userEmail: { type: string }
        meters: { type: object, additionalProperties: { type: integer, minimum: -1 } }
        features: { type: object, additionalProperties: { type: boolean } }
        retentionDays: { type: integer, minimum: -1 }
        reason: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        grantedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Subscription:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        userEmail:
          type: string
          format: email
          example: "user@example.com"
        planCode:
          type: string
          example: "pro"
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum: ["active", "past_due", "canceled", "incomplete"]
          example: "active"
        renewsAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-01T00:00:00.000Z"
        cancelAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-01T00:00:00.000Z"
        canceledAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-11-15T10:30:00.000Z"
        stripeCustomerId:
          type: string
          nullable: true
          example: "cus_1234567890"
        stripeSubscriptionId:
          type: string
          nullable: true
          example: "sub_1234567890"
        latestInvoiceId:
          type: string
          nullable: true
          example: "in_1234567890"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userEmail
        - planCode
        - plan
        - status

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["ok", "error"]
          example: "ok"
        service:
          type: string
          example: "payment-service"
        type:
          type: string
          example: "backend"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"
        description:
          type: string
          example: "Payment processing and subscription management service"
        dependencies:
          type: object
          properties:
            mongodb:
              type: string
              enum: ["connected", "disconnected"]
              example: "connected"
        error:
          type: string
          nullable: true
          example: null
      required:
        - status
        - service
        - type
        - timestamp
        - version
        - description
        - dependencies

    # Response schemas
    PaymentsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
      required:
        - success
        - payments

    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        payment:
          $ref: '#/components/schemas/Payment'
      required:
        - success
        - payment

    PlansResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
      required:
        - success
        - plans

    PlanResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        plan:
          $ref: '#/components/schemas/Plan'
      required:
        - success
        - plan

    PlansBulkResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
      required:
        - success
        - plans

    SubscriptionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true
      required:
        - success

    SubscriptionsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
      required:
        - success
        - subscriptions

    CheckoutSessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        sessionId:
          type: string
          example: "cs_test_1234567890"
        url:
          type: string
          format: uri
          example: "https://checkout.stripe.com/c/pay/cs_test_1234567890"
        free:
          type: boolean
          nullable: true
          description: The plan costs nothing and was activated without Stripe.
          example: false
        changed:
          type: boolean
          nullable: true
          description: >-
            The caller's existing subscription was switched onto this plan in
            place, with the difference prorated. No checkout to visit, so `url`
            points at the subscription page rather than at Stripe.
          example: false
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true
      required:
        - success

    CheckoutSessionStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: "complete"
        payment_status:
          type: string
          example: "paid"
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true
      required:
        - success
        - status
        - payment_status

    StripeWebhookResponse:
      type: object
      properties:
        received:
          type: boolean
          example: true
        duplicate:
          type: boolean
          nullable: true
          example: false
      required:
        - received

    # Request schemas
    CreateOneTimePaymentRequest:
      type: object
      properties:
        amountCents:
          type: integer
          minimum: 50
          example: 2999
        currency:
          type: string
          default: "eur"
          example: "eur"
      required:
        - amountCents

    CreatePlanRequest:
      type: object
      properties:
        name:
          type: string
          example: "Pro Plan"
        code:
          type: string
          example: "pro"
        description:
          type: string
          example: "Professional plan with advanced features"
        priceMonthlyCents:
          type: integer
          minimum: 0
          example: 2999
        priceYearlyCents:
          type: integer
          minimum: 0
          example: 29990
        features:
          type: array
          items:
            type: string
          example: ["Unlimited albums", "Advanced analytics", "Priority support"]
      required:
        - name
        - code
        - priceMonthlyCents

    CreatePlansBulkRequest:
      type: array
      items:
        $ref: '#/components/schemas/CreatePlanRequest'

    UpdateStripePricesRequest:
      type: object
      properties:
        stripePriceId:
          type: string
          example: "price_1234567890"
      required:
        - stripePriceId

    CreateCheckoutSessionRequest:
      type: object
      properties:
        planCode:
          type: string
          example: "pro"
        successUrl:
          type: string
          format: uri
          example: "https://app.tumbaland.eu/subscription/success"
        cancelUrl:
          type: string
          format: uri
          example: "https://app.tumbaland.eu/subscription/cancel"
      required:
        - planCode

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from auth service
    internalAuth:
      type: apiKey
      in: header
      name: x-internal-token
      description: Internal service token for inter-service communication
    stripeWebhookAuth:
      type: apiKey
      in: header
      name: stripe-signature
      description: Stripe webhook signature for webhook validation

paths:
  # Health check endpoint
  /health:
    get:
      security: []
      tags:
        - Health
      summary: Health check
      description: |
        Returns the health status of the payment service including database connectivity.
        Used for monitoring and load balancer health checks.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # Plan Management Endpoints
  /api/plans:
    get:
      tags:
        - Plans
      summary: List public plans
      description: |
        The public plan catalog, sorted by monthly price, each plan carrying
        `effectiveLimits` — the limits after code defaults fill whatever the
        plan document leaves unset. This is what the landing page's pricing
        table renders, so the ceiling on a card and the ceiling that produces a
        402 are one value read from one place.

        **Optionally authenticated.** A signed-out visitor gets the public
        catalog; a signed-in caller additionally gets the non-public plan they
        are actually on (staff, comped), since a pricing page that shows a user
        every plan except their own reads as "you are on free". An invalid or
        expired token is treated as no token rather than as a 401.
      responses:
        '200':
          description: Plans retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
        - bearerAuth: []

    post:
      tags:
        - Plans
      summary: Create a new plan
      description: |
        Creates a new subscription plan.
        Requires admin privileges.
        Supports both single plan creation and bulk creation via array payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreatePlanRequest'
                - $ref: '#/components/schemas/CreatePlansBulkRequest'
      responses:
        '201':
          description: Plan(s) created successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlanResponse'
                  - $ref: '#/components/schemas/PlansBulkResponse'
        '400':
          description: Bad request - invalid plan data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - plan code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/plans/bulk:
    post:
      tags:
        - Plans
      summary: Create multiple plans
      description: |
        Creates multiple subscription plans in a single request.
        Requires admin privileges.
        Validates all plans before creating any to ensure atomicity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlansBulkRequest'
      responses:
        '201':
          description: Plans created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansBulkResponse'
        '400':
          description: Bad request - invalid plan data or duplicate codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - one or more plan codes already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/plans/all:
    get:
      tags: [Plans]
      summary: List every plan, hidden and inactive ones included
      description: Requires admin privileges. Each plan carries `effectiveLimits`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/Plan' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/plans/catalog:
    get:
      tags: [Plans]
      summary: The meters and features a plan can limit, with labels and units
      description: |
        Requires admin privileges. An admin form builds its limits fields from
        this, so a meter added in backend-core appears there with no frontend
        change.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  catalog:
                    type: object
                    description: The meter and feature vocabulary from backend-core
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/plans/{code}:
    patch:
      tags: [Plans]
      summary: Edit a plan
      description: |
        Requires admin privileges. Any of the fields, at least one. `code` cannot
        change: subscriptions store it.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: pro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                description: { type: string }
                priceMonthlyCents: { type: integer, minimum: 0 }
                priceYearlyCents: { type: integer, minimum: 0 }
                features: { type: array, items: { type: string } }
                limits: { $ref: '#/components/schemas/PlanLimits' }
                isActive: { type: boolean }
                isPublic: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  plan: { $ref: '#/components/schemas/Plan' }
        '400':
          description: No updatable field, or an invalid one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/plans/{code}/limits:
    put:
      tags: [Plans]
      summary: Set a plan's limits
      description: |
        Requires admin privileges. Merges into the stored limits, or replaces
        them with `?replace=true`. Unknown meter or feature keys are refused by
        name rather than dropped. A ceiling is a whole number, or -1 for
        unlimited.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: pro
        - name: replace
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanLimits' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  plan: { $ref: '#/components/schemas/Plan' }
                  effectiveLimits: { $ref: '#/components/schemas/PlanLimits' }
        '400':
          description: Empty, or an unknown key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/plans/{code}/stripe-prices:
    patch:
      tags:
        - Plans
      summary: Update Stripe price ID for a plan
      description: |
        Updates the Stripe price ID associated with a plan.
        Requires admin privileges.
        Used when creating new prices in Stripe for existing plans.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Plan code
          example: "pro"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStripePricesRequest'
      responses:
        '200':
          description: Plan updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          description: Bad request - invalid stripePriceId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  # Subscription Management Endpoints
  /api/subscriptions/me:
    get:
      tags:
        - Subscriptions
      summary: Get user's current subscription
      description: |
        Retrieves the user's best active subscription based on price and status.
        Returns the highest-priced active/past_due/incomplete subscription.
        Returns null if no active subscriptions exist.
      responses:
        '200':
          description: Subscription retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/subscriptions/mine:
    get:
      tags:
        - Subscriptions
      summary: List user's subscriptions
      description: |
        Retrieves all subscriptions for the authenticated user, including canceled ones.
        Sorted by creation date (newest first).
      responses:
        '200':
          description: Subscriptions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/subscriptions/cancel:
    post:
      tags:
        - Subscriptions
      summary: Cancel user's subscription
      description: |
        Cancels the user's active subscription.
        For Stripe-managed subscriptions, requests cancellation at period end.
        For incomplete subscriptions, marks as canceled locally.
        Automatically handles downgrades to free plans.
      responses:
        '200':
          description: Subscription canceled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  subscription:
                    $ref: '#/components/schemas/Subscription'
                  stripe:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        example: "sub_1234567890"
                      cancel_at_period_end:
                        type: boolean
                        example: true
                  warning:
                    type: string
                    nullable: true
                    example: "stripe_cancel_failed_local_only"
        '404':
          description: No cancellable subscription found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/subscriptions/checkout-session:
    post:
      tags:
        - Subscriptions
      summary: Start a subscription, or switch the one the customer has
      description: |
        Three outcomes, decided by what the caller already holds:

        * **New paid subscription** — a Stripe checkout session (`201`, with `url`).
        * **Plan switch** (`200`, with `changed: true` and no `url`) — when the caller
          already has a live Stripe subscription, its price is swapped **in place**
          with `proration_behavior: create_prorations`. There is never a second
          subscription: selling one alongside the first is what let a downgrade bill
          both plans, since the old supersession rule only cancelled *cheaper* ones.
          Prorations settle the difference in either direction, so an upgrade is
          charged for the remainder of the period and a downgrade credits it.
          Choosing the plan already held is a `400`, unless it is winding down — in
          which case the pending cancellation is withdrawn.
        * **Free plan** (`201`, `free: true`) — activated without Stripe, and any paid
          subscription is set to **stop at period end** rather than cancelled outright.
          Switching to free is a cancellation, and the customer keeps the period they
          have already paid for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '200':
          description: Existing subscription switched onto the requested plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '201':
          description: Checkout session created, or free plan activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '400':
          description: Bad request - invalid planCode or missing stripePriceId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/subscriptions/checkout-session/{id}:
    get:
      tags:
        - Subscriptions
      summary: Get checkout session status
      description: |
        Retrieves the status of a Stripe checkout session.
        Includes payment status and related subscription information.
        Auto-heals incomplete subscriptions if payment was successful.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Stripe checkout session ID
          example: "cs_test_1234567890"
      responses:
        '200':
          description: Session status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionStatusResponse'
        '400':
          description: Bad request - missing session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  # Payment Endpoints
  /api/subscriptions/me/entitlements:
    get:
      tags: [Subscriptions]
      summary: The caller's plan, limits and live meter readings
      description: For the usage meters and the pricing page's "you're using 340 MB of 1 GB" line.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResolvedEntitlements'
                  - type: object
                    properties:
                      success: { type: boolean }
                      usage:
                        type: object
                        additionalProperties: { type: number }
                        description: Current reading per meter
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/subscriptions/grants:
    get:
      tags: [Subscriptions]
      summary: Every comp grant, newest first
      description: |
        Requires admin privileges. A grant is an ordinary subscription with
        `isComp` set and no Stripe ids, so a comped account resolves its limits
        exactly as a paying one does.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  grants:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
    post:
      tags: [Subscriptions]
      summary: Give someone a plan without payment
      description: |
        Requires admin privileges. One grant per person: granting again moves
        the existing one to the new plan (200) instead of adding a second (201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, planCode]
              properties:
                email: { type: string, format: email }
                planCode: { type: string }
                reason: { type: string, maxLength: 500 }
                expiresAt: { type: string, format: date-time, description: Omit for an open-ended grant }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  grant: { $ref: '#/components/schemas/Subscription' }
        '200':
          description: The existing grant, moved to this plan
        '400':
          description: Invalid email or date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/subscriptions/grants/{email}:
    delete:
      tags: [Subscriptions]
      summary: Take a grant back, at once
      description: Requires admin privileges. Ends now, not at period end; nothing was paid for.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
          description: The person's email, matched case-insensitively
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  grant: { $ref: '#/components/schemas/Subscription' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No active grant for that person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/entitlement-overrides:
    get:
      tags: [Subscriptions]
      summary: Every per-person limit adjustment
      description: |
        Requires admin privileges. An override is a bump on top of whatever plan
        someone is on: "give this friend 20 GB", rather than a different plan.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  overrides:
                    type: array
                    items: { $ref: '#/components/schemas/EntitlementOverride' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/entitlement-overrides/{email}:
    get:
      tags: [Subscriptions]
      summary: One person's override, with the limits it results in
      description: Requires admin privileges.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
          description: The person's email, matched case-insensitively
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  override: { $ref: '#/components/schemas/EntitlementOverride' }
                  planCode: { type: string }
                  effectiveLimits: { $ref: '#/components/schemas/PlanLimits' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No override for that person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
    put:
      tags: [Subscriptions]
      summary: Set one person's override
      description: |
        Requires admin privileges. Replaces the override whole, so leaving a
        field out removes that adjustment. `reason` is required, and at least
        one limit must be adjusted.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
          description: The person's email, matched case-insensitively
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlanLimits'
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 500 }
                    expiresAt: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  override: { $ref: '#/components/schemas/EntitlementOverride' }
                  planCode: { type: string }
                  effectiveLimits: { $ref: '#/components/schemas/PlanLimits' }
        '400':
          description: No limit adjusted, no reason, or an invalid date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
    delete:
      tags: [Subscriptions]
      summary: Remove one person's override
      description: Requires admin privileges. Answers with the limits that apply now.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
          description: The person's email, matched case-insensitively
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  planCode: { type: string }
                  effectiveLimits: { $ref: '#/components/schemas/PlanLimits' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No override for that person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /internal/entitlements:
    get:
      tags: [Subscriptions]
      summary: Someone's plan and limits, for another service
      description: |
        Called by the other services to enforce limits. Service-to-service only;
        no browser reaches it.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResolvedEntitlements'
                  - type: object
                    properties:
                      success: { type: boolean }
        '400':
          description: email missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or wrong internal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - internalAuth: []

  /api/payments/one-time:
    post:
      tags:
        - Payments
      summary: Create one-time payment
      description: |
        Creates a one-time payment record.
        Minimum amount is 50 cents (5000 in cents).
        Payment is marked as succeeded immediately (simplified implementation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOneTimePaymentRequest'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Bad request - invalid amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/payments/mine:
    get:
      tags:
        - Payments
      summary: List user's payments
      description: |
        Retrieves all payments for the authenticated user.
        Sorted by creation date (newest first), limited to 50 records.
      responses:
        '200':
          description: Payments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  # Stripe Webhook Endpoint
  /api/stripe/webhook:
    post:
      tags:
        - Webhooks
      summary: Stripe webhook handler
      description: |
        Handles Stripe webhook events for payment processing.
        Processes events like checkout completion, payment success/failure, and subscription changes.
        Requires valid Stripe signature for security.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Stripe webhook event payload"
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeWebhookResponse'
        '400':
          description: Bad request - invalid signature or malformed payload
          content:
            text/plain:
              schema:
                type: string
                example: "Webhook Error: Invalid signature"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - stripeWebhookAuth: []
