openapi: 3.0.3
info:
  title: Tumbaland chat-service
  version: 1.0.0
  description: |
    Conversations, messages and Web Push registration for Tumbaland chat.

    Access is decided entirely by group membership, read live from group-service
    on every request. A conversation belongs to a group; anyone in that group
    may read and post, and nobody else can tell the conversation exists.

    The live stream (`/api/chat/stream`) is Server-Sent Events, not a WebSocket,
    so it reuses the ordinary session cookie. It is mounted ahead of the request
    rate limiter and carries a per-user connection cap instead.

servers:
  - url: https://chat-api.tumbaland.eu
  - url: http://localhost:4004

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    bearerAuth:
      type: http
      scheme: bearer
    internalToken:
      type: apiKey
      in: header
      name: x-internal-token
      description: Shared secret between Tumbaland's services. No browser reaches these routes.

  schemas:
    LiveShare:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        position:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracy: { type: number, nullable: true }
            heading: { type: number, nullable: true }
            speed: { type: number, nullable: true }
            at: { type: string, format: date-time }
        destination:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lng: { type: number }
            label: { type: string, nullable: true }
            distanceM: { type: number, nullable: true, description: Straight-line metres from the position }
        pinLabel: { type: string, nullable: true, description: 'What a pin is: "Home", or an address' }
        fixed: { type: boolean, description: 'A pin: one place that stays put' }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        watchers:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              name: { type: string }
              radiusM: { type: integer }
              distanceM: { type: number, nullable: true }
              notified: { type: boolean }
    SavedPlace:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Home }
        lat: { type: number }
        lng: { type: number }
        address: { type: string }
    PlaceResult:
      type: object
      properties:
        name: { type: string, example: Viru väljak 4 }
        detail: { type: string, example: 'Kesklinn, Tallinn, Estonia' }
        lat: { type: number }
        lng: { type: number }
    Attachment:
      type: object
      required: [fileId, mimetype, sizeBytes]
      properties:
        fileId:
          type: string
          description: file-service path, e.g. `chat/<groupId>/<conversationId>/<uuid>/original.jpg`
        posterFileId:
          type: string
          nullable: true
          description: Still frame for a video, generated in the browser at upload time.
        thumbnailFileId:
          type: string
          nullable: true
        mimetype:
          type: string
          enum:
            [
              image/jpeg,
              image/png,
              image/webp,
              image/gif,
              image/heic,
              image/heif,
              video/mp4,
              video/quicktime,
              video/webm,
              application/pdf,
              application/msword,
              application/vnd.openxmlformats-officedocument.wordprocessingml.document,
              application/vnd.ms-excel,
              application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
              application/vnd.ms-powerpoint,
              application/vnd.openxmlformats-officedocument.presentationml.presentation,
              application/vnd.oasis.opendocument.text,
              application/vnd.oasis.opendocument.spreadsheet,
              application/vnd.oasis.opendocument.presentation,
              application/rtf,
              text/plain,
              text/csv
            ]
        name: { type: string, nullable: true, description: 'The uploaded file''s name, kept for documents' }
        sizeBytes: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }

    Reaction:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        emoji: { type: string }
        at: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: string }
        conversationId: { type: string }
        senderId: { type: string, description: The identity key. }
        senderEmail: { type: string, description: Display and audit only. }
        senderName: { type: string }
        kind: { type: string, enum: [text, media, system] }
        body: { type: string, description: Empty for a deleted message. }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        replyTo: { type: string, nullable: true }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/Reaction' }
        clientId: { type: string }
        editedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Conversation:
      type: object
      properties:
        id: { type: string }
        groupId: { type: string }
        title: { type: string }
        members:
          type: array
          description: Who has actually opened this conversation. Never an access check.
          items:
            type: object
            properties:
              userId: { type: string }
              email: { type: string }
              name: { type: string }
              joinedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        lastMessagePreview: { type: string }
        lastMessageSender: { type: string }
        unreadCount: { type: integer }
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        message: { type: string }

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Readiness, including database connectivity
      security: []
      responses:
        '200': { description: Healthy }
        '503': { description: Database unreachable }

  /api/chat/conversations:
    get:
      summary: The caller's conversations, newest activity first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
        '401': { description: Not signed in }
    post:
      summary: Create the conversation for a group, or return the existing one
      description: |
        Idempotent on `{ groupId, title }` through a unique index, so two phones
        opening the app at the same moment cannot produce two conversations.
        No member list is accepted: membership belongs to the group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId: { type: string }
                title: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Created, or the existing one
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Conversation' }
        '403':
          description: Not a member of that group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/chat/conversations/mine:
    post:
      summary: Make sure the caller has a conversation in each of their groups, and list them
      description: |
        What the app opens with. No body: the groups come from the session, not
        from the client. Creating is idempotent, as with `POST /conversations`.
      responses:
        '200':
          description: The caller's conversations, with who is online
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        '401': { description: Not signed in }

  /api/chat/unread:
    get:
      summary: Total unread across every conversation, for the nav badge
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      unread: { type: integer }

  /api/chat/calls/ice-servers:
    get:
      summary: ICE servers for a call, with short-lived TURN relay credentials
      description: >
        Minted from Cloudflare's TURN service on every request and never cached. Without a
        TURN key configured, or when Cloudflare fails, the answer is STUN only and `relay`
        is false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      iceServers:
                        type: array
                        items:
                          type: object
                          properties:
                            urls:
                              oneOf:
                                - { type: string }
                                - { type: array, items: { type: string } }
                            username: { type: string }
                            credential: { type: string }
                      relay: { type: boolean }
                      expiresAt: { type: string, format: date-time, nullable: true }

  /api/chat/calls/current:
    get:
      summary: The call ringing or running for the caller, or null
      description: What an app opened from a "Calling you" notification asks, since the stream does not replay calls.
      responses:
        '200': { description: OK }

  /api/chat/conversations/{id}/calls:
    post:
      summary: Start a voice call with the one other person in a conversation
      description: >
        Rings every device of the person called, over the stream (`call.ringing`) and by push.
        Unanswered after 45 seconds it ends as missed. 400 unless the conversation has exactly
        one other member; 409 when either person is already in a call.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, description: 'The calling tab, made up by the client per page load.' }
      responses:
        '201': { description: Ringing }
        '409': { description: Busy }

  /api/chat/calls/{callId}/accept:
    post:
      summary: Answer on this device
      description: The first device to answer wins; any other gets 409 "Answered on another device".
      parameters:
        - { in: path, name: callId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [deviceId], properties: { deviceId: { type: string } } }
      responses:
        '200': { description: Answered (`call.accepted` goes to both people) }
        '409': { description: Already answered or already over }

  /api/chat/calls/{callId}/decline:
    post:
      summary: Say no to a ringing call
      parameters:
        - { in: path, name: callId, required: true, schema: { type: string } }
      responses:
        '200': { description: Ended as declined }

  /api/chat/calls/{callId}/end:
    post:
      summary: Hang up, from either side, at any stage
      description: >
        Idempotent. Leaves a line in the thread ("Call, 12 min" or "Missed call from Tom") and
        sends `call.ended` to both people.
      parameters:
        - { in: path, name: callId, required: true, schema: { type: string } }
      responses:
        '200': { description: Ended }

  /api/chat/calls/{callId}/signal:
    post:
      summary: Pass a WebRTC offer, answer or ICE candidate to the other device
      description: >
        Only the device that placed the call and the one that answered it may signal. Delivered
        as `call.signal` to the other device only.
      parameters:
        - { in: path, name: callId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, data]
              properties:
                deviceId: { type: string }
                data:
                  type: object
                  properties:
                    description:
                      type: object
                      properties:
                        type: { type: string, enum: [offer, answer] }
                        sdp: { type: string }
                    candidate: { type: object, nullable: true }
      responses:
        '204': { description: Relayed }
        '409': { description: 'The call is not connected, or this device is not in it' }

  /api/chat/search:
    get:
      summary: Full-text search, scoped to conversations the caller can read
      parameters:
        - { in: query, name: q, schema: { type: string }, description: Search term. }
        - in: query
          name: conversationId
          schema: { type: string }
          description: Narrows to one conversation. Cannot widen the scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }

  /api/chat/stream:
    get:
      summary: Live event stream (Server-Sent Events)
      description: |
        `text/event-stream`. Events: `message.created`, `message.updated`,
        `message.deleted`, `reaction.updated`, `typing`, `read`, `presence`
        (`{ userId, online, lastActiveAt }`, with an empty conversationId), and
        `conversation.updated` (also used for the initial `ready` frame).

        Each event carries an `id:` of its millisecond timestamp. On reconnect
        the browser sends it back as `Last-Event-ID` and the server replays
        anything missed within the last five minutes, which is what stops a
        message sent during a brief network drop from being lost.

        A heartbeat comment arrives every 25 seconds. The server closes the
        connection after 30 minutes so the client reconnects and re-reads its
        group membership; EventSource reconnects on its own.

        Someone counts as online while they hold a stream open, or for 90
        seconds after any chat request (the shell's unread poll among them).
        Conversation lists and details carry a `presence` array for everyone
        but the caller.

        At most 5 concurrent streams per user.
      parameters:
        - in: header
          name: Last-Event-ID
          schema: { type: string }
          description: Set automatically by EventSource on reconnect.
        - in: query
          name: lastEventId
          schema: { type: string }
          description: Alternative to the header, for clients that cannot set one.
      responses:
        '200':
          description: The stream
          content:
            text/event-stream:
              schema: { type: string }
        '429': { description: Too many open streams for this user }

  /api/chat/conversations/{id}:
    get:
      summary: One conversation as a thread opens it
      description: |
        Its members with their pictures, how far each of the others has read,
        who is online, where its photos go and how it looks. The messages come
        separately, from `/messages`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: 
                    type: object
                    properties:
                      id: { type: string }
                      groupId: { type: string }
                      title: { type: string }
                      members:
                        type: array
                        items:
                          type: object
                          properties:
                            userId: { type: string }
                            email: { type: string }
                            name: { type: string }
                            picture: { type: string, nullable: true }
                            joinedAt: { type: string, format: date-time }
                      reads:
                        type: array
                        description: The others only, never the caller
                        items:
                          type: object
                          properties:
                            userId: { type: string }
                            lastReadMessageId: { type: string, nullable: true }
                            lastReadAt: { type: string, format: date-time }
                      photoAlbum:
                        type: object
                        properties:
                          mode: { type: string, enum: [unset, off, album] }
                          albumId: { type: string, nullable: true }
                          albumName: { type: string, nullable: true }
                      appearance:
                        type: object
                        properties:
                          theme: { type: string }
                          backgroundFileId: { type: string, nullable: true }
                          backgroundUrl: { type: string, nullable: true }
                      presence:
                        type: array
                        items:
                          type: object
                          properties:
                            userId: { type: string }
                            online: { type: boolean }
                            lastActiveAt: { type: string, format: date-time, nullable: true, description: Null when never seen }
        '404': { description: 'No such conversation, or not one of the caller''s' }

  /api/chat/conversations/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: A page of the thread, newest first
      description: Cursored on `createdAt`, never on skip/offset, because a live thread grows under a reader.
      parameters:
        - { in: query, name: before, schema: { type: string, format: date-time } }
        - { in: query, name: after, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items: { $ref: '#/components/schemas/Message' }
                      nextCursor: { type: string, nullable: true }
        '404': { description: 'No such conversation, or not the caller''s to read' }
    post:
      summary: Send a message
      description: |
        Idempotent on `clientId` through a unique index. A repeat returns the
        stored message with **200** rather than an error: a retry after a
        dropped response is the client behaving correctly, and answering with a
        failure would show the user an error for a message that did arrive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId:
                  type: string
                  minLength: 8
                  description: Generated by the client before the first attempt, repeated on every retry.
                body: { type: string, maxLength: 8000 }
                attachments:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/Attachment' }
                replyTo: { type: string, nullable: true }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Message' }
        '200': { description: Already stored under this clientId }
        '400': { description: 'Empty message, bad replyTo, or missing clientId' }
        '429': { description: Sending too fast }

  /api/chat/conversations/{id}/messages/{messageId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: messageId, required: true, schema: { type: string } }
    patch:
      summary: Edit your own message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 8000 }
      responses:
        '200': { description: Updated }
        '403': { description: Someone else's message }
        '404': { description: No such message }
    delete:
      summary: Delete your own message
      description: Soft delete. The row stays so replies keep resolving; the content is dropped.
      responses:
        '204': { description: Deleted }
        '403': { description: Someone else's message }

  /api/chat/conversations/{id}/messages/{messageId}/reactions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: messageId, required: true, schema: { type: string } }
    put:
      summary: Toggle your reaction
      description: One reaction per person per message. A different emoji replaces rather than adds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, description: At most 8 code points. }
      responses:
        '200': { description: The updated message }
        '400': { description: Not an emoji }

  /api/chat/conversations/{id}/albums:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: The conversation group's albums, for the "photos go to" picker
      responses:
        '200': { description: '`[{ id, name, photoCount }]`, most recently changed first' }

  /api/chat/conversations/{id}/photo-album:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Where this conversation's photos and videos are saved in Album
      description: |
        One setting for the whole conversation, changed by anyone in it, and
        announced in the thread as a `system` message ("Irja set photos to go
        to Rome"). After each send, every file is added to the chosen album as
        an entry pointing at chat's own file, never a copy. Send
        `skipAlbum: true` with a message to leave that one out. Unsending
        removes the entries. If the album has been deleted, the setting goes
        back to `unset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [mode], properties: { mode: { enum: [off] } } }
                - { type: object, required: [mode, albumId], properties: { mode: { enum: [album] }, albumId: { type: string } } }
                - { type: object, required: [mode, newAlbumName], properties: { mode: { enum: [album] }, newAlbumName: { type: string } } }
      responses:
        '200': { description: '`{ mode, albumId, albumName }`' }
        '400': { description: The album is not in this conversation's group }

  /api/chat/conversations/{id}/appearance:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: How the thread looks, for everyone in it
      description: |
        A preset theme (`classic`, `ocean`, `forest`, `sunset`, `lavender`,
        `graphite`, `rose`, `teal`, `amber`, `midnight`, `berry`, `cocoa`;
        their colours, light and dark, live in chat-front) and, optionally, a photo
        sent in this conversation as the background. Announced in the thread
        as a `system` message and to the group as `conversation.updated` with
        `{ appearance }`. Unsending the photo behind the background removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme:
                  type: string
                  enum: [classic, ocean, forest, sunset, lavender, graphite, rose, teal, amber, midnight, berry, cocoa]
                backgroundFileId: { type: string, nullable: true, description: 'null removes the background' }
      responses:
        '200': { description: '`{ theme, backgroundFileId, backgroundUrl }`' }
        '400': { description: 'No such theme, or the background is not a photo from this conversation' }

  /api/chat/conversations/{id}/assistants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: The assistants in this conversation, as the caller sees them
      description: |
        Everything the Assistants dialog shows: whether assistants are on (someone
        turned them on and nobody has locked them off), the shared "About us" text,
        what the assistants have noted and whether they may add to it, every bot
        with what it was told (readable by everyone), the models an admin has
        turned on, the starting personalities, and the caller's monthly allowance.
        `canManage` on a bot and `isManager` are for the caller: a bot's owner and
        the group's owner and admins may change it.
      responses:
        '200': { description: '`{ enabled, lockedOff, whoCanAdd, aboutUs, memory, memoryOn, isManager, canAdd, bots, presets, colors, models, allowance }`' }
        '404': { description: 'No such conversation, or not the caller''s' }
    patch:
      summary: The chat's switch, the shared texts, and the admins' two settings
      description: |
        `enabled` turns assistants on or off for the whole conversation; anyone in it may
        flip it, and the thread says who did. A lock from an admin wins over it.
        `aboutUs` is the text every assistant here keeps in mind; anyone may edit it.
        `memory` is what the assistants have noted about the people here, a note to a
        line: the assistants add and remove lines themselves, and anyone may edit the
        whole text. `memoryOn` says whether the assistants may add notes (they always
        read them); anyone may switch it.
        `lockedOff` (keep assistants off for the whole conversation, whatever the
        switch says) and `whoCanAdd` (`everyone` or `admins`) are for the group's
        owner and admins. Each change is announced in the thread as a `system`
        message and to the group as `conversation.updated` with `{ assistants: true }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                aboutUs: { type: string, maxLength: 1500 }
                memory: { type: string, maxLength: 1500 }
                memoryOn: { type: boolean }
                lockedOff: { type: boolean }
                whoCanAdd: { type: string, enum: [everyone, admins] }
      responses:
        '200': { description: 'The same view as GET' }
        '400': { description: 'Nothing to change' }
        '403': { description: 'Only the group owner or an admin can change that' }

  /api/chat/conversations/{id}/assistants/bots:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Add your assistant to the conversation
      description: |
        One per person per conversation. The name is what people type after the @:
        up to 24 letters, numbers and single spaces, unique in the conversation
        (case-insensitively), not the name of someone in it, and not `Claude`, which
        is an alias for the asker's own assistant. `model` has to be one an admin
        has turned on and defaults to the admin's default. When an admin has made
        adding admins only, only the group's owner and admins may.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 24 }
                personality: { type: string, maxLength: 1500 }
                aboutOwner: { type: string, maxLength: 1500 }
                color: { type: string, description: 'One of the palette in `colors`' }
                model: { type: string, enum: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5] }
      responses:
        '201': { description: 'The same view as GET' }
        '400': { description: 'The name is taken or not allowed, the caller already has an assistant here, or the model is not available' }
        '403': { description: 'Only the group owner or an admin can add an assistant here' }

  /api/chat/conversations/{id}/assistants/bots/{botId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: botId, in: path, required: true, schema: { type: string } }
    patch:
      summary: Change, pause or resume an assistant
      description: |
        Its owner, or the group's owner or an admin. An admin's change never makes
        the bot theirs; the owner is notified. A rename, a new personality, a new
        model, a pause and a resume are each announced in the thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 24 }
                personality: { type: string, maxLength: 1500 }
                aboutOwner: { type: string, maxLength: 1500 }
                color: { type: string }
                model: { type: string, enum: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5] }
                paused: { type: boolean }
      responses:
        '200': { description: 'The same view as GET' }
        '400': { description: 'Nothing to change, the name is taken, or the model is not available' }
        '403': { description: 'Not its owner, and not an admin of the group' }
        '404': { description: 'No such assistant here' }
    delete:
      summary: Remove an assistant
      description: Its owner, or the group's owner or an admin. What it wrote stays in the thread under its name.
      responses:
        '200': { description: 'The same view as GET' }
        '403': { description: 'Not its owner, and not an admin of the group' }
        '404': { description: 'No such assistant here' }

  /api/chat/assistants/me:
    get:
      summary: The caller's assistant allowance this month
      description: |
        `{ limit, used, percent, capPercent, exhausted, resetsOn }`. `limit` is null on
        a plan with no ceiling; amounts are in ten-thousandths of a dollar, which the
        app shows as a share, never as money.
      responses:
        '200': { description: The allowance }
    put:
      summary: Set a lower cap of your own
      description: '`capPercent` is the share of the plan''s allowance the caller is willing to spend, 10 to 100, or null for none. It can never raise the plan''s limit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capPercent]
              properties:
                capPercent: { type: integer, minimum: 10, maximum: 100, nullable: true }
      responses:
        '200': { description: 'The allowance, with the cap applied' }
        '400': { description: capPercent out of range }

  /api/chat/admin/assistant-key:
    get:
      summary: The Anthropic key's status, and the models on offer
      description: |
        Administrators only. Never returns the key: only its last four characters, its
        status (`ok`, or `rejected` once Anthropic refused it), the expiry date and the
        days left, who set it, which models are turned on and how many bots use each.
      responses:
        '200': { description: The status }
        '403': { description: Not an administrator }
    put:
      summary: Save or replace the key, the models and the expiry date
      description: |
        Any part may be sent alone. A new `apiKey` is checked against Anthropic before
        it is kept, sealed with the server's API key secret, and replaces the old one
        at once. `expiresOn` is a reminder to rotate, not a cut-off: a notice goes to
        whoever set the key from 14 days before. Turning a model off moves the bots
        using it to the default when they reply. Audited, without the key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: { type: string, writeOnly: true }
                models:
                  type: object
                  properties:
                    enabled: { type: array, items: { type: string, enum: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5] } }
                    default: { type: string, enum: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5] }
                expiresOn: { type: string, format: date, nullable: true }
      responses:
        '200': { description: The new status }
        '400': { description: 'Anthropic did not accept the key, nothing to change, a bad date, or no model left on' }
        '403': { description: Not an administrator }
    delete:
      summary: Remove the key
      description: Assistants answer "isn't available right now" until a new key is saved.
      responses:
        '200': { description: The new status }
        '403': { description: Not an administrator }

  /api/chat/admin/assistant-key/check:
    post:
      summary: Ask Anthropic about the saved key again
      description: |
        Administrators only. Puts a key marked `rejected` back to work if Anthropic now
        accepts it: one 401 marks a key rejected, and a 401 can be a passing problem on
        Anthropic's side. If it is refused again, it stays rejected with the reason.
      responses:
        '200': { description: The new status }
        '400': { description: 'No key saved, it cannot be opened here, or Anthropic still refuses it' }
        '403': { description: Not an administrator }

  /api/chat/admin/assistant-usage:
    get:
      summary: What assistants cost in a month, by person, chat and model
      description: |
        Administrators only. `month` is `YYYY-MM` and defaults to this one. People and
        chats are the twenty biggest; the totals cover everyone. Amounts are estimates
        from list prices, in ten-thousandths of a dollar: compare with the Anthropic
        bill once a month.
      parameters:
        - { name: month, in: query, required: false, schema: { type: string, example: '2026-10' } }
      responses:
        '200': { description: '`{ month, totals, byModel, byPerson, byChat }`' }
        '400': { description: month is not YYYY-MM }
        '403': { description: Not an administrator }

  /api/chat/conversations/{id}/messages/{messageId}/album:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string } }
    put:
      summary: Put a sent message's files, or one of them, in another album
      description: |
        Files already in an album are moved (a title or tags given in Album go
        with them); files not in one are added. Does not change where the
        conversation's new photos go. Anyone in the conversation may.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [albumId], properties: { albumId: { type: string }, fileId: { type: string } } }
                - { type: object, required: [newAlbumName], properties: { newAlbumName: { type: string }, fileId: { type: string } } }
      responses:
        '200': { description: The updated message }
        '400': { description: The album is not in this conversation's group }
        '404': { description: 'No such message, or no such file on it' }
    delete:
      summary: Take a message's files, or one (`?fileId=`), back out of their album (files stay in chat)
      responses:
        '200': { description: The updated message }
        '404': { description: No such message in this conversation }

  /api/chat/conversations/{id}/read:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Move the read cursor forward
      description: Never moves backwards, so a stale tab cannot resurrect a cleared notification.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lastReadMessageId: { type: string }
      responses:
        '204': { description: Recorded }

  /api/chat/conversations/{id}/typing:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Announce that the caller is typing
      description: Fanned out on the stream, never stored.
      responses:
        '204': { description: Announced }

  /api/chat/push/subscriptions:
    post:
      summary: Register this browser for Web Push
      description: |
        Called on every app start, not only when permission is granted: push
        endpoints rotate, and re-registering is how a rotation is noticed. It
        also refreshes `lastSeenAt` and forgives earlier delivery failures.

        The service worker that owns this subscription lives on the shell's
        origin, not on chat-front's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
                platform: { type: string, maxLength: 40 }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      configured:
                        type: boolean
                        description: False when this deployment holds no VAPID keys, so nothing will ever be delivered.
    delete:
      summary: Unregister this browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '204': { description: Removed }

  /api/chat/conversations/{id}/live:
    get:
      summary: Who in this conversation is sharing where they are
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The shares, the caller's own included
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/LiveShare' } }
    put:
      summary: Start sharing where the caller is, live or as a pin
      description: |
        Live sends the phone's position as it moves, with an optional
        destination, for up to four hours. A pin (`fixed: true`) is one place
        that stays put: "come and get me here". Starting again replaces the
        caller's current share.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes: { type: integer, minimum: 5, maximum: 240 }
                destination:
                  type: object
                  nullable: true
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
                    label: { type: string, maxLength: 200 }
                fixed: { type: boolean }
                pinLabel: { type: string, maxLength: 200, nullable: true }
      responses:
        '200':
          description: The share as started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/LiveShare' }
    delete:
      summary: Stop sharing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Stopped }

  /api/chat/conversations/{id}/live/position:
    post:
      summary: The caller's position, sent every few seconds while sharing
      description: |
        Rate limited to 60 a minute, which only a client stuck in a loop
        reaches. Anyone watching who is now inside their radius is told by push.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: number, minimum: 0, maximum: 100000, nullable: true }
                heading: { type: number, minimum: 0, maximum: 360, nullable: true }
                speed: { type: number, minimum: 0, maximum: 1000, nullable: true }
      responses:
        '200':
          description: The share with its new position
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/LiveShare' }
        '404': { description: The caller is not sharing }
        '429': { description: Too many location updates }

  /api/chat/conversations/{id}/live/{userId}/watch:
    put:
      summary: Be told when someone sharing is close
      description: |
        "Tell me when they are close": where the caller is waiting, and how
        close counts. One push when they come inside the radius.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string }, description: The person sharing }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, radiusM]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                radiusM: { type: integer, minimum: 100, maximum: 20000 }
      responses:
        '200':
          description: Their share, with the caller among its watchers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/LiveShare' }
    delete:
      summary: Stop waiting to be told
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Their share, without the caller among its watchers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/LiveShare' }

  /api/chat/places/search:
    get:
      summary: Places matching a name, nearest first when a point is given
      description: |
        Looked up in a public geocoder, so rate limited to 60 a minute.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: Matching places
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/PlaceResult' } }
        '429': { description: Too many place lookups }

  /api/chat/places/reverse:
    get:
      summary: The address at a point, or null
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: The address, or null where there is none
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, allOf: [{ $ref: '#/components/schemas/PlaceResult' }], nullable: true }
        '429': { description: Too many place lookups }

  /api/chat/conversations/{id}/places:
    get:
      summary: The places saved in this conversation, to pick again
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Saved places
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/SavedPlace' } }
    post:
      summary: Save a place for everyone in the conversation
      description: Up to 50 per conversation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, lat, lng]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                address: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/SavedPlace' }
        '400': { description: 'Invalid, or the conversation already has 50 places' }

  /api/chat/conversations/{id}/places/{placeId}:
    delete:
      summary: Forget a saved place
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: placeId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }

  /api/chat/conversations/{id}/attachments/upload-url:
    post:
      summary: Permission to upload one file, and where to put it
      description: |
        The bytes go straight from the browser to file-service; only the
        permission check and the storage quota pass through here. Per-file
        limits depend on the kind (image, video, voice, document). For a video,
        `posterUploadFileId` says where to put the poster frame the browser
        made.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mimetype, sizeBytes]
              properties:
                filename: { type: string, minLength: 1, maxLength: 255 }
                mimetype: { type: string, description: 'An allowed image, video, audio or document type' }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Where to PUT the file
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: 
                    type: object
                    properties:
                      uploadUrl: { type: string }
                      fileId: { type: string }
                      posterUploadFileId: { type: string, nullable: true }
                      expiresInMinutes: { type: integer }
        '400': { description: 'Not an allowed type, or too large' }
        '402': { description: Not enough storage left on the plan }

  /api/chat/conversations/{id}/attachments/thumbnail:
    post:
      summary: Make the display copy of an uploaded image
      description: |
        A resized webp, which also converts an iPhone's HEIC. Called after the
        upload lands and before the message is sent. A failure comes back as a
        null id rather than an error: the client falls back to the original.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, mimetype]
              properties:
                fileId: { type: string, maxLength: 512 }
                mimetype: { type: string }
      responses:
        '200':
          description: The thumbnail's file id, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { thumbnailFileId: { type: string, nullable: true } } }
        '400': { description: The file is not in this conversation }

  /api/chat/conversations/{id}/collages:
    post:
      summary: Make a collage from this conversation's album and post its card
      description: |
        Idempotent on `clientId`, so a retry cannot make a second collage.
        201 when it was made now, 200 when the same `clientId` already had.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, title]
              properties:
                clientId: { type: string, minLength: 8, maxLength: 100 }
                title: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: The collage card, as a message
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Message' }
        '200': { description: Already made for this clientId; the same card }
        '400': { description: The conversation has no album to make it from }

  /internal/collage-activity:
    post:
      summary: Someone opened a collage made from a chat
      description: Called by album-service. Nudges the others in the conversation who are not looking at it already.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, collageId, title, userId, name, presentUserIds]
              properties:
                conversationId: { type: string }
                collageId: { type: string }
                title: { type: string, maxLength: 200 }
                userId: { type: string }
                name: { type: string, maxLength: 200 }
                presentUserIds: { type: array, maxItems: 50, items: { type: string } }
      responses:
        '200':
          description: Who was told
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { notified: { type: integer } } }
        '401': { description: Missing or wrong internal token }

  /internal/plan-reminder:
    post:
      summary: A plan in the journal is coming up
      description: Called by relationship-service's reminder sweep. Posts the reminder into the group's conversation.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, userId, title, date, timeZone, remindAt]
              properties:
                planId: { type: string }
                groupId: { type: string }
                userId: { type: string }
                title: { type: string, maxLength: 200 }
                date: { type: string, format: date }
                endDate: { type: string, format: date }
                time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '19:30' }
                timeZone: { type: string, example: Europe/Tallinn }
                place: { type: string, maxLength: 200 }
                remindAt: { type: string }
      responses:
        '200': { description: 'Posted, or already posted for this plan' }
        '401': { description: Missing or wrong internal token }
