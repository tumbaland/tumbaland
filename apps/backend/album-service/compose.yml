services:
  album-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/album-service:latest
    restart: unless-stopped
    ports:
      - '4002:4002'
    environment:
      - PORT=4002
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # MinIO configuration (Album Service - Direct access to album buckets)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=tumbaland_admin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=album
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
