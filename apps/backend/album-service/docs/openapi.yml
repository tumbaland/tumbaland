  /api/collages/{id}/albums:
    post:
      tags: [Collages]
      summary: Let a collage use photos from more albums
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [add]
              properties:
                add: { type: array, minItems: 1, maxItems: 50, items: { type: string, pattern: '^[a-f0-9]{24}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object }
        '403': { description: 'An album the caller cannot see' }

  /api/collages/{id}/changes:
    post:
      tags: [Collages]
      summary: Save a batch of edits
      description: |
        The editor's autosave, and how an assistant edits a collage it made.
        Each change puts an item, removes one, reorders a layer or changes
        settings. Everyone else with the collage open gets the batch on the
        live stream, except the tab that sent it (`session`).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [type]
                    properties:
                      type: { type: string, enum: [put, remove, order, settings] }
                      layer: { type: string, enum: [photos, texts] }
                      item: { type: object, description: 'For put: the item, with its id' }
                      index: { type: integer, minimum: 0 }
                      id: { type: string, description: 'For remove' }
                      ids: { type: array, items: { type: string }, description: 'For order: the new order' }
                      values: { type: object, description: 'For settings: viewport, colours, transparency, title' }
                session: { type: string, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { revision: { type: integer } } }
        '403': { description: 'Not the callers to edit (an assistant may only edit collages it made)' }
        '429': { description: 'Too many saves' }

  /api/collages/{id}/live:
    get:
      tags: [Collages]
      summary: The open editor's stream of everyone else's edits
      description: |
        Server-sent events: changes, who else is here, what they have selected,
        and where an item is mid-drag. One request that stays open as long as
        the editor does. People only, not keys or assistants.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: session, in: query, required: true, schema: { type: string }, description: This tab }
      responses:
        '200':
          description: The event stream
          content:
            text/event-stream: { schema: { type: string } }
        '400': { description: 'No session' }
        '404': { description: 'No such collage' }

  /api/collages/{id}/presence:
    post:
      tags: [Collages]
      summary: This tab is here, and what it has selected
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, selection]
              properties:
                session: { type: string, minLength: 8, maxLength: 64 }
                selection: { type: string, nullable: true, maxLength: 100 }
      responses:
        '204': { description: Told the others }

  /api/collages/{id}/moving:
    post:
      tags: [Collages]
      summary: Where an item is mid-drag, or null once let go
      description: Sent many times a second while dragging, on its own rate budget.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, item]
              properties:
                session: { type: string, minLength: 8, maxLength: 64 }
                item:
                  type: object
                  nullable: true
                  properties:
                    id: { type: string }
                    x: { type: number }
                    y: { type: number }
                    width: { type: number }
                    height: { type: number }
                    rotation: { type: number }
      responses:
        '204': { description: Told the others }

  /api/collages/{id}/preview:
    get:
      tags: [Collages]
      summary: Look at a collage
      description: >
        The collage drawn as its export draws it, as a JPEG. Photos are drawn from
        their thumbnails. Made for a connected assistant to see what it made.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Collage ID
        - name: width
          in: query
          schema:
            type: integer
            default: 1024
            minimum: 256
            maximum: 2048
          description: Width of the picture in pixels
        - name: outline
          in: query
          schema:
            type: boolean
          description: Draw each item's box and short name (p1, t1) over the collage
      responses:
        '200':
          description: The collage, drawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      image:
