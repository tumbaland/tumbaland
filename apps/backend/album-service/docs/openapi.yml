      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: photos, in: query, required: true, schema: { type: string }, example: '65f0c1aa,65f0c1ab' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, additionalProperties: { type: number }, description: Ratio by photo id }
