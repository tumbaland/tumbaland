                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { id: { type: string }, title: { type: string } } }

  /internal/chat-photos:
    post:
      tags: [Internal]
      summary: Put a photo or video sent in chat into an album
      description: |
        An entry pointing at chat's own file, never a copy. Idempotent on the
        file: a retry returns the entry already made.
      security:
        - internalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, albumId, conversationId, messageId, fileId, mimetype, size, takenAt]
              properties:
                groupId: { type: string }
                albumId: { type: string }
                conversationId: { type: string }
                messageId: { type: string }
                fileId: { type: string, maxLength: 512 }
                thumbnailFileId: { type: string, nullable: true }
                posterFileId: { type: string, nullable: true }
                mimetype: { type: string, pattern: '^(image|video)/' }
                size: { type: integer, minimum: 0 }
                width: { type: integer, nullable: true }
                height: { type: integer, nullable: true }
                takenAt: { type: string, format: date-time }
      responses:
        '201':
          description: Added, or the entry already there
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { photoId: { type: string }, albumId: { type: string }, albumName: { type: string } } }

  /internal/chat-photos/{messageId}/move:
    post:
      tags: [Internal]
      summary: Move a message's photos to another album
      security:
        - internalAuth: []
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, albumId]
              properties:
                groupId: { type: string }
                albumId: { type: string }
                fileIds: { type: array, maxItems: 20, items: { type: string }, description: Some of them; all when absent }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { moved: { type: integer }, albumId: { type: string }, albumName: { type: string } } }

  /internal/chat-photos/{messageId}:
    delete:
      tags: [Internal]
      summary: Take a message's photos out of their album
      description: The photos stay in the chat. One file with `fileId`, or all of them.
      security:
        - internalAuth: []
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
        - { name: fileId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { removed: { type: integer } } }
