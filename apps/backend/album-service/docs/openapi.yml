  /api/photos/memories:
    get:
      tags: [Photos]
      summary: On this day, in earlier years
      description: Photos from around today's date in each earlier year, most recent year first, capped per year.
      security:
        - bearerAuth: []
      parameters:
        - { name: groupId, in: query, schema: { type: string }, description: "The group's photos instead of the caller's own" }
        - { name: windowDays, in: query, schema: { type: integer, minimum: 0, maximum: 30, default: 3 }, description: Days either side that still count as this day }
        - { name: limitPerYear, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: 
                    type: object
                    properties:
                      date: { type: string, format: date }
                      windowDays: { type: integer }
                      totalPhotos: { type: integer, description: 'Every match, before the per-year cap' }
                      years:
                        type: array
                        items:
                          type: object
                          properties:
                            year: { type: integer }
                            yearsAgo: { type: integer }
                            photoCount: { type: integer }
                            photos:
                              type: array
                              items:
                                allOf:
                                  - $ref: '#/components/schemas/Photo'
                                  - type: object
                                    properties:
                                      albumName: { type: string }
                                      memoryDate: { type: string, format: date }
                                      dateSource: { type: string, enum: [taken, uploaded] }

