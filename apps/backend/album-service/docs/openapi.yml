                        description: The picture, base64
                      mimeType:
                        type: string
                        example: image/jpeg
                      width:
                        type: integer
                      height:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Collage not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

