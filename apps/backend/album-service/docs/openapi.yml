openapi: 3.0.3
info:
  title: Album Service API
  description: API for managing photo albums, photos, collages, and related operations
  version: 1.0.0
  contact:
    name: Tumbaland Team
servers:
  - url: http://localhost:4002
    description: Development server
  - url: https://album-api.tumbaland.eu
    description: Production server

tags:
  - name: Albums
    description: Album management operations
  - name: Photos
    description: Photo management and upload operations
  - name: Collages
    description: Collage creation and management
  - name: Statistics
    description: Album service statistics and analytics
  - name: Internal
    description: Called by chat-service, never by a browser

components:
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error description"
      required:
        - success
        - message

    Album:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: "Summer Vacation 2023"
        description:
          type: string
          example: "Photos from our summer vacation in Italy"
        coverPhotoId:
          type: string
          example: "507f1f77bcf86cd799439012"
        isPublic:
          type: boolean
          example: false
        tags:
          type: array
          items:
            type: string
          example: ["vacation", "italy", "summer"]
        userId:
          type: string
          example: "user-123"
        groupId:
          type: string
          example: "group-456"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - userId

    Photo:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        filename:
          type: string
          example: "IMG_1234.jpg"
        originalName:
          type: string
          example: "original_image.jpg"
        minioFileId:
          type: string
          example: "album/user-123/507f1f77bcf86cd799439011/original.jpg"
        minioThumbnailFileId:
          type: string
          example: "album/user-123/507f1f77bcf86cd799439011/thumbnail.jpg"
        albumId:
          type: string
          example: "507f1f77bcf86cd799439011"
        title:
          type: string
          example: "Colosseum at sunset"
        description:
          type: string
          example: "Beautiful view of the Colosseum during golden hour"
        mimetype:
          type: string
          example: "image/jpeg"
        size:
          type: integer
          example: 2048576
        width:
          type: integer
          example: 1920
        height:
          type: integer
          example: 1080
        tags:
          type: array
          items:
            type: string
          example: ["colosseum", "sunset", "rome"]
        metadata:
          type: object
          properties:
            dateTaken:
              type: string
              format: date-time
              example: "2023-07-15T19:30:00.000Z"
            location:
              type: object
              properties:
                latitude:
                  type: number
                  example: 41.8902
                longitude:
                  type: number
                  example: 12.4922
                address:
                  type: string
                  example: "Rome, Italy"
            camera:
              type: object
              properties:
                make:
                  type: string
                  example: "Canon"
                model:
                  type: string
                  example: "EOS R5"
                settings:
                  type: object
                  properties:
                    iso:
                      type: integer
                      example: 100
                    aperture:
                      type: string
                      example: "f/2.8"
                    shutterSpeed:
                      type: string
                      example: "1/250"
                    focalLength:
                      type: string
                      example: "50mm"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - filename
        - originalName
        - albumId
        - mimetype
        - size

    Collage:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        title:
          type: string
          example: "Summer Memories Collage"
        config:
          type: object
          description: "Collage configuration with layout and photo positions"
          properties:
            version:
              type: string
              example: "1.0"
            date:
              type: string
              example: "2023-08-01"
            viewport:
              type: object
              properties:
                width:
                  type: integer
                  example: 1920
                height:
                  type: integer
                  example: 1080
            theme:
              type: string
              example: "classic"
            photos:
              type: array
              items:
                type: object
                properties:
                  photoId:
                    type: string
                    example: "507f1f77bcf86cd799439012"
                  filename:
                    type: string
                    example: "IMG_1234.jpg"
                  caption:
                    type: string
                    example: "Beautiful sunset"
                  position:
                    type: object
                    properties:
                      left:
                        type: number
                        example: 100
                      top:
                        type: number
                        example: 200
                  width:
                    type: integer
                    example: 400
                  height:
                    type: integer
                    example: 300
                  rotation:
                    type: number
                    example: 0
                  frameVisible:
                    type: boolean
                    example: true
                  scaleX:
                    type: string
                    example: "1"
                  scaleY:
                    type: string
                    example: "1"
            textSections:
              type: array
              items:
                type: object
            title:
              type: object
              properties:
                text:
                  type: string
                  example: "Summer 2023"
                subtitle:
                  type: string
                  example: "Memories to cherish"
            albumIds:
              type: array
              items:
                type: string
              example: ["507f1f77bcf86cd799439011"]
        albumIds:
          type: array
          items:
            type: string
          example: ["507f1f77bcf86cd799439011"]
        userId:
          type: string
          example: "user-123"
        groupId:
          type: string
          example: "group-456"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - title
        - config
        - albumIds

    # Request/Response schemas
    AlbumCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Summer Vacation 2023"
        description:
          type: string
          example: "Photos from our summer vacation in Italy"
        isPublic:
          type: boolean
          example: false
        tags:
          type: array
          items:
            type: string
          example: ["vacation", "italy", "summer"]
        groupId:
          type: string
          example: "group-456"
      required:
        - name

    AlbumUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Updated Album Name"
        description:
          type: string
          example: "Updated description"
        isPublic:
          type: boolean
          example: true
        tags:
          type: array
          items:
            type: string
          example: ["updated", "vacation", "italy"]

    PhotoCreateRequest:
      type: object
      properties:
        filename:
          type: string
          example: "IMG_1234.jpg"
        originalName:
          type: string
          example: "original_image.jpg"
        minioFileId:
          type: string
          example: "album/user-123/507f1f77bcf86cd799439011/original.jpg"
        albumId:
          type: string
          example: "507f1f77bcf86cd799439011"
        title:
          type: string
          example: "Colosseum at sunset"
        description:
          type: string
          example: "Beautiful view of the Colosseum during golden hour"
        mimetype:
          type: string
          example: "image/jpeg"
        size:
          type: integer
          example: 2048576
        width:
          type: integer
          example: 1920
        height:
          type: integer
          example: 1080
        tags:
          type: array
          items:
            type: string
          example: ["colosseum", "sunset", "rome"]
        metadata:
          type: object
      required:
        - filename
        - originalName
        - albumId
        - mimetype
        - size

    PhotoUpdateRequest:
      type: object
      properties:
        title:
          type: string
          example: "Updated photo title"
        description:
          type: string
          example: "Updated description"
        tags:
          type: array
          items:
            type: string
          example: ["updated", "colosseum", "rome"]
        metadata:
          type: object

    UploadSignedUrlRequest:
      type: object
      properties:
        filename:
          type: string
          example: "IMG_1234.jpg"
        mimetype:
          type: string
          example: "image/jpeg"
        albumId:
          type: string
          example: "507f1f77bcf86cd799439011"
        sizeBytes:
          type: integer
          minimum: 1
          description: >-
            Size of the file about to be uploaded. Checked against the plan's
            storage allowance before a URL is issued — this is the last point
            where the size is known before the bytes are written. A group
            album's bytes are billed to the group owner (pooled storage).
          example: 2481152
      required:
        - filename
        - mimetype
        - albumId
        - sizeBytes

    UploadSignedUrlResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            uploadUrl:
              type: string
              example: "https://minio.example.com/album/user-123/..."
            minioFileId:
              type: string
              example: "album/user-123/507f1f77bcf86cd799439011/original.jpg"
            albumId:
              type: string
              example: "507f1f77bcf86cd799439011"
            expiresInMinutes:
              type: integer
              example: 15
      required:
        - success
        - data

    CollageCreateRequest:
      type: object
      properties:
        title:
          type: string
          example: "Summer Memories Collage"
        config:
          type: object
          description: "Collage configuration"
        albumIds:
          type: array
          items:
            type: string
          example: ["507f1f77bcf86cd799439011"]
        groupId:
          type: string
          description: "Optional group to associate the collage with"
      required:
        - title
        - albumIds

    CollageUpdateRequest:
      type: object
      properties:
        title:
          type: string
          example: "Updated Collage Title"
        config:
          type: object
          description: "Updated collage configuration"
        albumIds:
          type: array
          items:
            type: string
        groupId:
          type: string
          description: "Optional group to associate the collage with"

    AlbumsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            albums:
              type: array
              items:
                $ref: '#/components/schemas/Album'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 50
                total:
                  type: integer
                  example: 100
                pages:
                  type: integer
                  example: 2
      required:
        - success
        - data

    PhotosResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            photos:
              type: array
              items:
                $ref: '#/components/schemas/Photo'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 50
                total:
                  type: integer
                  example: 100
                pages:
                  type: integer
                  example: 2
      required:
        - success
        - data

    CollagesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            collages:
              type: array
              items:
                $ref: '#/components/schemas/Collage'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 50
                total:
                  type: integer
                  example: 100
                pages:
                  type: integer
                  example: 2
      required:
        - success
        - data

    StatisticsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            totalAlbums:
              type: integer
              example: 25
            totalPhotos:
              type: integer
              example: 1250
            totalCollages:
              type: integer
              example: 8
            totalStorageUsed:
              type: integer
              example: 5242880000
            albumsByMonth:
              type: object
              description: "Monthly album creation statistics"
            photosByMonth:
              type: object
              description: "Monthly photo upload statistics"
            storageByAlbum:
              type: array
              items:
                type: object
                properties:
                  albumId:
                    type: string
                  albumName:
                    type: string
                  storageUsed:
                    type: integer
      required:
        - success
        - data

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          description: "Response data (varies by endpoint)"
      required:
        - success
        - message

  securitySchemes:
    internalAuth:
      type: apiKey
      in: header
      name: x-internal-token
      description: Shared secret between Tumbaland's services. chat-service calls the internal routes.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /health:
    get:
      summary: Readiness, including database connectivity
      description: Public. Liveness for the orchestrator is `/health/live`, mounted by backend-core.
      security: []
      responses:
        '200': { description: Healthy }
        '503': { description: Database unreachable }

  # Album Endpoints
  /api/albums:
    get:
      tags: [Albums]
      summary: Get all albums
      description: Retrieve all albums for the authenticated user with pagination and filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of albums per page
        - name: search
          in: query
          schema:
            type: string
          description: Search query for album name, description, or tags
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by group ID
      responses:
        '200':
          description: Albums retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

    post:
      tags: [Albums]
      summary: Create album
      description: Create a new album
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequest'
      responses:
        '201':
          description: Album created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/albums/{id}:
    get:
      tags: [Albums]
      summary: Get album by ID
      description: Retrieve a specific album by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Album ID
      responses:
        '200':
          description: Album retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

    put:
      tags: [Albums]
      summary: Update album
      description: Update an existing album
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Album ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumUpdateRequest'
      responses:
        '200':
          description: Album updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

    delete:
      tags: [Albums]
      summary: Delete album
      description: Delete an album by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Album ID
      responses:
        '200':
          description: Album deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/albums/{id}/cover:
    put:
      tags: [Albums]
      summary: Set album cover photo
      description: Set a photo as the cover photo for an album
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Album ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: string
                  example: "507f1f77bcf86cd799439012"
              required:
                - photoId
      responses:
        '200':
          description: Cover photo set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Album or photo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

    delete:
      tags: [Albums]
      summary: Remove album cover photo
      description: Remove the cover photo from an album
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Album ID
      responses:
        '200':
          description: Cover photo removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  # Photo Endpoints
  /api/photos:
    post:
      tags: [Photos]
      summary: Create photo
      description: Create a new photo record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoCreateRequest'
      responses:
        '201':
          description: Photo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/photos/album/{albumId}/sheet:
    get:
      tags: [Photos]
      summary: An album as a numbered sheet of pictures
      description: >
        One page of an album's photos, in the order they were taken, as a numbered
        grid in one JPEG, with the list of which number is which photo. Made for a
        connected assistant choosing photos for a collage.
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 36
            maximum: 48
          description: Photos on a page
        - name: tag
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Taken on or after
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Taken on or before
      responses:
        '200':
          description: The sheet and its list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      image:
                        type: string
                        description: The picture, base64
                      mimeType:
                        type: string
                        example: image/jpeg
                      width:
                        type: integer
                      height:
                        type: integer
                      page:
                        type: integer
                      pages:
                        type: integer
                      total:
                        type: integer
                      photos:
                        type: array
                        items:
                          type: object
                          properties:
                            n:
                              type: integer
                              description: The number on the picture
                            id:
                              type: string
                            name:
                              type: string
                            dateTaken:
                              type: string
                              format: date-time
                            aspect:
                              type: number
                              description: Width over height, as drawn
                            mimetype:
                              type: string
                            tags:
                              type: array
                              items:
                                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /api/photos/album/{albumId}:
    get:
      tags: [Photos]
      summary: Get photos by album
      description: Retrieve all photos for a specific album
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
          description: Album ID
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of photos per page
        - name: search
          in: query
          schema:
            type: string
          description: Search query for photo title, description, or tags
      responses:
        '200':
          description: Photos retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotosResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
