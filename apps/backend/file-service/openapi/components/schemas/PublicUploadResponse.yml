type: object
description: |
  Note: unlike most of this API's success responses, this one is not
  wrapped in a `data` envelope — the fields sit at the top level.
properties:
  success:
    type: boolean
    example: true
  message:
    type: string
    example: 'File uploaded'
  fileId:
    type: string
    example: 'groupId/albumId/photo.jpg'
required:
  - success
  - message
  - fileId
