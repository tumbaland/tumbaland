type: object
properties:
  success:
    type: boolean
    example: true
  data:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: Path relative to the configured data directory.
          example: 'groupId/albumId/photo.jpg'
        size:
          type: integer
          format: int64
      required:
        - name
        - size
required:
  - success
  - data
