services:
  file-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/file-service:latest
    restart: unless-stopped
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - FILE_ACCESS_SECRET=${FILE_ACCESS_SECRET}
      - ALBUM_API_URL=${ALBUM_API_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FILE_API_URL=${FILE_API_URL}
    volumes:
      - ./storage:/storage
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
