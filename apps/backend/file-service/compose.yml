services:
  file-service:
    build:
      # The repository root: images install from the root lockfile.
      context: ../../..
      dockerfile: docker/Dockerfile.back
      args:
        APP: file-service
        PORT: 5002
    image: toomastahves/tumbaland-file-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      - NODE_ENV=production
      - FILE_SERVICE_API_KEY=${FILE_SERVICE_API_KEY}
      - FILE_SERVICE_HMAC_SECRET=${FILE_SERVICE_HMAC_SECRET}
      - FILE_SERVICE_PUBLIC_URL=${FILE_SERVICE_PUBLIC_URL}
      - FILE_SERVICE_DATA_DIR=/data
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      - file_data:/data
    init: true
    networks:
      - tumbanet

volumes:
  file_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FILE_DATA_PATH:-./data}

networks:
  tumbanet:
    external: true
