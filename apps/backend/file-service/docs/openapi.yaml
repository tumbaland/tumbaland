openapi: 3.0.3
info:
  title: File Service API
  description: |
    A comprehensive file upload service with Google Cloud Storage integration, featuring signed URLs for secure access with uniform bucket-level access.
    
    ## Key Features
    - File upload with automatic UUID-based naming
    - Secure signed URLs for file access
    - Direct client upload capabilities
    - Uniform bucket-level access compatibility
    - Full TypeScript support
  version: 1.0.0
  contact:
    name: Tumbaland Development Team
    email: dev@tumbaland.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5002/api
    description: Development server
  - url: https://api.tumbaland.com/files
    description: Production server

tags:
  - name: files
    description: File operations including upload, download, and management
  - name: signed-urls
    description: Secure URL generation for file access and uploads
  - name: health
    description: Service health and status

paths:
  /upload:
    post:
      tags:
        - files
      summary: Upload a file
      description: |
        Upload a single file to Google Cloud Storage. The file will be given a unique UUID-based name 
        and the original filename will be preserved in metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
              required:
                - file
            encoding:
              file:
                contentType: '*/*'
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              example:
                success: true
                message: "File uploaded successfully"
                data:
                  id: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
                  name: "Big party.jpg"
                  size: 75430
                  mimetype: "image/jpeg"
                  url: "https://storage.googleapis.com/tumbabucket/21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
                  uploadedAt: "2025-06-23T10:53:34.000Z"
        '400':
          description: Bad request - No file provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  message: "No file provided"
                  status: 400
        '500':
          $ref: '#/components/responses/InternalServerError'

  /upload-url:
    post:
      tags:
        - signed-urls
      summary: Get upload signed URL
      description: |
        Generate a pre-signed URL for direct client-side upload to Google Cloud Storage.
        This allows clients to upload files directly without going through the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  description: The desired filename for the upload
                  example: "my-image.jpg"
                contentType:
                  type: string
                  description: The MIME type of the file
                  example: "image/jpeg"
                expirationMinutes:
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 15
                  description: URL expiration time in minutes
              required:
                - fileName
                - contentType
      responses:
        '200':
          description: Upload signed URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignedUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /signed-url/{fileId}:
    get:
      tags:
        - signed-urls
      summary: Get signed URL for file access
      description: |
        Generate a signed URL for secure file access. This URL provides temporary access
        to the file without requiring authentication.
      parameters:
        - name: fileId
          in: path
          required: true
          description: The unique file ID (generated during upload)
          schema:
            type: string
            example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
        - name: expires
          in: query
          required: false
          description: Expiration time in minutes (1-1440)
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 60
            example: 120
      responses:
        '200':
          description: Signed URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /download/{fileId}:
    get:
      tags:
        - files
      summary: Download a file
      description: Download a file directly through the server
      parameters:
        - name: fileId
          in: path
          required: true
          description: The unique file ID (generated during upload)
          schema:
            type: string
            example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
      responses:
        '200':
          description: File downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              description: The MIME type of the file
              schema:
                type: string
                example: "image/jpeg"
            Content-Length:
              description: The size of the file in bytes
              schema:
                type: integer
                example: 75430
            Content-Disposition:
              description: Attachment header with original filename
              schema:
                type: string
                example: 'attachment; filename="Big party.jpg"'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{fileId}:
    get:
      tags:
        - files
      summary: Get file metadata
      description: Retrieve detailed metadata information for a specific file
      parameters:
        - name: fileId
          in: path
          required: true
          description: The unique file ID (generated during upload)
          schema:
            type: string
            example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
      responses:
        '200':
          description: File metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadataResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - files
      summary: Delete a file
      description: Permanently delete a file from Google Cloud Storage
      parameters:
        - name: fileId
          in: path
          required: true
          description: The unique file ID (generated during upload)
          schema:
            type: string
            example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /:
    get:
      tags:
        - files
      summary: List files
      description: |
        List files in the storage bucket with optional filtering and pagination.
        All returned URLs are signed for secure access.
      parameters:
        - name: prefix
          in: query
          required: false
          description: Filter files by prefix
          schema:
            type: string
            example: "images/"
        - name: limit
          in: query
          required: false
          description: Maximum number of files to return
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 50
      responses:
        '200':
          description: Files listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFilesResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    FileUploadData:
      type: object
      properties:
        id:
          type: string
          description: Generated unique filename (UUID-based)
          example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
        name:
          type: string
          description: Original filename
          example: "Big party.jpg"
        size:
          type: integer
          description: File size in bytes
          example: 75430
        mimetype:
          type: string
          description: MIME type of the file
          example: "image/jpeg"
        url:
          type: string
          description: Signed URL for secure access (expires in 1 hour)
          example: "https://storage.googleapis.com/tumbabucket/21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
        uploadedAt:
          type: string
          format: date-time
          description: Upload timestamp in ISO format
          example: "2025-06-23T10:53:34.000Z"
      required:
        - id
        - name
        - size
        - mimetype
        - url
        - uploadedAt

    FileMetadata:
      type: object
      properties:
        id:
          type: string
          description: Unique file ID
          example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
        name:
          type: string
          description: File name (original or ID)
          example: "Big party.jpg"
        size:
          type: integer
          description: File size in bytes
          example: 75430
        contentType:
          type: string
          description: MIME type of the file
          example: "image/jpeg"
        created:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-06-23T10:53:34.000Z"
        updated:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-06-23T10:53:34.000Z"
        url:
          type: string
          description: Signed URL for secure access
          example: "https://storage.googleapis.com/tumbabucket/21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
      required:
        - id
        - name
        - size
        - url

    UploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "File uploaded successfully"
        data:
          $ref: '#/components/schemas/FileUploadData'
      required:
        - success
        - message
        - data

    FileMetadataResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/FileMetadata'
      required:
        - success
        - data

    SignedUrlResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            signedUrl:
              type: string
              description: The signed URL for file access
              example: "https://storage.googleapis.com/tumbabucket/21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
            fileId:
              type: string
              description: The file ID
              example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
            expiresInMinutes:
              type: integer
              description: Expiration time in minutes
              example: 60
            expiresAt:
              type: string
              format: date-time
              description: Absolute expiration timestamp
              example: "2025-06-23T11:53:34.000Z"
          required:
            - signedUrl
            - fileId
            - expiresInMinutes
            - expiresAt
      required:
        - success
        - data

    UploadSignedUrlResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            uploadUrl:
              type: string
              description: The signed URL for direct upload
              example: "https://storage.googleapis.com/tumbabucket/my-file.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
            fileName:
              type: string
              description: The filename for upload
              example: "my-file.jpg"
            contentType:
              type: string
              description: The content type
              example: "image/jpeg"
            expiresInMinutes:
              type: integer
              description: Expiration time in minutes
              example: 15
            expiresAt:
              type: string
              format: date-time
              description: Absolute expiration timestamp
              example: "2025-06-23T11:08:34.000Z"
          required:
            - uploadUrl
            - fileName
            - contentType
            - expiresInMinutes
            - expiresAt
      required:
        - success
        - data

    DeleteFileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: "File deleted successfully"
            fileId:
              type: string
              description: The deleted file ID
              example: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
            deletedAt:
              type: string
              format: date-time
              description: Deletion timestamp
              example: "2025-06-23T10:53:34.000Z"
          required:
            - message
            - fileId
            - deletedAt
      required:
        - success
        - data

    ListFilesResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileMetadata'
        count:
          type: integer
          description: Number of files returned
          example: 5
      required:
        - files
        - count

    ListFilesResponseWrapper:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ListFilesResponse'
      required:
        - success
        - data

    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Error description
              example: "File not found"
            status:
              type: integer
              description: HTTP status code
              example: 404
          required:
            - message
            - status
      required:
        - error

  responses:
    BadRequest:
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              message: "Invalid file ID format"
              status: 400

    FileNotFound:
      description: File not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              message: "File not found"
              status: 404

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              message: "Internal server error"
              status: 500

  examples:
    UploadExample:
      summary: Successful file upload
      value:
        success: true
        message: "File uploaded successfully"
        data:
          id: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
          name: "Big party.jpg"
          size: 75430
          mimetype: "image/jpeg"
          url: "https://storage.googleapis.com/tumbabucket/21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
          uploadedAt: "2025-06-23T10:53:34.000Z"

    FileMetadataExample:
      summary: File metadata response
      value:
        success: true
        data:
          id: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
          name: "Big party.jpg"
          size: 75430
          contentType: "image/jpeg"
          created: "2025-06-23T10:53:34.000Z"
          updated: "2025-06-23T10:53:34.000Z"
          url: "https://storage.googleapis.com/tumbabucket/21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."

    ListFilesExample:
      summary: List files response
      value:
        success: true
        data:
          files:
            - id: "21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg"
              name: "Big party.jpg"
              size: 75430
              contentType: "image/jpeg"
              created: "2025-06-23T10:53:34.000Z"
              updated: "2025-06-23T10:53:34.000Z"
              url: "https://storage.googleapis.com/tumbabucket/21d197c3-7e7a-458d-a7d6-b1a271f657af.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
            - id: "f8d2e1c9-4b3a-5c6d-7e8f-9a0b1c2d3e4f.png"
              name: "Screenshot.png"
              size: 156789
              contentType: "image/png"
              created: "2025-06-23T09:30:15.000Z"
              updated: "2025-06-23T09:30:15.000Z"
              url: "https://storage.googleapis.com/tumbabucket/f8d2e1c9-4b3a-5c6d-7e8f-9a0b1c2d3e4f.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&..."
          count: 2
