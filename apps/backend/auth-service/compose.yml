services:
  auth-service:
    build:
      # The repository root: images install from the root lockfile.
      context: ../../..
      dockerfile: docker/Dockerfile.back
      args:
        APP: auth-service
        PORT: 5001
    image: toomastahves/tumbaland-auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - NODE_ENV=production
      # Labels this process in metrics, health and the audit trail. Without it
      # every row auth-service writes reads as "unknown-service".
      - SERVICE_NAME=auth-service
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_ENCRYPTION_SECRET=${API_KEY_ENCRYPTION_SECRET}
      # OAuth: the issuer names itself in tokens and metadata, and only mints
      # for the one MCP resource it knows about.
      - AUTH_SERVICE_PUBLIC_URL=${AUTH_SERVICE_URL}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL}
      - AUTH_FRONT_URL=${AUTH_FRONT_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_NATIVE_CLIENT_IDS=${GOOGLE_NATIVE_CLIENT_IDS:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - GROUP_API_URL=${GROUP_API_URL}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
