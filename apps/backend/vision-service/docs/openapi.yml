openapi: 3.0.0
info:
  title: Vision Service API
  description: |
    Vision Service API for managing machine learning datasets, trainings, epochs, configurations, and analyses.
    This service handles the storage and retrieval of vision-based training data and model configurations.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:4010/api
    description: Local development server
  - url: https://api.tumbaland.com/api
    description: Production server

tags:
  - name: Datasets
    description: Dataset management endpoints
  - name: Trainings
    description: Training session management endpoints
  - name: Epochs
    description: Training epoch data endpoints
  - name: Configs
    description: Training configuration endpoints
  - name: Analysis
    description: Dataset analysis endpoints

components:
  schemas:
    Dataset:
      type: object
      required:
        - uuid
        - name
        - timestamp
      properties:
        _id:
          type: string
          description: MongoDB object ID
        uuid:
          type: string
          description: Unique identifier for the dataset
        name:
          type: string
          description: Name of the dataset
          maxLength: 200
        description:
          type: string
          description: Optional description of the dataset
          maxLength: 1000
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the dataset
        dataset_info:
          type: object
          description: Dataset information metadata
        annotations:
          type: object
          description: Dataset annotations
        camera:
          type: object
          description: Camera information
        lidar:
          type: object
          description: LiDAR sensor information
        metadata:
          type: object
          description: Additional metadata
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Training:
      type: object
      required:
        - uuid
        - name
        - status
      properties:
        _id:
          type: string
          description: MongoDB object ID
        uuid:
          type: string
          description: Unique identifier for the training
        name:
          type: string
          description: Name of the training session
          maxLength: 200
        description:
          type: string
          description: Optional description
          maxLength: 1000
        datasetId:
          type: string
          description: Associated dataset ID
        configId:
          type: string
          description: Associated config ID
        status:
          type: string
          enum: [pending, running, completed, failed]
          description: Current training status
        startTime:
          type: string
          format: date-time
          description: Training start time
        endTime:
          type: string
          format: date-time
          description: Training end time
        metadata:
          type: object
          description: Additional metadata
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Epoch:
      type: object
      required:
        - trainingId
        - training_uuid
        - epoch_uuid
        - epoch
        - timestamp
        - results
      properties:
        _id:
          type: string
          description: MongoDB object ID
        trainingId:
          type: string
          description: Associated training ID
        training_uuid:
          type: string
          description: Associated training UUID
        epoch_uuid:
          type: string
          description: Unique epoch identifier
        epoch:
          type: integer
          description: Epoch number
        timestamp:
          type: string
          format: date-time
          description: Epoch timestamp
        results:
          type: object
          description: Epoch training results (loss, accuracy, metrics, etc.)
        learning_rate:
          type: number
          description: Learning rate used in this epoch
        epoch_time:
          type: number
          description: Time taken for epoch (in seconds)
        metadata:
          type: object
          description: Additional metadata
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Config:
      type: object
      required:
        - config_uuid
        - summary
        - config_data
      properties:
        _id:
          type: string
          description: MongoDB object ID
        config_uuid:
          type: string
          description: Unique configuration identifier
        summary:
          type: string
          description: Configuration summary
        config_data:
          type: object
          description: Complete configuration data
        config_name:
          type: string
          description: Optional configuration name
        metadata:
          type: object
          description: Additional metadata
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DatasetAnalysis:
      type: object
      required:
        - dataset
        - total_frames
        - total_pixels
        - total_classes
        - image_dimensions
        - class_analysis
      properties:
        _id:
          type: string
          description: MongoDB object ID
        timestamp:
          type: string
          format: date-time
          description: Analysis timestamp
        dataset:
          type: string
          description: Dataset name (waymo, zod, etc.)
        total_frames:
          type: integer
          description: Total number of frames
        total_pixels:
          type: integer
          description: Total number of pixels
        total_classes:
          type: integer
          description: Total number of classes
        image_dimensions:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        class_analysis:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              class_id:
                type: integer
              total_pixels:
                type: integer
              pixel_percentage:
                type: number
              frames_with_class:
                type: integer
              frame_coverage_percentage:
                type: number
              avg_pixels_per_frame:
                type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        timestamp:
          type: string
          format: date-time

paths:
  /datasets:
    get:
      tags:
        - Datasets
      summary: Get all datasets
      description: Retrieve a list of all datasets with pagination support
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Datasets
      summary: Create a new dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uuid
                - name
                - timestamp
              properties:
                uuid:
                  type: string
                name:
                  type: string
                description:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                dataset_info:
                  type: object
                annotations:
                  type: object
                camera:
                  type: object
                lidar:
                  type: object
                metadata:
                  type: object
      responses:
        '201':
          description: Dataset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /datasets/{id}:
    get:
      tags:
        - Datasets
      summary: Get dataset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Datasets
      summary: Update dataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                dataset_info:
                  type: object
                annotations:
                  type: object
                camera:
                  type: object
                lidar:
                  type: object
                metadata:
                  type: object
      responses:
        '200':
          description: Dataset updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Datasets
      summary: Delete dataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dataset deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /datasets/uuid/{uuid}:
    get:
      tags:
        - Datasets
      summary: Get dataset by UUID
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trainings:
    get:
      tags:
        - Trainings
      summary: Get all trainings
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Training'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Trainings
      summary: Create a new training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uuid
                - name
              properties:
                uuid:
                  type: string
                name:
                  type: string
                description:
                  type: string
                datasetId:
                  type: string
                configId:
                  type: string
                status:
                  type: string
                  enum: [pending, running, completed, failed]
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                metadata:
                  type: object
      responses:
        '201':
          description: Training created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Training'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trainings/{id}:
    get:
      tags:
        - Trainings
      summary: Get training by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Training'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Trainings
      summary: Update training
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [pending, running, completed, failed]
                endTime:
                  type: string
                  format: date-time
                metadata:
                  type: object
      responses:
        '200':
          description: Training updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Training'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Trainings
      summary: Delete training
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Training deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trainings/uuid/{uuid}:
    get:
      tags:
        - Trainings
      summary: Get training by UUID
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Training'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trainings/compare:
    post:
      tags:
        - Trainings
      summary: Compare multiple trainings
      description: Compare up to 10 trainings with their epochs, metrics, and cost analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trainingIds
              properties:
                trainingIds:
                  type: array
                  items:
                    type: string
                  description: Array of training IDs to compare (max 10)
                  maxItems: 10
      responses:
        '200':
          description: Successful comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      comparison:
                        type: array
                        items:
                          type: object
                          properties:
                            training:
                              $ref: '#/components/schemas/Training'
                            metrics:
                              type: object
                              properties:
                                totalEpochs:
                                  type: integer
                                totalTime:
                                  type: number
                                avgEpochTime:
                                  type: number
                                maxEpochTime:
                                  type: number
                                cost:
                                  type: object
                                  properties:
                                    totalHours:
                                      type: number
                                    cpuCost:
                                      type: number
                                    gpuCost:
                                      type: number
                                    totalCost:
                                      type: number
                            lastEpoch:
                              type: object
                              nullable: true
                              properties:
                                epoch:
                                  type: integer
                                results:
                                  type: object
                                timestamp:
                                  type: string
                                  format: date-time
                            epochs:
                              type: array
                              items:
                                type: object
                                properties:
                                  epoch:
                                    type: integer
                                  results:
                                    type: object
                                  epoch_time:
                                    type: number
                                  timestamp:
                                    type: string
                                    format: date-time
                      summary:
                        type: object
                        properties:
                          totalTrainings:
                            type: integer
                          trainingsWithEpochs:
                            type: integer
        '400':
          description: Invalid input or too many trainings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trainings/{id}/epochs:
    get:
      tags:
        - Trainings
      summary: Get training with all epochs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Training with epochs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Training'
                  - type: object
                    properties:
                      epochs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Epoch'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /epochs:
    get:
      tags:
        - Epochs
      summary: Get all epochs (paginated)
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Epoch'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Epochs
      summary: Create a new epoch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trainingId
                - training_uuid
                - epoch_uuid
                - epoch
                - timestamp
                - results
              properties:
                trainingId:
                  type: string
                training_uuid:
                  type: string
                epoch_uuid:
                  type: string
                epoch:
                  type: integer
                timestamp:
                  type: string
                  format: date-time
                results:
                  type: object
                learning_rate:
                  type: number
                epoch_time:
                  type: number
                metadata:
                  type: object
      responses:
        '201':
          description: Epoch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Epoch'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /epochs/upload:
    post:
      tags:
        - Epochs
      summary: Create epoch from JSON file upload
      description: Upload epoch data as JSON file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Epoch created from file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Epoch'
        '400':
          description: Invalid file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /epochs/batch:
    post:
      tags:
        - Epochs
      summary: Create multiple epochs in batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                epochs:
                  type: array
                  items:
                    type: object
                    required:
                      - trainingId
                      - training_uuid
                      - epoch_uuid
                      - epoch
                      - timestamp
                      - results
                    properties:
                      trainingId:
                        type: string
                      training_uuid:
                        type: string
                      epoch_uuid:
                        type: string
                      epoch:
                        type: integer
                      timestamp:
                        type: string
                        format: date-time
                      results:
                        type: object
                      learning_rate:
                        type: number
                      epoch_time:
                        type: number
                      metadata:
                        type: object
      responses:
        '201':
          description: Epochs created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Epoch'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /epochs/{id}:
    get:
      tags:
        - Epochs
      summary: Get epoch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Epoch'
        '404':
          description: Epoch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Epochs
      summary: Update epoch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: object
                learning_rate:
                  type: number
                epoch_time:
                  type: number
                metadata:
                  type: object
      responses:
        '200':
          description: Epoch updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Epoch'
        '404':
          description: Epoch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Epochs
      summary: Delete epoch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Epoch deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Epoch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /epochs/training/{trainingId}:
    get:
      tags:
        - Epochs
      summary: Get all epochs for a training
      parameters:
        - name: trainingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Epoch'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /epochs/uuid/{uuid}:
    get:
      tags:
        - Epochs
      summary: Get epoch by UUID
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
