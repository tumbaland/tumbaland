openapi: 3.0.3
info:
  title: Vision Service API
  description: |
    Backend API service for managing machine learning datasets, training configurations, 
    and training epochs for computer vision models.
    
    ## Features
    - Dataset management with flexible schema
    - Training configuration tracking
    - Epoch-by-epoch training metrics
    - Dynamic data structures
    - Pagination and filtering
    
    ## Data Flow
    Dataset → Training Configuration → Multiple Epochs
  version: 1.0.0
  contact:
    name: Toomas Tahves
    email: toomas@tumbaland.com
  license:
    name: MIT

servers:
  - url: http://localhost:4010/api
    description: Development server
  - url: http://vision-service:4010/api
    description: Docker internal network

tags:
  - name: Datasets
    description: Dataset management operations
  - name: Trainings
    description: Training configuration and management
  - name: Epochs
    description: Training epoch results
  - name: System
    description: System health and metrics

paths:
  /datasets:
    get:
      tags:
        - Datasets
      summary: List all datasets
      description: Get a paginated list of datasets with optional search and sorting
      operationId: listDatasets
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: Text search in name and description
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field to sort by
          schema:
            type: string
            default: updatedAt
            enum: [name, timestamp, createdAt, updatedAt]
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Datasets
      summary: Create a new dataset
      description: Create a new dataset with analysis information
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetInput'
      responses:
        '201':
          description: Dataset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/{id}:
    get:
      tags:
        - Datasets
      summary: Get dataset by ID
      description: Retrieve a specific dataset by MongoDB ID
      operationId: getDatasetById
      parameters:
        - name: id
          in: path
          required: true
          description: Dataset MongoDB ID
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Datasets
      summary: Update dataset
      description: Update an existing dataset
      operationId: updateDataset
      parameters:
        - name: id
          in: path
          required: true
          description: Dataset MongoDB ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetInput'
      responses:
        '200':
          description: Dataset updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Datasets
      summary: Delete dataset
      description: Delete a dataset
      operationId: deleteDataset
      parameters:
        - name: id
          in: path
          required: true
          description: Dataset MongoDB ID
          schema:
            type: string
      responses:
        '200':
          description: Dataset deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasets/uuid/{uuid}:
    get:
      tags:
        - Datasets
      summary: Get dataset by UUID
      description: Retrieve a specific dataset by UUID
      operationId: getDatasetByUuid
      parameters:
        - name: uuid
          in: path
          required: true
          description: Dataset UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainings:
    get:
      tags:
        - Trainings
      summary: List all trainings
      description: Get a paginated list of trainings with optional filters
      operationId: listTrainings
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: datasetId
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            default: updatedAt
        - name: order
          in: query
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingListResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Trainings
      summary: Create a new training
      description: Create a new training configuration
      operationId: createTraining
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingInput'
      responses:
        '201':
          description: Training created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainings/{id}:
    get:
      tags:
        - Trainings
      summary: Get training by ID
      operationId: getTrainingById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Trainings
      summary: Update training
      operationId: updateTraining
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingInput'
      responses:
        '200':
          description: Training updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Trainings
      summary: Delete training
      description: Delete a training and all its epochs
      operationId: deleteTraining
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Training deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainings/{id}/epochs:
    get:
      tags:
        - Trainings
      summary: Get training with all epochs
      description: Retrieve a training with all its epoch results
      operationId: getTrainingWithEpochs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            default: epoch
        - name: order
          in: query
          schema:
            type: string
            default: asc
            enum: [asc, desc]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingWithEpochsResponse'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trainings/uuid/{uuid}:
    get:
      tags:
        - Trainings
      summary: Get training by UUID
      operationId: getTrainingByUuid
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /epochs/training/{trainingId}:
    get:
      tags:
        - Epochs
      summary: Get epochs by training
      description: Get all epochs for a specific training
      operationId: getEpochsByTraining
      parameters:
        - name: trainingId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
            default: epoch
        - name: order
          in: query
          schema:
            type: string
            default: asc
            enum: [asc, desc]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochListResponse'
        '404':
          description: Training not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /epochs:
    post:
      tags:
        - Epochs
      summary: Create a new epoch
      description: Create a single epoch result
      operationId: createEpoch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpochInput'
      responses:
        '201':
          description: Epoch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /epochs/batch:
    post:
      tags:
        - Epochs
      summary: Create multiple epochs
      description: Create multiple epochs in a single request
      operationId: createEpochsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - epochs
              properties:
                epochs:
                  type: array
                  items:
                    $ref: '#/components/schemas/EpochInput'
      responses:
        '201':
          description: Epochs created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochBatchResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /epochs/{id}:
    get:
      tags:
        - Epochs
      summary: Get epoch by ID
      operationId: getEpochById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochResponse'
        '404':
          description: Epoch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Epochs
      summary: Update epoch
      operationId: updateEpoch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpochInput'
      responses:
        '200':
          description: Epoch updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochResponse'
        '404':
          description: Epoch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Epochs
      summary: Delete epoch
      operationId: deleteEpoch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Epoch deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Epoch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /epochs/uuid/{uuid}:
    get:
      tags:
        - Epochs
      summary: Get epoch by UUID
      operationId: getEpochByUuid
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochResponse'
        '404':
          description: Epoch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Check if the service is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: vision-service
                  timestamp:
                    type: string
                    format: date-time

  /metrics:
    get:
      tags:
        - System
      summary: Prometheus metrics
      description: Get Prometheus-formatted metrics
      operationId: getMetrics
      responses:
        '200':
          description: Metrics data
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    Dataset:
      type: object
      required:
        - uuid
        - name
        - timestamp
      properties:
        _id:
          type: string
          description: MongoDB document ID
        uuid:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          maxLength: 200
          description: Dataset name
        description:
          type: string
          maxLength: 1000
          description: Dataset description
        timestamp:
          type: string
          format: date-time
          description: Analysis timestamp
        dataset_info:
          type: object
          description: Dataset information (flexible schema)
        annotations:
          type: object
          description: Annotation statistics (flexible schema)
        camera:
          type: object
          description: Camera statistics (flexible schema)
        lidar:
          type: object
          description: LiDAR statistics (flexible schema)
        metadata:
          type: object
          description: Additional metadata (flexible schema)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DatasetInput:
      type: object
      required:
        - name
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        timestamp:
          type: string
          format: date-time
        dataset_info:
          type: object
        annotations:
          type: object
        camera:
          type: object
        lidar:
          type: object
        metadata:
          type: object

    Training:
      type: object
      required:
        - uuid
        - name
        - configuration
      properties:
        _id:
          type: string
        uuid:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        datasetId:
          type: string
        configuration:
          type: object
          description: Training configuration (flexible schema)
        status:
          type: string
          enum: [pending, running, completed, failed]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrainingInput:
      type: object
      required:
        - name
        - configuration
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        datasetId:
          type: string
        configuration:
          type: object
        status:
          type: string
          enum: [pending, running, completed, failed]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        metadata:
          type: object

    Epoch:
      type: object
      required:
        - trainingId
        - training_uuid
        - epoch_uuid
        - epoch
        - timestamp
        - results
      properties:
        _id:
          type: string
        trainingId:
          type: string
        training_uuid:
          type: string
          format: uuid
        epoch_uuid:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        results:
          type: object
          description: Training results (flexible schema)
        learning_rate:
          type: number
          format: double
        epoch_time:
          type: number
          format: double
          description: Epoch duration in seconds
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EpochInput:
      type: object
      required:
        - trainingId
        - training_uuid
        - epoch
        - results
      properties:
        trainingId:
          type: string
        training_uuid:
          type: string
          format: uuid
        epoch_uuid:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        results:
          type: object
        learning_rate:
          type: number
        epoch_time:
          type: number
        metadata:
          type: object

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    DatasetListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/Dataset'
            pagination:
              $ref: '#/components/schemas/Pagination'

    DatasetResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Dataset'

    TrainingListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            trainings:
              type: array
              items:
                $ref: '#/components/schemas/Training'
            pagination:
              $ref: '#/components/schemas/Pagination'

    TrainingResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Training'

    TrainingWithEpochsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            training:
              $ref: '#/components/schemas/Training'
            epochs:
              type: array
              items:
                $ref: '#/components/schemas/Epoch'

    EpochListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            epochs:
              type: array
              items:
                $ref: '#/components/schemas/Epoch'
            pagination:
              $ref: '#/components/schemas/Pagination'
            total:
              type: integer

    EpochResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Epoch'

    EpochBatchResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Epoch'

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error message description
