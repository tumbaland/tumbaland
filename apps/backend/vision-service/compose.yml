services:
  vision-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/vision-service:latest
    restart: unless-stopped
    ports:
      - "4010:4010"
    environment:
      - PORT=4010
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # MinIO configuration (Album Service - Direct access to album buckets)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=443
      - MINIO_USE_SSL=true
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=vision
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
