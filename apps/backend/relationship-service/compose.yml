services:
  relationship-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/tumbaland-relationship-service:latest
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '4001:4001'
    environment:
      - PORT=4001
      - NODE_ENV=production
      - SERVICE_NAME=relationship-service
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Entitlements: statistics and journal reads are clipped by the plan's
      # retention floor. No group URL — retention is a per-caller limit, not a
      # pooled meter, so there is no group subject to resolve.
      - PAYMENT_INTERNAL_URL=${PAYMENT_INTERNAL_URL}
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
