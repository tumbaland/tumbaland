services:
  relationship-service:
    build:
      # The repository root: images install from the root lockfile.
      context: ../../..
      dockerfile: docker/Dockerfile.back
      args:
        APP: relationship-service
        PORT: 4001
    image: toomastahves/tumbaland-relationship-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '4001:4001'
    environment:
      - PORT=4001
      - NODE_ENV=production
      - SERVICE_NAME=relationship-service
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Group membership is asked of group-service on each request (backend-core currentGroupsOf).
      - GROUP_INTERNAL_URL=${GROUP_INTERNAL_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Entitlements: statistics and journal reads are clipped by the plan's
      # retention floor. No group URL — retention is a per-caller limit, not a
      # pooled meter, so there is no group subject to resolve.
      - PAYMENT_INTERNAL_URL=${PAYMENT_INTERNAL_URL}
      # Plan reminders are posted into the group's chat. Without it plans work
      # and nobody is reminded.
      - CHAT_INTERNAL_URL=${CHAT_INTERNAL_URL}
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
