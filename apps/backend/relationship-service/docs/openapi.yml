            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of types per page
          example: 50
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
          example: 1
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID
          example: "group456"
