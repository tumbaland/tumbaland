openapi: 3.0.3
info:
  title: Relationship Service API
  description: API for managing social relationship activities, activity types, and relationship statistics
  version: 1.0.0
  contact:
    name: Tumbaland Team
tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Activities
    description: Activity management and retrieval endpoints
  - name: Activity Types
    description: Activity type management endpoints
  - name: Statistics
    description: Relationship statistics and analytics endpoints
servers:
  - url: http://localhost:4001
    description: Development server
  - url: https://relationship-api.tumbaland.eu
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A session token, or an API key with the relationship scopes
    internalAuth:
      type: apiKey
      in: header
      name: x-internal-token
      description: Shared secret between Tumbaland's services
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Activity not found"
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: "Response data (varies by endpoint)"
        message:
          type: string
          nullable: true
          example: "Activity deleted successfully"
      required:
        - success

    ActivityType:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: "Date Night"
        slug:
          type: string
          example: "date-night"
        description:
          type: string
          nullable: true
          example: "Romantic evening activities"
        color:
          type: string
          nullable: true
          example: "#FF5733"
        icon:
          type: string
          nullable: true
          example: "heart"
        hasLocation:
          type: boolean
          default: false
          description: |
            Whether entries of this type can carry a place. Orthogonal to
            valueType, so a 'string' type can hold both a description and a
            location.
          example: true
        isActive:
          type: boolean
          default: true
          example: true
        sortOrder:
          type: integer
          default: 0
          example: 1
        userId:
          type: string
          example: "user123"
        groupId:
          type: string
          nullable: true
          example: "group456"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - slug
        - isActive
        - sortOrder
        - userId

    Activity:
      type: object
      description: |
        One logged entry: something that happened on a date. Which fields an
        entry carries depends on its type's valueType — 'string' types use
        description, 'number' types use hours, 'boolean' types are presence
        markers (the entry existing means "yes").
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        date:
          type: string
          format: date
          example: "2024-11-03"
        typeId:
          type: string
          example: "507f1f77bcf86cd799439011"
        description:
          type: string
          nullable: true
          example: "Dinner at Italian restaurant"
        hours:
          type: integer
          nullable: true
          minimum: 0
          example: 2
        location:
          type: object
          allOf:
            - $ref: '#/components/schemas/ActivityLocation'
          nullable: true
          description: Present only on entries whose type has hasLocation set.
        userId:
          type: string
          example: "user123"
        groupId:
          type: string
          nullable: true
          example: "group456"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - date
        - typeId
        - userId

    ActivityLocation:
      type: object
      description: Where an entry happened.
      properties:
        label:
          type: string
          maxLength: 200
          example: "Kolm Sõsarat"
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 59.4405
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 24.7453
      required:
        - label
        - lat
        - lng

    Place:
      type: object
      description: |
        A distinct place in a scope, with how often and when it was visited.
        Visits fold together by coordinates rounded to 4 decimals (~11 m), so a
        place re-picked from the geocoder with a slightly different name still
        lands on a single pin. The label shown comes from the most recent visit.
      properties:
        id:
          type: string
          description: Rounded "lat,lng" — stable pin identity.
          example: "59.4405,24.7453"
        label:
          type: string
          example: "Kolm Sõsarat"
        lat:
          type: number
          format: double
          example: 59.44051
        lng:
          type: number
          format: double
          example: 24.74532
        visits:
          type: integer
          example: 3
        firstVisit:
          type: string
          format: date
          example: "2024-01-02"
        lastVisit:
          type: string
          format: date
          example: "2024-06-11"
        types:
          type: array
          items:
            type: object
            properties:
              typeId:
                type: string
              name:
                type: string
              slug:
                type: string
              color:
                type: string
                nullable: true
              count:
                type: integer
      required:
        - id
        - label
        - lat
        - lng
        - visits
        - firstVisit
        - lastVisit
        - types

    PlaceVisit:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-06-11"
        typeId:
          type: string
        typeName:
          type: string
          nullable: true
        typeColor:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        hours:
          type: integer
          nullable: true
      required:
        - date
        - typeId

    ActivityWithType:
      allOf:
        - $ref: '#/components/schemas/Activity'
        - type: object
          properties:
            typeId:
              $ref: '#/components/schemas/ActivityType'

    Day:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-07-04"
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ActivityWithType'
      required:
        - date
        - entries

    SaveDayRequest:
      type: object
      properties:
        entries:
          type: array
          description: |
            The complete set of entries for the day. Entries with a matching
            _id are updated, new ones created, and existing entries missing
            from the list are deleted. An empty list clears the day.
          items:
            type: object
            properties:
              _id:
                type: string
                description: Present when updating an existing entry
              typeId:
                type: string
              description:
                type: string
                maxLength: 500
              hours:
                type: integer
                minimum: 0
              location:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ActivityLocation'
                nullable: true
                description: |
                  Only accepted for types with hasLocation set; null clears a
                  previously saved place.
            required:
              - typeId
        groupId:
          type: string
          nullable: true
      required:
        - entries

    Plan:
      type: object
      description: |
        Something coming up: a concert on Friday at 19:00, a trip over a few
        days. Not an entry; it becomes one when it is logged afterwards.
      properties:
        _id:
          type: string
        title:
          type: string
          example: Concert
        date:
          type: string
          format: date
          description: The day, or the first day of a trip
          example: "2026-10-16"
        endDate:
          type: string
          format: date
          nullable: true
          description: The last day of a trip; null for one day
        time:
          type: string
          nullable: true
          description: HH:mm in timeZone; null all day
          example: "19:00"
        timeZone:
          type: string
          example: Europe/Tallinn
        startsAt:
          type: string
          format: date-time
        notes:
          type: string
        typeId:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/ActivityType'
        location:
          $ref: '#/components/schemas/ActivityLocation'
        remindBefore:
          type: integer
          nullable: true
          description: |
            Minutes before the start to remind the group in its chat, or null
            for none. An all-day plan counts from 09:00 on its day.
        remindAt:
          type: string
          format: date-time
          nullable: true
        remindedAt:
          type: string
          format: date-time
          nullable: true
        loggedActivityId:
          type: string
          nullable: true
        userId:
          type: string
        groupId:
          type: string

    PlanInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        date:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        time:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        timeZone:
          type: string
          description: IANA zone; Europe/Tallinn when absent
        notes:
          type: string
          maxLength: 1000
        typeId:
          type: string
          nullable: true
        location:
          $ref: '#/components/schemas/ActivityLocation'
        remindBefore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 43200
          description: Absent on create means 60 for a timed plan, 0 for an all-day one
        groupId:
          type: string
          description: Create only; a plan stays in the scope it was made in

    ActivityStats:
      type: object
      properties:
        _id:
          type: string
          example: "date-night"
        name:
          type: string
          example: "Date Night"
        count:
          type: integer
          example: 15
        totalHours:
          type: integer
          example: 45
        avgHours:
          type: number
          example: 3.0
      required:
        - _id
        - name
        - count
        - totalHours
        - avgHours

    TypeStatistics:
      type: object
      description: Per-activity-type statistics for the selected timeframe
      properties:
        typeId:
          type: string
        slug:
          type: string
        name:
          type: string
        color:
          type: string
          nullable: true
        valueType:
          type: string
          nullable: true
        count:
          type: integer
        totalHours:
          type: number
        uniqueDays:
          type: integer
          description: Distinct days with at least one entry of this type
      required:
        - typeId
        - slug
        - name
        - count
        - totalHours
        - uniqueDays

    RelationshipStatistics:
      type: object
      description: |
        Type-agnostic statistics. The dashboard decides which types to
        feature via the user's dashboard settings.
      properties:
        totalActivities:
          type: integer
          example: 150
        totalHours:
          type: number
          example: 450
        firstEntryDate:
          type: string
          format: date
          nullable: true
          description: Date of the first entry ever logged in this scope
        daysSinceFirstEntry:
          type: integer
        types:
          type: array
          items:
            $ref: '#/components/schemas/TypeStatistics'
      required:
        - totalActivities
        - totalHours
        - daysSinceFirstEntry
        - types

    TypeCadence:
      type: object
      description: |
        How often one activity type is normally logged, and how long it has been.
        Never timeframe-limited: staleness only means anything against the full history.
      properties:
        typeId:
          type: string
        slug:
          type: string
        name:
          type: string
        color:
          type: string
          nullable: true
        lastDate:
          type: string
          format: date
          description: Most recent entry of this type
        daysSince:
          type: integer
          description: Whole days between lastDate and today (0 = logged today)
        loggedDays:
          type: integer
          description: Distinct days this type was ever logged on
        typicalGapDays:
          type: number
          nullable: true
          description: Mean gap between consecutive logged days; null until there are two
        overdueRatio:
          type: number
          nullable: true
          description: |
            daysSince measured against this type's own rhythm — 1 is exactly due,
            3 is three times the usual gap. Null when the cadence is unknown.
      required:
        - typeId
        - slug
        - name
        - lastDate
        - daysSince
        - loggedDays
        - typicalGapDays
        - overdueRatio

    TrendTotals:
      type: object
      description: What one window contains, for one activity type or across all of them
      properties:
        entries:
          type: integer
        hours:
          type: integer
        activeDays:
          type: integer
          description: Distinct days carrying at least one entry inside the window
      required:
        - entries
        - hours
        - activeDays

    TrendChange:
      type: object
      description: |
        One window against the one before it. Percent changes are null when the
        previous window was empty — there is no baseline to divide by, and
        `direction` says 'new' for that case instead.
      properties:
        current:
          $ref: '#/components/schemas/TrendTotals'
        previous:
          $ref: '#/components/schemas/TrendTotals'
        entriesDelta:
          type: integer
        hoursDelta:
          type: integer
        activeDaysDelta:
          type: integer
        entriesChangePct:
          type: number
          nullable: true
        hoursChangePct:
          type: number
          nullable: true
        direction:
          type: string
          enum: [up, down, flat, new, stopped]
          description: |
            Movement in entry count. 'new' is a type with an empty previous window,
            'stopped' one with an empty current window.
      required:
        - current
        - previous
        - entriesDelta
        - hoursDelta
        - activeDaysDelta
        - entriesChangePct
        - hoursChangePct
        - direction

    TypeTrend:
      allOf:
        - $ref: '#/components/schemas/TrendChange'
        - type: object
          description: One activity type's movement between the two windows
          properties:
            typeId:
              type: string
            slug:
              type: string
            name:
              type: string
            color:
              type: string
              nullable: true
            valueType:
              type: string
              enum: [string, boolean, number]
          required:
            - typeId
            - slug
            - name

    TrendsResult:
      type: object
      description: The last N days against the N before them, per activity type
      properties:
        windowDays:
          type: integer
          example: 30
        currentStart:
          type: string
          format: date
          description: First day of the current window, inclusive
        currentEnd:
          type: string
          format: date
          description: Last day of the current window, inclusive (today)
        previousStart:
          type: string
          format: date
        previousEnd:
          type: string
          format: date
        totals:
          $ref: '#/components/schemas/TrendChange'
        types:
          type: array
          description: One row per type logged in either window, biggest mover first
          items:
            $ref: '#/components/schemas/TypeTrend'
      required:
        - windowDays
        - currentStart
        - currentEnd
        - previousStart
        - previousEnd
        - totals
        - types

    StreakStatistics:
      type: object
      description: Logging streaks and per-type staleness, over the whole history of a scope
      properties:
        currentStreak:
          type: integer
          description: Consecutive logged days ending today or yesterday; 0 once the chain breaks
          example: 25
        longestStreak:
          type: integer
          example: 55
        longestStreakStart:
          type: string
          format: date
          nullable: true
        longestStreakEnd:
          type: string
          format: date
          nullable: true
        totalLoggedDays:
          type: integer
          description: Distinct days with at least one entry, ever
        lastEntryDate:
          type: string
          format: date
          nullable: true
        daysSinceLastEntry:
          type: integer
          nullable: true
        types:
          type: array
          description: One row per type ever logged, most overdue first
          items:
            $ref: '#/components/schemas/TypeCadence'
      required:
        - currentStreak
        - longestStreak
        - totalLoggedDays
        - types

    DashboardSettings:
      type: object
      properties:
        highlightTypeIds:
          type: array
          items:
            type: string
          description: |
            Activity types featured on the dashboard — a stat card each; the
            first one drives the monthly days-breakdown chart.
        hiddenTypeIds:
          type: array
          items:
            type: string
          description: Activity types excluded from count-based charts
        startDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: |
            Day the dashboard's "days together" count runs from. Null or absent
            falls back to the first logged entry. Send an empty string or null to
            clear a stored value.
          example: "2024-01-18"
      required:
        - highlightTypeIds
        - hiddenTypeIds

    MonthlyHoursData:
      type: object
      properties:
        month:
          type: string
          example: "2024-11"
        totalHours:
          type: integer
          example: 45
        activityCount:
          type: integer
          example: 12
        averageHours:
          type: number
          example: 3.75
      required:
        - month
        - totalHours
        - activityCount
        - averageHours

    MonthlyStatisticsData:
      type: object
      properties:
        month:
          type: string
          example: "11"
        year:
          type: integer
          example: 2024
        totalDays:
          type: integer
          description: Calendar days in the month
        daysWithEntries:
          type: integer
          description: Distinct days in the month with at least one entry of any type
        types:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              count:
                type: integer
              uniqueDays:
                type: integer
            required:
              - slug
              - count
              - uniqueDays
      required:
        - month
        - year
        - totalDays
        - daysWithEntries
        - types

    MonthlyActivityBreakdown:
      type: object
      properties:
        month:
          type: string
          example: "2024-11"
        activities:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: "date-night"
              name:
                type: string
                example: "Date Night"
              hours:
                type: integer
                example: 12
              count:
                type: integer
                example: 4
            required:
              - type
              - name
              - hours
              - count
        totalHours:
          type: integer
          example: 45
        totalActivities:
          type: integer
          example: 12
      required:
        - month
        - activities
        - totalHours
        - totalActivities

    WeeklyHeatmapData:
      type: object
      properties:
        year:
          type: integer
          example: 2024
        weeks:
          type: array
          items:
            type: object
            properties:
              week:
                type: integer
                example: 45
              days:
                type: array
                items:
                  type: object
                  properties:
                    day:
                      type: integer
                      minimum: 0
                      maximum: 6
                      example: 1
                    date:
                      type: string
                      format: date
                      example: "2024-11-05"
                    hours:
                      type: integer
                      example: 4
                    activities:
                      type: integer
                      example: 2
                  required:
                    - day
                    - date
                    - hours
                    - activities
            required:
              - week
              - days
      required:
        - year
        - weeks

    CumulativeTimelineData:
      type: object
      properties:
        year:
          type: integer
          example: 2024
        months:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
                example: "2024-11"
              cumulativeHours:
                type: integer
                example: 450
              cumulativeActivities:
                type: integer
                example: 150
              monthlyHours:
                type: integer
                example: 45
              monthlyActivities:
                type: integer
                example: 12
            required:
              - month
              - cumulativeHours
              - cumulativeActivities
              - monthlyHours
              - monthlyActivities
      required:
        - year
        - months

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["ok", "error"]
          example: "ok"
        service:
          type: string
          example: "relationship-service"
        type:
          type: string
          example: "backend"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"
        description:
          type: string
          example: "Social relationship management service"
        dependencies:
          type: object
          properties:
            mongodb:
              type: string
              enum: ["connected", "disconnected"]
              example: "connected"
        error:
          type: string
          nullable: true
          example: null
      required:
        - status
        - service
        - type
        - timestamp
        - version
        - description
        - dependencies

    # Response schemas
    ActivitiesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            activities:
              type: array
              items:
                $ref: '#/components/schemas/ActivityWithType'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 20
                total:
                  type: integer
                  example: 150
                totalPages:
                  type: integer
                  example: 8
              required:
                - page
                - limit
                - total
                - totalPages
          required:
            - activities
            - pagination
      required:
        - success
        - data

    ActivityResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ActivityWithType'
      required:
        - success
        - data

    ActivityTypesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            types:
              type: array
              items:
                $ref: '#/components/schemas/ActivityType'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 50
                total:
                  type: integer
                  example: 25
                totalPages:
                  type: integer
                  example: 1
              required:
                - page
                - limit
                - total
                - totalPages
          required:
            - types
            - pagination
      required:
        - success
        - data

    ActivityTypeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ActivityType'
      required:
        - success
        - data

    ActivityStatsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActivityStats'
      required:
        - success
        - data

    StatisticsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/RelationshipStatistics'
        timeframe:
          type: string
          example: "all"
        generatedAt:
          type: string
          format: date-time
      required:
        - success
        - data
        - timeframe
        - generatedAt

    TrendsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/TrendsResult'
        generatedAt:
          type: string
          format: date-time
      required:
        - success
        - data
        - generatedAt

    Milestone:
      type: object
      required: [kind, key, label, target, unit]
      properties:
        kind:
          type: string
          enum: [days-together, anniversary, type-count, total-count]
        key:
          type: string
          description: Stable across refreshes, so it can key a list
          example: "type-count:65f0c1:100"
        label:
          type: string
          example: "100 walks"
        target:
          type: number
        unit:
          type: string
          enum: [days, years, entries]
        typeId:
          type: string
        color:
          type: string
        achievedOn:
          type: string
          format: date
          description: Reached milestones only
        daysAgo:
          type: integer
          description: Reached milestones only
        remaining:
          type: integer
          description: Upcoming count milestones only; entries still to go
        expectedOn:
          type: string
          format: date
          description: Upcoming only; exact for dates, projected for counts
        daysAway:
          type: integer
        projected:
          type: boolean
          description: True when expectedOn comes from the current pace rather than a fixed date
    MilestonesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            since:
              type: string
              format: date
              nullable: true
              description: The day "together" counts from
            daysTogether:
              type: integer
              nullable: true
            recent:
              type: array
              items:
                $ref: '#/components/schemas/Milestone'
            upcoming:
              type: array
              items:
                $ref: '#/components/schemas/Milestone'
        generatedAt:
          type: string
          format: date-time
    StreakStatisticsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/StreakStatistics'
        generatedAt:
          type: string
          format: date-time
      required:
        - success
        - data
        - generatedAt

    MonthlyHoursResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyHoursData'
        generatedAt:
          type: string
          format: date-time
      required:
        - success
        - data
        - generatedAt

    MonthlyStatisticsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyStatisticsData'
        generatedAt:
          type: string
          format: date-time
      required:
        - success
        - data
        - generatedAt

    MonthlyActivityBreakdownResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyActivityBreakdown'
        generatedAt:
          type: string
          format: date-time
      required:
        - success
        - data
        - generatedAt

    WeeklyHeatmapResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WeeklyHeatmapData'
        generatedAt:
          type: string
          format: date-time
      required:
        - success
       
        - generatedAt

    CumulativeTimelineResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CumulativeTimelineData'
        generatedAt:
          type: string
          format: date-time
      required:
        - success
        - data
        - generatedAt

    RecentActivitiesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActivityWithType'
      required:
        - success
        - data

    RecentActivitiesSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: "Activity summary organized by category and timeline"
          example:
            "date-night":
              "1months":
                label: "Last Month"
                activities: []
              "3months":
                label: "Last 3 Months"
                activities: []
              "12months":
                label: "Last Year"
                activities: []
      required:
        - success
        - data

    # Request schemas
    CreateActivityRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-11-03"
        hours:
          type: integer
          minimum: 0
          example: 2
        activity:
          type: object
          properties:
            typeId:
              type: string
              example: "507f1f77bcf86cd799439011"
            description:
              type: string
              example: "Dinner at Italian restaurant"
          required:
            - typeId
        groupId:
          type: string
          example: "group456"
      required:
        - date
        - activity

    UpdateActivityRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-11-03"
        hours:
          type: integer
          minimum: 0
          example: 3
        activity:
          type: object
          properties:
            typeId:
              type: string
              example: "507f1f77bcf86cd799439011"
            description:
              type: string
              example: "Updated description"
          required:
            - typeId
        groupId:
          type: string
          example: "group456"

    CreateActivityTypeRequest:
      type: object
      properties:
        name:
          type: string
          example: "Date Night"
        slug:
          type: string
          example: "date-night"
        description:
          type: string
          example: "Romantic evening activities"
        color:
          type: string
          example: "#FF5733"
        icon:
          type: string
          example: "heart"
        groupId:
          type: string
          example: "group456"
      required:
        - name

    UpdateActivityTypeRequest:
      type: object
      properties:
        name:
          type: string
          example: "Updated Date Night"
        description:
          type: string
          example: "Updated romantic evening activities"
        color:
          type: string
          example: "#FF5733"
        icon:
          type: string
          example: "heart"
        isActive:
          type: boolean
          example: true
        sortOrder:
          type: integer
          example: 2

    ReorderActivityTypesRequest:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: "507f1f77bcf86cd799439011"
          sortOrder:
            type: integer
            example: 1
        required:
          - id
          - sortOrder

paths:
  # Health check endpoint
  /health:
    get:
      security: []
      tags:
        - Health
      summary: Health check
      description: |
        Returns the health status of the relationship service including database connectivity.
        Used for monitoring and load balancer health checks.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # Dashboard Settings Endpoints
  /api/dashboard-settings:
    get:
      tags:
        - Dashboard Settings
      summary: Get dashboard settings
      description: |
        Returns the dashboard configuration for the current scope
        (personal, or shared per group when groupId is given). Defaults to
        empty lists when nothing has been saved yet.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Dashboard settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DashboardSettings'
    put:
      tags:
        - Dashboard Settings
      summary: Save dashboard settings
      description: Upserts the dashboard configuration for the current scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DashboardSettings'
                - type: object
                  properties:
                    groupId:
                      type: string
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DashboardSettings'

  # Day (journal) Endpoints
  /api/days:
    get:
      tags:
        - Days
      summary: List days with their entries
      description: |
        Returns days (newest first) with all their entries, paginated by day.
        Each entry carries a populated `type` object for rendering.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: typeId
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive substring match on entry descriptions
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated days
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      days:
                        type: array
                        items:
                          $ref: '#/components/schemas/Day'
                      total:
                        type: integer
                      page:
                        type: integer
                      totalPages:
                        type: integer

  /api/days/{date}:
    put:
      tags:
        - Days
      summary: Create or replace a day's entries
      description: |
        The day editor's save: create/replace all entries for one date in a
        single call. An empty entries array clears the day.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-07-04"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDayRequest'
      responses:
        '200':
          description: The saved day
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Day'

  # Plan Endpoints
  /api/plans:
    get:
      tags:
        - Plans
      summary: List plans
      description: |
        Plans in a range of days, earliest first; a trip is included if any of
        its days are in the range. With upcoming=true, only the ones not yet
        logged, from startDate on.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: upcoming
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
    post:
      tags:
        - Plans
      summary: Make a plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlanInput'
                - required: [title, date]
      responses:
        '201':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Plan'

  /api/plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Plans
      summary: Read one plan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Plan'
        '404':
          description: Not found, or not in the caller's reach
    patch:
      tags:
        - Plans
      summary: Change a plan
      description: Only the fields sent change. Moving it or changing the reminder schedules the reminder again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '200':
          description: The plan
    delete:
      tags:
        - Plans
      summary: Remove a plan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted

  /api/plans/{id}/log:
    post:
      tags:
        - Plans
      summary: Log a plan as an entry
      description: |
        Makes an entry on the plan's first day, in its scope, with the title as
        the description and the place where the type takes them. Once only,
        and not before the day has come in the plan's zone.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                typeId:
                  type: string
                  description: Needed when the plan has no type
      responses:
        '200':
          description: The plan and the new entry's id
        '409':
          description: Already logged

  # Place (map) Endpoints
  /api/places:
    get:
      tags:
        - Places
      summary: List distinct places with visit counts
      description: |
        Every distinct place in the caller's scope, with how often and when it
        was visited and a per-activity-type breakdown. Powers the map page's
        pins and the day editor's "places you've been" suggestions.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
        - name: typeId
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Places, most-visited first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
        '403':
          description: Caller is not a member of the requested group

  /api/places/visits:
    get:
      tags:
        - Places
      summary: List the individual visits behind one pin
      description: |
        Visits are matched on the same rounded-coordinate bucket that
        `GET /api/places` groups by, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: groupId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Visits, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaceVisit'
        '400':
          description: lat/lng missing or not numeric
        '403':
          description: Caller is not a member of the requested group

  # Activity Management Endpoints
  /api/activities:
    post:
      tags:
        - Activities
      summary: Create a new activity
      description: |
        Creates a new relationship activity for the authenticated user.
        The activity type must be accessible to the user (personal or group-shared).
        Hours are optional and must be non-negative integers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: Activity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          description: Bad request - missing required fields or invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

    get:
      tags:
        - Activities
      summary: List activities
      description: |
        Retrieves activities for the authenticated user with optional filtering.
        Supports pagination, date range filtering, activity type filtering, and sorting.
        Only returns activities the user has access to (personal or group-shared).
      parameters:
        - name: activityType
          in: query
          schema:
            type: string
          description: Filter by activity type slug
          example: "date-night"
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Filter activities from this date (inclusive)
          example: "2024-01-01"
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Filter activities until this date (inclusive)
          example: "2024-12-31"
        - name: description
          in: query
          schema:
            type: string
          description: Filter by activity description (partial match)
          example: "dinner"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of activities per page
          example: 20
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
          example: 1
        - name: sortBy
          in: query
          schema:
            type: string
            enum: ["date", "createdAt", "hours"]
            default: "date"
          description: Field to sort by
          example: "date"
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "desc"
          description: Sort order
          example: "desc"
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID
          example: "group456"
      responses:
        '200':
          description: Activities retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/activities/descriptions:
    get:
      tags:
        - Activities
      summary: Get the descriptions already used for an activity type
      description: |
        Every distinct non-empty description logged for the type in the scope,
        sorted alphabetically ignoring case. The day editor offers them as
        suggestions, so the same thing is written the same way each time.
      parameters:
        - name: typeId
          in: query
          required: true
          schema:
            type: string
          description: Activity type ID
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID (defaults to personal entries)
      responses:
        '200':
          description: Descriptions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: string
                    example: ["Dinner at home", "Walk by the sea"]
        '400':
          description: typeId is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of that group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/activities/recent:
    get:
      tags:
        - Activities
      summary: Get recent activities
      description: |
        Retrieves the most recent activities for the authenticated user.
        Returns activities sorted by creation date (newest first).
        Only includes activities the user has access to.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Number of recent activities to retrieve
          example: 10
      responses:
        '200':
          description: Recent activities retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentActivitiesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/activities/recent-summary:
    get:
      tags:
        - Activities
      summary: Get recent activities summary
      description: |
        Retrieves a summary of recent activities organized by category and time periods.
        Groups activities by type and shows activity counts for different time ranges.
        Useful for dashboard views and activity tracking.
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID
          example: "group456"
      responses:
        '200':
          description: Recent activities summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentActivitiesSummaryResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/activities/types:
    get:
      tags:
        - Activities
      summary: Get available activity types
      description: |
        Retrieves activity types available to the authenticated user.
        Includes personal activity types and those shared within user's groups.
        Only returns active activity types.
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID (optional)
          example: "group456"
      responses:
        '200':
          description: Activity types retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityTypesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/activities/{id}:
    get:
      tags:
        - Activities
      summary: Get activity by ID
      description: |
        Retrieves a specific activity by its ID.
        User must have access to the activity (owner or group member).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Activity ID
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Activity retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

    put:
      tags:
        - Activities
      summary: Update activity
      description: |
        Updates an existing activity.
        User must be the owner of the activity.
        All fields are optional in the update request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Activity ID
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
      responses:
        '200':
          description: Activity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          description: Bad request - invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

    delete:
      tags:
        - Activities
      summary: Delete activity
      description: |
        Deletes an activity permanently.
        User must be the owner of the activity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Activity ID
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Activity deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  # Activity Type Management Endpoints
  /api/activity-types:
    post:
      tags:
        - Activity Types
      summary: Create activity type
      description: |
        Creates a new activity type for the authenticated user.
        If groupId is provided, creates a group-shared activity type.
        Otherwise, creates a personal activity type.
        Slug is auto-generated from name if not provided.
      requestBody:
        required: true
        content:
          application/json:
