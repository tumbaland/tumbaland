  # Statistics Endpoints
  /api/statistics:
    get:
      tags:
        - Statistics
      summary: Get relationship statistics
      description: |
        Retrieves comprehensive relationship statistics for the authenticated user.
        Includes activity counts, hours, breakdowns by type, and recent activity.
        Supports different timeframes for analysis.
      parameters:
        - name: timeframe
          in: query
          schema:
            type: string
            enum: ["week", "month", "quarter", "year", "all"]
            default: "all"
          description: Time period for statistics
          example: "month"
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID
          example: "group456"
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        '400':
          description: Bad request - invalid timeframe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/statistics/streaks:
    get:
      tags:
        - Statistics
      summary: Get logging streaks and per-type staleness
      description: |
        Current and longest logging streaks, plus how overdue each activity type is
        against its own typical cadence — the dashboard's "it has been a while since…"
        row. Always answered over the full history rather than a timeframe, and
        future-dated entries are excluded so a planned day cannot claim a streak.
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID (defaults to personal entries)
          example: "group456"
      responses:
        '200':
          description: Streak statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakStatisticsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/statistics/milestones:
    get:
      tags:
        - Statistics
      summary: Get milestones just reached and coming up
      description: |
        Round numbers worth celebrating: days together, anniversaries, and entry
        counts per activity type and in total. `recent` holds what was reached
        lately, most recent first; `upcoming` what is due soon, soonest first,
        projected from the current pace where it is not a fixed date.

        Reads the scope's dashboard settings, so types hidden from the dashboard
        raise no milestones, and "together" counts from the configured start
        date (or the first entry when there is none).
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID (defaults to personal entries)
          example: "group456"
      responses:
        '200':
          description: Milestones retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonesResponse'
        '403':
          description: Not a member of that group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/statistics/trends:
    get:
      tags:
        - Statistics
      summary: Compare the last N days against the N before them
      description: |
        Per activity type and overall: entries, hours and active days in the current
        window against the window immediately before it, with deltas, percent change
        and a direction. The dashboard's "picking up or fading" row, sitting between
        the backward-looking streaks and the forward-looking milestones.

        Both windows are read in one aggregation, so the two halves can never come
        from different reads of a collection being written to. Types hidden in the
        scope's dashboard settings are left out of the rows and of the totals, and
        future-dated entries are excluded so a planned day cannot read as a good week.
      parameters:
        - name: window
          in: query
          schema:
            type: integer
            minimum: 7
            maximum: 180
            default: 30
          description: Length of each of the two windows, in days
          example: 30
        - name: groupId
          in: query
          schema:
            type: string
          description: Filter by specific group ID (defaults to personal entries)
          example: "group456"
      responses:
        '200':
          description: Trends retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendsResponse'
        '400':
          description: Bad request - window outside the accepted range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

