# RabbitMQ Management UI
server {
    listen 443 ssl;
    server_name rabbitmq.tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumbaland-wildcard/privkey.pem;
    
    # RabbitMQ Management UI headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;
    
    # WebSocket support for real-time updates
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    location / {
        set $upstream http://rabbitmq:15672;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# RabbitMQ Prometheus Metrics
server {
    listen 443 ssl;
    server_name rabbitmq-metrics.tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland-wildcard/fullchain.pem;
