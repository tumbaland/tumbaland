    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    location / {
        set $upstream http://rabbitmq:15692;
        proxy_pass $upstream;
        proxy_set_header Accept "text/plain, */*";
    }
}

# Monitoring UI (Beszel)
server {
    listen 443 ssl;
    server_name beszel.tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumbaland-wildcard/privkey.pem;
    location / {
        set $upstream http://beszel-hub:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live metrics stream.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
