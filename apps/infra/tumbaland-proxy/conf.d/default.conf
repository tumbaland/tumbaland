server {
    listen 80;
    server_name tumbaland.eu *.tumbaland.eu;
    return 301 https://$host$request_uri;
}

# Main shell/front
server {
    listen 443 ssl;
    server_name tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumbaland.eu/privkey.pem;
    location / {
        proxy_pass http://shell-front:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

