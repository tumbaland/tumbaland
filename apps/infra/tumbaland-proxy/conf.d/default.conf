server {
    listen 80;
    server_name tumbaland.eu *.tumbaland.eu;

    # Allow ACME HTTP-01 challenges for ALL subdomains without swapping configs.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Health check endpoint for Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Everything else gets redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# DNS resolver for Docker networks with short TTL to prevent stale cache
resolver 127.0.0.11 valid=10s ipv6=off;

# Upstream definitions for better service management
upstream public-service {
    server public-service:5003 max_fails=3 fail_timeout=30s;
}

