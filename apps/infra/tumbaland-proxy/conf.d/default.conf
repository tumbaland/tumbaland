# MinIO API
server {
    listen 443 ssl;
    server_name minio-api.tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumbaland-wildcard/privkey.pem;
    
    # Allow larger file uploads for MinIO
    client_max_body_size 100M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    
    # MinIO specific headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;
    
    # Disable buffering for file uploads/downloads
    proxy_buffering off;
    proxy_request_buffering off;
    
    location / {
        proxy_pass http://minio;
    }
}

