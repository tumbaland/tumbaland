server {
    listen 80;
    server_name tumbaland.eu *.tumbaland.eu;

    # Allow ACME HTTP-01 challenges for ALL subdomains without swapping configs.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Health check endpoint for Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Everything else gets redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# DNS resolver for Docker networks with short TTL to prevent stale cache
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade support. Needed by Beszel, which streams live metrics over a
# WebSocket; plain proxying drops the connection on every page load.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Backends are addressed directly rather than through `upstream` blocks. In OSS
# nginx, names inside an `upstream` are resolved once at startup and cached for
# the life of the worker, and the `resolver` above does not apply to them. A
# redeployed container gets a new address on tumbanet and the proxy keeps
# dialling the old one until it is restarted -- which is how visin's APIs served
# 502 after a deploy while its untouched frontends stayed up. Putting the target
# in a variable forces per-request resolution, so `resolver ... valid=10s` above
# takes effect and a redeploy is picked up within ten seconds.
#
# The trade-off is that `max_fails` / `fail_timeout` are upstream-only settings
# and are lost. They bought little here: every upstream held exactly one server,
# so there was nothing to fail over to.

# Main shell/front
server {
    listen 443 ssl;
    server_name tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumbaland-wildcard/privkey.pem;
    location / {
        set $upstream http://shell-front:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

