server {
    listen 80;
    server_name tumbaland.eu *.tumbaland.eu;

    # Allow ACME HTTP-01 challenges for ALL subdomains without swapping configs.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Everything else gets redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main shell/front
server {
    listen 443 ssl;
    server_name tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumbaland-wildcard/privkey.pem;
    location / {
        proxy_pass http://shell-front:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

