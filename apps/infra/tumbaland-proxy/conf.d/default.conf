# File
server {
    listen 443 ssl;
    server_name file-service.tumbaland.eu;
    ssl_certificate /etc/letsencrypt/live/tumbaland-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tumbaland-wildcard/privkey.pem;
    
    # Allow larger file uploads for file storage
    client_max_body_size 50M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    # Service-to-service only; never reachable from the public internet.
    location ~ ^/(api/)?internal/ {
        deny all;
    }

    location / {
        set $upstream http://file-service:5002;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

