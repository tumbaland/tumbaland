services:
  tumbaland-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/tumbaland-proxy:latest
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./certs/live:/etc/letsencrypt/live
      - ./certs/archive:/etc/letsencrypt/archive
      - ./certs/renewal:/etc/letsencrypt/renewal
      - ./html:/usr/share/nginx/html
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
