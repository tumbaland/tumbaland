services:
  tumbaland-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/tumbaland-proxy:latest
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./certs/live:/etc/letsencrypt/live
      - ./certs/archive:/etc/letsencrypt/archive
      - ./certs/renewal:/etc/letsencrypt/renewal
      - ./html:/usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
