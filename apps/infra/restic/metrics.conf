server {
    listen 80;
    server_name localhost;

    location /metrics {
        default_type text/plain;
        content_by_lua_block {
            local handle = io.popen("/scripts/metrics.sh")
            local result = handle:read("*a")
            handle:close()
            ngx.say(result)
        }
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}