global
    log stdout format raw local0 info
    log stdout format raw local0 notice
    log stdout format raw local0 warning
    log stdout format raw local0 err

    # Performance tuning
    maxconn 4096
    nbproc 1
    nbthread 4
    cpu-map auto:1/1-4 0-3

    # SSL settings
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

    # User and group
    user haproxy
    group haproxy

    # Process management
    stats socket /var/run/haproxy.sock mode 600 level admin
    stats timeout 30s

    # Lua scripting (for advanced features)
    lua-load /usr/local/etc/haproxy/lua/check.lua

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close

    # Timeouts
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 10s

    # Error files
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# Statistics interface
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats show-legends
    stats show-node
    no log

# Frontend for HTTP traffic
frontend http_front
    bind *:80
    mode http

    # Force HTTPS redirect
    redirect scheme https code 301 if !{ ssl_fc }

    # Allow ACME HTTP-01 challenges for certificate renewal
    acl is_acme_challenge path_beg /.well-known/acme-challenge/
    use_backend acme_backend if is_acme_challenge

# Frontend for HTTPS traffic
frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/ssl/
    mode http

    # SSL settings
    ssl-min-ver TLSv1.2
    ssl-max-ver TLSv1.3
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

    # Copy all routing rules from http_front here
    # Rate limiting (basic connection rate)
    tcp-request connection reject if { src_conn_rate ge 100 }
    tcp-request connection track-sc1 src table conn_rate
    tcp-request connection reject if { sc1_conn_rate ge 10 }

    # Request size limiting
    http-request deny if { req.body_size gt 52428800 }  # 50MB limit

    # Security headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    # CORS headers for API routes
    acl is_api hdr(host) -i api.tumbaland.eu album-api.tumbaland.eu auth-api.tumbaland.eu
    http-response set-header Access-Control-Allow-Origin "*" if is_api
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" if is_api
    http-response set-header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" if is_api

    # Route to backends based on host and path
    acl host_album hdr(host) -i album.tumbaland.eu
    acl host_album_api hdr(host) -i album-api.tumbaland.eu
    acl host_auth hdr(host) -i auth.tumbaland.eu
    acl host_auth_api hdr(host) -i auth-api.tumbaland.eu
    acl host_file_api hdr(host) -i file-api.tumbaland.eu
    acl host_finance hdr(host) -i finance.tumbaland.eu
    acl host_finance_api hdr(host) -i finance-api.tumbaland.eu
    acl host_group hdr(host) -i group.tumbaland.eu
    acl host_group_api hdr(host) -i group-api.tumbaland.eu
    acl host_payment hdr(host) -i payment.tumbaland.eu
    acl host_payment_api hdr(host) -i payment-api.tumbaland.eu
    acl host_relationship hdr(host) -i relationship.tumbaland.eu
    acl host_relationship_api hdr(host) -i relationship-api.tumbaland.eu
    acl host_public_api hdr(host) -i api.tumbaland.eu
    acl host_segmentation_api hdr(host) -i segmentation-api.tumbaland.eu
    acl host_object_detection_api hdr(host) -i object-detection-api.tumbaland.eu

    # API routes
    acl path_albums path_beg /api/albums
    acl path_auth path_beg /api/auth
    acl path_files path_beg /api/files
    acl path_finance path_beg /api/finance
    acl path_groups path_beg /api/groups
    acl path_payments path_beg /api/payments
    acl path_relationships path_beg /api/relationships
    acl path_public path_beg /api/public
    acl path_segmentation path_beg /api/segmentation
    acl path_object_detection path_beg /api/object-detection

    # Route to appropriate backends
    use_backend album_front_backend if host_album
    use_backend album_api_backend if host_album_api || (host_album path_albums)
    use_backend auth_front_backend if host_auth
    use_backend auth_api_backend if host_auth_api || (host_auth path_auth)
    use_backend file_api_backend if host_file_api || (host_file_api path_files)
    use_backend finance_front_backend if host_finance
    use_backend finance_api_backend if host_finance_api || (host_finance path_finance)
    use_backend group_front_backend if host_group
    use_backend group_api_backend if host_group_api || (host_group path_groups)
    use_backend payment_front_backend if host_payment
    use_backend payment_api_backend if host_payment_api || (host_payment path_payments)
    use_backend relationship_front_backend if host_relationship
    use_backend relationship_api_backend if host_relationship_api || (host_relationship path_relationships)
    use_backend public_api_backend if host_public_api || path_public
    use_backend segmentation_api_backend if host_segmentation_api || path_segmentation
    use_backend object_detection_api_backend if host_object_detection_api || path_object_detection

    # Default backend
    default_backend default_backend

# Backend definitions
backend album_front_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server album-front album-front:80 check inter 10s fall 3 rise 2

backend album_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server album-service album-service:4002 check inter 10s fall 3 rise 2

backend auth_front_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server auth-front auth-front:80 check inter 10s fall 3 rise 2

backend auth_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server auth-service auth-service:5001 check inter 10s fall 3 rise 2

backend file_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # Allow large file uploads
    timeout server 300s
    timeout connect 10s
    server file-service file-service:5002 check inter 10s fall 3 rise 2

backend finance_front_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server finance-front finance-front:80 check inter 10s fall 3 rise 2

backend finance_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server finance-service finance-service:4003 check inter 10s fall 3 rise 2

backend group_front_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server group-front group-front:80 check inter 10s fall 3 rise 2

backend group_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server group-service group-service:5006 check inter 10s fall 3 rise 2

backend payment_front_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server payment-front payment-front:80 check inter 10s fall 3 rise 2

backend payment_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server payment-service payment-service:5005 check inter 10s fall 3 rise 2

backend relationship_front_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server relationship-front relationship-front:80 check inter 10s fall 3 rise 2

backend relationship_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server relationship-service relationship-service:4001 check inter 10s fall 3 rise 2

backend public_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server public-service public-service:5003 check inter 10s fall 3 rise 2

backend segmentation_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # Allow large file uploads for image processing
    timeout server 300s
    timeout connect 10s
    server segmentation-service segmentation-service:8001 check inter 10s fall 3 rise 2

backend object_detection_api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # Allow large file uploads for image processing
    timeout server 300s
    timeout connect 10s
    server object-detection-service object-detection-service:8002 check inter 10s fall 3 rise 2

backend default_backend
    mode http
    balance roundrobin
    # Return 404 for unmatched routes
    http-response status 404 content-type text/plain string "Service not found"

# Rate limiting tables
backend conn_rate
    mode http
    stick-table type ip size 100k expire 10m store conn_rate(10s)

# Health check backend for monitoring
backend health_check
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server haproxy-check 127.0.0.1:8404 check inter 5s

# ACME challenge backend for certificate renewal
backend acme_backend
    mode http
    balance roundrobin
    server certbot 127.0.0.1:8080