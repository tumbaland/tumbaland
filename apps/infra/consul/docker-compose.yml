services:
  consul-server:
    image: hashicorp/consul:latest
    container_name: tumbaland-consul-server
    restart: unless-stopped
    ports:
      - "8500:8500"   # HTTP API
      - "8600:8600"   # DNS
      - "8600:8600/udp"  # DNS UDP
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_CLIENT_INTERFACE=eth0
      - CONSUL_HTTP_ADDR=0.0.0.0:8500
      - CONSUL_DATACENTER=tumbaland-dc
      - CONSUL_ENCRYPT=${CONSUL_ENCRYPT_KEY}
      - CONSUL_ACL_MASTER_TOKEN=${CONSUL_ACL_MASTER_TOKEN}
      - CONSUL_ADVERTISE_ADDR=consul-server
      - CONSUL_LEAVE_ON_TERMINATE=true
    volumes:
      - ./server.json:/consul/config/server.json:ro
      - ./data:/consul/data
    command: consul agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data -config-file=/consul/config/server.json
    networks:
      - tumbanet
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  consul-client:
    image: hashicorp/consul:latest
    container_name: tumbaland-consul-client
    restart: unless-stopped
    depends_on:
      - consul-server
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_CLIENT_INTERFACE=eth0
      - CONSUL_DATACENTER=tumbaland-dc
      - CONSUL_ENCRYPT=${CONSUL_ENCRYPT_KEY}
      - CONSUL_RETRY_JOIN=consul-server
      - CONSUL_LEAVE_ON_TERMINATE=true
    volumes:
      - ./client.json:/consul/config/client.json:ro
      - ./client-data:/consul/data
    command: consul agent -join=consul-server -data-dir=/consul/data -config-file=/consul/config/client.json
    networks:
      - tumbanet
    # This client runs without exposing ports, used for service registration

  service-registrator:
    image: curlimages/curl:latest
    container_name: tumbaland-service-registrator
    restart: "no"  # Run once and exit
    depends_on:
      - consul-server
    volumes:
      - ./services:/services:ro
      - ./register-services.sh:/register-services.sh:ro
    command: >
      /bin/bash -c "
      sleep 30;
      echo '🔍 Starting service registration...';
      if [ -n \"$CONSUL_ACL_TOKEN\" ]; then
        echo 'ACL Token found, registering test service...';
        curl -s -X PUT -H \"X-Consul-Token: $CONSUL_ACL_TOKEN\" -d '{\"service\":{\"name\":\"test-service\",\"port\":8080}}' http://consul-server:8500/v1/agent/service/register;
        echo '✅ Registration complete';
      else
        echo '❌ No ACL token set';
      fi
      "
    networks:
      - tumbanet
    environment:
      - CONSUL_HTTP_ADDR=http://consul-server:8500
      - CONSUL_ACL_TOKEN=${CONSUL_ACL_MASTER_TOKEN}

networks:
  tumbanet:
    external: true