# Redis configuration for Tumbaland
# This file is mounted into the Redis container

# Network
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 300

# Security
# requirepass is set via environment variable

# Memory management
# maxmemory and maxmemory-policy set via environment variables

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

# Logging
loglevel notice
logfile ""

# Disable dangerous commands
# Commands disabled via environment variable

# Performance
tcp-backlog 511
databases 16

# Connection settings
maxclients 10000

# Append only file
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Advanced settings
activerehashing yes
hz 10