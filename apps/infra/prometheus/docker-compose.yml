services:
  prometheus:
    image: prom/prometheus:latest
    container_name: tumbaland-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alertmanager/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./data:/prometheus
    environment:
      - PROMETHEUS_CONFIG_FILE=/etc/prometheus/prometheus.yml
      - PROMETHEUS_STORAGE_PATH=/prometheus
      - PROMETHEUS_WEB_CONSOLE_LIBRARIES_PATH=/etc/prometheus/console_libraries
      - PROMETHEUS_WEB_CONSOLE_TEMPLATES_PATH=/etc/prometheus/consoles
      - PROMETHEUS_RETENTION_TIME=200h
      - PROMETHEUS_WEB_ENABLE_LIFECYCLE=true
      - PROMETHEUS_ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    command:
      - '--config.file=${PROMETHEUS_CONFIG_FILE}'
      - '--storage.tsdb.path=${PROMETHEUS_STORAGE_PATH}'
      - '--web.console.libraries=${PROMETHEUS_WEB_CONSOLE_LIBRARIES_PATH}'
      - '--web.console.templates=${PROMETHEUS_WEB_CONSOLE_TEMPLATES_PATH}'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}'
      - '--web.enable-lifecycle=${PROMETHEUS_WEB_ENABLE_LIFECYCLE}'
    networks:
      - tumbanet
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: tumbaland-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - tumbanet
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.1'
        reservations:
          memory: 64m
          cpus: '0.05'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: tumbaland-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - tumbanet
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'

  alertmanager:
    image: prom/alertmanager:latest
    container_name: tumbaland-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../alertmanager/data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    networks:
      - tumbanet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.1'
        reservations:
          memory: 64m
          cpus: '0.05'

networks:
  tumbanet:
    external: true