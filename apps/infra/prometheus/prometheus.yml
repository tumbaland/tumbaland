global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: '/_prometheus/metrics'
    basic_auth:
      username: elastic
      password: ${PROMETHEUS_ELASTIC_PASSWORD}

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/api/metrics'

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:9216']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Tumbaland Services
  - job_name: 'album-service'
    static_configs:
      - targets: ['album-service:4002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:5001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'finance-service'
    static_configs:
      - targets: ['finance-service:4003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'admin-service'
    static_configs:
      - targets: ['admin-service:5008']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'group-service'
    static_configs:
      - targets: ['group-service:5006']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:5005']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'relationship-service'
    static_configs:
      - targets: ['relationship-service:4001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'public-service'
    static_configs:
      - targets: ['public-service:5003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Backup Monitoring
  - job_name: 'backup-metrics'
    static_configs:
      - targets: ['backup-metrics:80']
    metrics_path: '/metrics'
    scrape_interval: 30s