version: "3.9"

services:
  cron:
    image: alpine:3.18
    restart: unless-stopped
    environment:
      - CLOUDFLARE_ZONE_ID
      - CLOUDFLARE_API_TOKEN
      - CHECK_INTERVAL=60
    volumes:
      - ./update_dns.sh:/app/update_dns.sh:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    command: sh -c "apk add --no-cache curl bash && /app/entrypoint.sh"
