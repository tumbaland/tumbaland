# Logstash Pipeline Configuration for Tumbaland
# This pipeline processes logs from various sources

input {
  # Beats input (Filebeat)
  beats {
    port => 5044
    ssl => false
  }

  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
    type => "tumbaland-app"
  }

  # HTTP input for application logs
  http {
    port => 8080
    codec => json
    type => "tumbaland-http"
  }
}

filter {
  # Add timestamp if not present
  if ![timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Parse JSON messages from structured logging
  if [message] and [message] =~ /^\\{/ {
    json {
      source => "message"
      remove_field => ["message"]
    }
  }

  # Extract service information from Docker metadata
  if [docker] {
    mutate {
      add_field => { "service" => "%{[docker][container_labels][com.docker.compose.service]}" }
      add_field => { "environment" => "%{[docker][container_labels][com.docker.compose.project]}" }
    }
  }

  # Extract service information from log patterns
  if [source] =~ /album-service/ {
    mutate {
      add_field => { "service" => "album-service" }
      add_field => { "component" => "api" }
    }
  } else if [source] =~ /auth-service/ {
    mutate {
      add_field => { "service" => "auth-service" }
      add_field => { "component" => "authentication" }
    }
  } else if [source] =~ /file-service/ {
    mutate {
      add_field => { "service" => "file-service" }
      add_field => { "component" => "storage" }
    }
  } else if [source] =~ /finance-service/ {
    mutate {
      add_field => { "service" => "finance-service" }
      add_field => { "component" => "finance" }
    }
  } else if [source] =~ /group-service/ {
    mutate {
      add_field => { "service" => "group-service" }
      add_field => { "component" => "groups" }
    }
  } else if [source] =~ /payment-service/ {
    mutate {
      add_field => { "service" => "payment-service" }
      add_field => { "component" => "payments" }
    }
  } else if [source] =~ /relationship-service/ {
    mutate {
      add_field => { "service" => "relationship-service" }
      add_field => { "component" => "relationships" }
    }
  } else if [source] =~ /public-service/ {
    mutate {
      add_field => { "service" => "public-service" }
      add_field => { "component" => "public-api" }
    }
  }

  # Handle frontend logs from HTTP input
  if [type] == "tumbaland-http" {
    mutate {
      add_field => { "component" => "frontend" }
    }
    # Frontend logs already have service field set
  }

  # Handle frontend logs forwarded through public-service (via Filebeat)
  if [forwarded_by] == "public-service" or [source_type] == "frontend_request" or [ingestion_method] == "api_endpoint" {
    mutate {
      add_field => { "component" => "frontend" }
      add_field => { "log_source" => "api_forwarded" }
    }
  }

  # Parse log levels from Winston structured logs
  if [level] {
    mutate {
      lowercase => ["level"]
    }
  } else {
    grok {
      match => { "message" => "%{LOGLEVEL:level} %{GREEDYDATA:message}" }
      patterns_dir => ["/usr/share/logstash/patterns"]
      overwrite => ["message"]
    }
  }

  # Extract correlation ID for request tracing
  grok {
    match => { "message" => "correlationId=%{UUID:correlationId}" }
  }

  # GeoIP information for client requests
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # User agent parsing
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "useragent"
    }
  }

  # HTTP request parsing
  if [request] {
    grok {
      match => {
        "request" => "%{WORD:http_method} %{URIPATHPARAM:request_path} %{WORD:http_version}"
      }
    }
  }

  # Performance metrics
  if [response_time] {
    mutate {
      convert => { "response_time" => "float" }
    }
  }

  # Error detection and tagging
  if [level] =~ /(error|fatal|critical)/ {
    mutate {
      add_tag => ["error"]
    }
  }

  # Security events
  if [message] =~ /(login|logout|authentication|authorization)/i {
    mutate {
      add_tag => ["security"]
    }
  }

  # Performance monitoring - slow requests
  if [response_time] and [response_time] > 5000 {
    mutate {
      add_tag => ["slow_request"]
    }
  }

  # Database operation tagging
  if [message] =~ /(mongodb|mongoose|database)/i {
    mutate {
      add_tag => ["database"]
    }
  }

  # API operation tagging
  if [message] =~ /(api|endpoint|route)/i {
    mutate {
      add_tag => ["api"]
    }
  }

  # Clean up unnecessary fields
  mutate {
    remove_field => ["@version", "host", "agent", "docker", "beat", "input", "ecs", "log"]
  }
}

output {
  # Main output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "tumbaland-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELK_ELASTIC_PASSWORD:-elastic_password_123}"
    document_type => "_doc"

    # Index lifecycle management
    ilm_enabled => false

    # Retry configuration
    retry_on_conflict => 3
    retry_on_failure => true
  }

  # Error logs to separate index for better querying
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "tumbaland-errors-%{+YYYY.MM.dd}"
      user => "elastic"
      password => "${ELK_ELASTIC_PASSWORD:-elastic_password_123}"
      document_type => "_doc"
    }
  }

  # Security events to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "tumbaland-security-%{+YYYY.MM.dd}"
      user => "elastic"
      password => "${ELK_ELASTIC_PASSWORD:-elastic_password_123}"
      document_type => "_doc"
    }
  }

  # Debug output (remove in production)
  if [type] == "debug" {
    stdout {
      codec => rubydebug
    }
  }
}