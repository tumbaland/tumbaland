metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# Disable D-Bus usage
metricbeat.modules:
- module: system
  metricsets:
    - cpu
    - load
    - memory
    - network
    - process
    - process_summary
    # - socket_summary  # Disabled - may require D-Bus
    - entropy
    - core
    - diskio
    # - socket  # Disabled - may require D-Bus
    # - users  # Disabled - requires D-Bus
  enabled: true
  period: 10s
  processes: ['.*']
  # Disable service metricset that requires D-Bus
  # - service
  period: 10s
  processes: ['.*']
  cpu.metrics: [percentages, normalized_percentages]
  # Disable D-Bus for system module
  hostfs: /hostfs

- module: docker
  metricsets:
    - container
    - cpu
    - diskio
    - healthcheck
    - info
    - memory
    - network
  hosts: ["unix:///var/run/docker.sock"]
  period: 10s
  enabled: true

processors:
- add_host_metadata: ~
- add_cloud_metadata: ~
- add_docker_metadata: ~

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"

# setup.kibana:
#   host: "kibana:5601"

# setup.dashboards.enabled: true
setup.ilm.enabled: false

logging.level: info
logging.to_files: true
logging.files:
  path: /usr/share/metricbeat/logs
  name: metricbeat
  keepfiles: 7
  permissions: 0644