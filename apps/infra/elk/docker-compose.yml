# ELK Stack Docker Compose Configuration
#
# IMPORTANT SETUP NOTES:
# 1. Create the required users in Elasticsearch before starting the stack:
#    - kibanaland (for Kibana internal auth): roles: ["kibana_system"]
#    - kibana_admin (for web UI access): roles: ["kibana_admin", "monitoring_user"]
#
# 2. Authentication in Elasticsearch 8.x:
#    - Kibana CANNOT use the "elastic" superuser account
#    - Use dedicated users with appropriate roles
#    - Beats can use the elastic user safely
#
# 3. Environment Variables Required (.env file):
#    - ELASTIC_PASSWORD: Password for the elastic user
#    - KIBANA_SYSTEM_PASSWORD: Password for kibana_system_user
#
# 4. ARM64/Raspberry Pi Notes:
#    - BEAT_DISABLE_DBUS=true prevents D-Bus connectivity issues
#    - Ensure sufficient memory allocation
#
# Web UI Access:
# - Kibana: http://localhost:5601 (login with kibana_admin credentials)
# - Elasticsearch: http://localhost:9200 (API access only)

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: tumbaland-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.monitoring.templates.enabled=true
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - path.data=/usr/share/elasticsearch/data
      - path.logs=/usr/share/elasticsearch/logs
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/logs:/usr/share/elasticsearch/logs
    networks:
      - tumbanet
    healthcheck:
      # Health check must authenticate with elastic user since security is enabled
      test: ["CMD-SHELL", "curl -f -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 512m
          cpus: '0.5'

  logstash:
    image: logstash:8.11.0
    container_name: tumbaland-logstash
    restart: unless-stopped
    ports:
      - "5044:5044"  # Beats input
      - "5000:5000"  # TCP input
      - "8080:8080"  # HTTP input for frontend logs
      - "9600:9600"  # Monitoring API
    environment:
      - LS_JAVA_OPTS=-Xmx256m -Xms256m
    volumes:
      - ./logstash/config:/usr/share/logstash/config
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/logs:/usr/share/logstash/logs
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tumbanet
    command: logstash -f /usr/share/logstash/pipeline/
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

  kibana:
    image: kibana:8.11.0
    container_name: tumbaland-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      # Elasticsearch connection
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=tumbaland-kibana
      - SERVER_HOST=0.0.0.0

      # IMPORTANT: In Elasticsearch 8.x, Kibana CANNOT use the "elastic" superuser account
      # for authentication. Use a dedicated user with kibana_system role instead.
      # The elastic user should only be used by Beats and other services, not Kibana.
      - ELASTICSEARCH_USERNAME=kibanaland
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}

      - XPACK_SECURITY_ENABLED=true
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tumbanet
    healthcheck:
      # Health check uses anonymous access to /api/status endpoint
      # Kibana's internal authentication to Elasticsearch is separate from web UI authentication
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

  filebeat:
    image: elastic/filebeat:8.11.0
    container_name: tumbaland-filebeat
    restart: unless-stopped
    user: root  # Required for accessing Docker socket and container logs
    command: ["filebeat", "-e", "--strict.perms=false"]  # Disable strict permissions for containerized deployment
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./filebeat/data:/usr/share/filebeat/data
    environment:
      # Beats can safely use the elastic user for authentication
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - output.elasticsearch.username=elastic
      - output.elasticsearch.password=${ELASTIC_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tumbanet
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'

  metricbeat:
    image: elastic/metricbeat:8.11.0
    container_name: tumbaland-metricbeat
    restart: unless-stopped
    user: root
    command: ["metricbeat", "-e", "--strict.perms=false"]
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./metricbeat/data:/usr/share/metricbeat/data
    environment:
      # Disable D-Bus dependent metricsets for ARM64/Raspberry Pi compatibility
      - BEAT_DISABLE_DBUS=true
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - output.elasticsearch.username=elastic
      - output.elasticsearch.password=${ELASTIC_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tumbanet
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'

  heartbeat:
    image: elastic/heartbeat:8.11.0
    container_name: tumbaland-heartbeat
    restart: unless-stopped
    user: root
    command: ["heartbeat", "-e", "--strict.perms=false"]
    volumes:
      - ./heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
      - ./heartbeat/data:/usr/share/heartbeat/data
    environment:
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - output.elasticsearch.username=elastic
      - output.elasticsearch.password=${ELASTIC_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - tumbanet
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'

networks:
  tumbanet:
    external: true
