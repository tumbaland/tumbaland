version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: tumbaland-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=true
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms${ELK_ES_MEMORY:-512m} -Xmx${ELK_ES_MEMORY:-512m}"
      - ELASTIC_PASSWORD=${ELK_ELASTIC_PASSWORD:-elastic_password_123}
      - path.data=/usr/share/elasticsearch/data
      - path.logs=/usr/share/elasticsearch/logs
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/logs:/usr/share/elasticsearch/logs
    networks:
      - tumbaland-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  logstash:
    image: logstash:8.11.0
    container_name: tumbaland-logstash
    restart: unless-stopped
    ports:
      - "5044:5044"  # Beats input
      - "5000:5000"  # TCP input
      - "9600:9600"  # Monitoring API
    environment:
      - LS_JAVA_OPTS=-Xmx${ELK_LS_MEMORY:-256m} -Xms${ELK_LS_MEMORY:-256m}
    volumes:
      - ./logstash/config:/usr/share/logstash/config
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/logs:/usr/share/logstash/logs
    depends_on:
      - elasticsearch
    networks:
      - tumbaland-network
    command: logstash -f /usr/share/logstash/pipeline/

  kibana:
    image: kibana:8.11.0
    container_name: tumbaland-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=tumbaland-kibana
      - SERVER_HOST=0.0.0.0
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELK_ELASTIC_PASSWORD:-elastic_password_123}
      - XPACK_SECURITY_ENABLED=false
      - XPACK_MONITORING_ENABLED=true
    depends_on:
      - elasticsearch
    networks:
      - tumbaland-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  filebeat:
    image: elastic/filebeat:8.11.0
    container_name: tumbaland-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./filebeat/data:/usr/share/filebeat/data
    environment:
      - setup.kibana.host=kibana:5601
      - setup.ilm.enabled=false
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - output.elasticsearch.username=elastic
      - output.elasticsearch.password=${ELK_ELASTIC_PASSWORD:-elastic_password_123}
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - tumbaland-network

  metricbeat:
    image: elastic/metricbeat:8.11.0
    container_name: tumbaland-metricbeat
    restart: unless-stopped
    user: root
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./metricbeat/data:/usr/share/metricbeat/data
    environment:
      - setup.kibana.host=kibana:5601
      - setup.dashboards.enabled=true
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - output.elasticsearch.username=elastic
      - output.elasticsearch.password=${ELK_ELASTIC_PASSWORD:-elastic_password_123}
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - tumbaland-network

  heartbeat:
    image: elastic/heartbeat:8.11.0
    container_name: tumbaland-heartbeat
    restart: unless-stopped
    user: root
    volumes:
      - ./heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
      - ./heartbeat/data:/usr/share/heartbeat/data
    environment:
      - setup.kibana.host=kibana:5601
      - setup.dashboards.enabled=true
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - output.elasticsearch.username=elastic
      - output.elasticsearch.password=${ELK_ELASTIC_PASSWORD:-elastic_password_123}
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - tumbaland-network