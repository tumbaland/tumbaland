version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: tumbaland-minio
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console (Web UI)
    environment:
      # Root credentials
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tumbaland_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secure_password_123}

      # Server configuration
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}

      # Domain configuration (for production)
      # MINIO_DOMAIN: ${MINIO_DOMAIN}
    volumes:
      # Data volumes - mount external drives here for production
      - ./data:/data

      # Optional: SSL certificates
      # - ./certs:/etc/minio/certs
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tumbaland-network

  # Optional: MinIO Client container for administration
  minio-client:
    image: minio/mc:latest
    container_name: tumbaland-minio-client
    depends_on:
      - minio
    environment:
      MC_HOST_tumbaland: http://${MINIO_ROOT_USER:-tumbaland_admin}:${MINIO_ROOT_PASSWORD:-secure_password_123}@minio:9000
    volumes:
      - ./scripts:/scripts
    command: >
      sh -c "
        echo 'Waiting for MinIO to be ready...';
        sleep 10;
        echo 'Setting up MinIO...';
        mc alias set tumbaland http://minio:9000 ${MINIO_ROOT_USER:-tumbaland_admin} ${MINIO_ROOT_PASSWORD:-secure_password_123};
        echo 'Creating buckets...';
        mc mb tumbaland/photos --ignore-existing;
        mc mb tumbaland/thumbnails --ignore-existing;
        mc mb tumbaland/temp --ignore-existing;
        echo 'Setting bucket policies...';
        mc policy set public tumbaland/thumbnails;
        echo 'MinIO setup complete!';
        tail -f /dev/null
      "
    networks:
      - tumbaland-network

networks:
  tumbaland-network:
    driver: bridge
    name: tumbaland-network