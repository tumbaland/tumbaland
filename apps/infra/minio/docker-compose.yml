services:
  minio:
    image: minio/minio:latest
    container_name: tumbaland_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: tumbaland_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: eu-east-1
      MINIO_BROWSER: "on"
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
    volumes:
      - ./data:/data
    command: server /data
    networks:
      - tumbanet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: tumbaland_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: tumbaland_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ALBUM_SERVICE_PASSWORD: ${MINIO_ALBUM_SERVICE_PASSWORD}
    volumes:
      - ./init:/init
      - ./entrypoint.sh:/entrypoint.sh
    entrypoint: ["./entrypoint.sh"]
    networks:
      - tumbanet
    restart: "no"

networks:
  tumbanet:
    external: true
