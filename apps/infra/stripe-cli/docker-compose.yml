services:
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe-cli
    restart: unless-stopped
    env_file:
      - .env.stripe
    command: listen --forward-to ${FORWARD_TO:-host.docker.internal:5005}/api/stripe/webhook
    networks:
      - tumbanet
    # Optional: mount a volume to persist login/session (not needed if using API key)
    volumes:
      - stripe-cli-config:/root/.config/stripe

networks:
  tumbanet:
    external: true

volumes:
  stripe-cli-config:
    driver: local
