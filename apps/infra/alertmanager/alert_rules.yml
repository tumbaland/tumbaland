groups:
  - name: tumbaland.rules
    rules:

    # Infrastructure Alerts
    - alert: NodeDown
      expr: up{job="node-exporter"} == 0
      for: 5m
      labels:
        severity: critical
        service: infrastructure
        component: node
      annotations:
        summary: "Node {{ $labels.instance }} is down"
        description: "Node {{ $labels.instance }} has been down for more than 5 minutes."

    - alert: NodeHighCPU
      expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
      for: 5m
      labels:
        severity: warning
        service: infrastructure
        component: cpu
      annotations:
        summary: "High CPU usage on {{ $labels.instance }}"
        description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

    - alert: NodeHighMemory
      expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
      for: 5m
      labels:
        severity: warning
        service: infrastructure
        component: memory
      annotations:
        summary: "High memory usage on {{ $labels.instance }}"
        description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

    - alert: NodeLowDiskSpace
      expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
      for: 5m
      labels:
        severity: critical
        service: infrastructure
        component: disk
      annotations:
        summary: "Low disk space on {{ $labels.instance }}"
        description: "Disk space is below 10% on {{ $labels.instance }} mountpoint {{ $labels.mountpoint }}"

    # Docker/Container Alerts
    - alert: ContainerDown
      expr: absent(container_last_seen{job="cadvisor"})
      for: 1m
      labels:
        severity: critical
        service: infrastructure
        component: container
      annotations:
        summary: "Container {{ $labels.name }} is down"
        description: "Container {{ $labels.name }} has stopped running"

    - alert: ContainerHighCPU
      expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
        service: infrastructure
        component: container
      annotations:
        summary: "High CPU usage in container {{ $labels.name }}"
        description: "Container {{ $labels.name }} is using {{ $value }} CPU cores"

    - alert: ContainerHighMemory
      expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
      for: 5m
      labels:
        severity: warning
        service: infrastructure
        component: container
      annotations:
        summary: "High memory usage in container {{ $labels.name }}"
        description: "Container {{ $labels.name }} is using {{ $value }}% of its memory limit"

    # Database Alerts
    - alert: MongoDBDown
      expr: mongodb_up == 0
      for: 1m
      labels:
        severity: critical
        service: database
        database: mongodb
      annotations:
        summary: "MongoDB is down"
        description: "MongoDB instance is not responding"

    - alert: MongoDBHighConnections
      expr: mongodb_connections_current > 1000
      for: 5m
      labels:
        severity: warning
        service: database
        database: mongodb
      annotations:
        summary: "High MongoDB connections"
        description: "MongoDB has {{ $value }} active connections"

    - alert: RedisDown
      expr: redis_up == 0
      for: 1m
      labels:
        severity: critical
        service: database
        database: redis
      annotations:
        summary: "Redis is down"
        description: "Redis instance is not responding"

    - alert: RedisHighMemory
      expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
      for: 5m
      labels:
        severity: warning
        service: database
        database: redis
      annotations:
        summary: "High Redis memory usage"
        description: "Redis is using {{ $value }}% of available memory"

    # Message Queue Alerts
    - alert: RabbitMQDown
      expr: rabbitmq_up == 0
      for: 1m
      labels:
        severity: critical
        service: messaging
      annotations:
        summary: "RabbitMQ is down"
        description: "RabbitMQ message broker is not responding"

    - alert: RabbitMQHighQueueLength
      expr: rabbitmq_queue_messages_ready > 1000
      for: 5m
      labels:
        severity: warning
        service: messaging
      annotations:
        summary: "High queue length in RabbitMQ"
        description: "Queue {{ $labels.queue }} has {{ $value }} messages ready"

    # Service Alerts
    - alert: ServiceDown
      expr: up{job=~"album-service|auth-service|file-service|finance-service|group-service|payment-service|relationship-service|public-service"} == 0
      for: 1m
      labels:
        severity: critical
        service: application
      annotations:
        summary: "Service {{ $labels.job }} is down"
        description: "Service {{ $labels.job }} has been down for more than 1 minute"

    - alert: ServiceHighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
        service: application
      annotations:
        summary: "High error rate in {{ $labels.service }}"
        description: "Service {{ $labels.service }} has {{ $value }}% error rate"

    - alert: ServiceHighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
      for: 5m
      labels:
        severity: warning
        service: application
      annotations:
        summary: "High latency in {{ $labels.service }}"
        description: "95th percentile latency is {{ $value }}s for {{ $labels.service }}"

    # Storage Alerts
    - alert: MinIODown
      expr: up{job="minio"} == 0
      for: 1m
      labels:
        severity: critical
        service: storage
      annotations:
        summary: "MinIO is down"
        description: "MinIO object storage is not responding"

    # Monitoring Alerts
    - alert: PrometheusDown
      expr: up{job="prometheus"} == 0
      for: 1m
      labels:
        severity: critical
        service: monitoring
      annotations:
        summary: "Prometheus is down"
        description: "Prometheus monitoring is not responding"

    - alert: AlertmanagerDown
      expr: up{job="alertmanager"} == 0
      for: 1m
      labels:
        severity: critical
        service: monitoring
      annotations:
        summary: "Alertmanager is down"
        description: "Alertmanager is not responding"

    - alert: GrafanaDown
      expr: up{job="grafana"} == 0
      for: 5m
      labels:
        severity: warning
        service: monitoring
      annotations:
        summary: "Grafana is down"
        description: "Grafana dashboard is not responding"

    # Logging Alerts
    - alert: ElasticsearchDown
      expr: up{job="elasticsearch"} == 0
      for: 1m
      labels:
        severity: critical
        service: logging
      annotations:
        summary: "Elasticsearch is down"
        description: "Elasticsearch logging is not responding"

    - alert: ElasticsearchHighCPU
      expr: elasticsearch_process_cpu_percent > 90
      for: 5m
      labels:
        severity: warning
        service: logging
      annotations:
        summary: "High Elasticsearch CPU usage"
        description: "Elasticsearch CPU usage is {{ $value }}%"

    # Security/Service Mesh Alerts
    - alert: ConsulDown
      expr: consul_up == 0
      for: 1m
      labels:
        severity: critical
        service: service-discovery
      annotations:
        summary: "Consul is down"
        description: "Consul service discovery is not responding"

    - alert: VaultDown
      expr: up{job="vault"} == 0
      for: 1m
      labels:
        severity: critical
        service: secrets
      annotations:
        summary: "Vault is down"
        description: "Vault secrets management is not responding"

    # Network Alerts
    - alert: HighNetworkTraffic
      expr: rate(node_network_receive_bytes_total[5m]) > 100000000
      for: 5m
      labels:
        severity: info
        service: infrastructure
        component: network
      annotations:
        summary: "High network traffic on {{ $labels.instance }}"
        description: "Network receive rate is {{ $value }} bytes/sec on {{ $labels.instance }}"

    # Backup Alerts
    - alert: BackupFailed
      expr: backup_recent_success == 0
      for: 1h
      labels:
        severity: critical
        service: backup
        component: monitoring
      annotations:
        summary: "Backup system failure"
        description: "No successful backup in the last 24 hours"

    - alert: BackupRepositoryUnhealthy
      expr: backup_repository_health == 0
      for: 5m
      labels:
        severity: critical
        service: backup
        component: repository
      annotations:
        summary: "Backup repository unhealthy"
        description: "Backup repository integrity check failed"

    - alert: BackupTooOld
      expr: backup_age_hours > 48
      for: 5m
      labels:
        severity: critical
        service: backup
        component: freshness
      annotations:
        summary: "Backup too old"
        description: "Last successful backup was {{ $value }} hours ago"

    - alert: BackupDiskSpaceLow
      expr: backup_disk_usage_percent > 90
      for: 5m
      labels:
        severity: warning
        service: backup
        component: storage
      annotations:
        summary: "Backup disk space low"
        description: "Backup disk usage is {{ $value }}%"

    - alert: BackupMetricsExporterDown
      expr: up{job="backup-metrics"} == 0
      for: 5m
      labels:
        severity: warning
        service: backup
        component: monitoring
      annotations:
        summary: "Backup metrics exporter down"
        description: "Backup metrics exporter is not responding"