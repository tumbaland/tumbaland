services:
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: tumbaland-rabbitmq
    restart: unless-stopped
    init: true
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
      - "15692:15692" # Prometheus metrics port
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=tumbaland
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_config:/etc/rabbitmq
    tmpfs:
      - /var/log/rabbitmq  # Use tmpfs for logs to avoid permission issues
    networks:
      - tumbanet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  tumbanet:
    external: true

volumes:
  rabbitmq_data:
    driver: local
  rabbitmq_config:
    driver: local