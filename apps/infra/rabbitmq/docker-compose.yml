services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: tumbaland-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
      - "15692:15692" # Prometheus metrics port
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-secure_password_123}
      - RABBITMQ_DEFAULT_VHOST=tumbaland
      # Enable Prometheus plugin
      - RABBITMQ_PLUGINS_DIR=/opt/rabbitmq/plugins
      - RABBITMQ_ENABLED_PLUGINS_FILE=/etc/rabbitmq/enabled_plugins
    volumes:
      - ./data:/var/lib/rabbitmq
      - ./logs:/var/log/rabbitmq
      - ./conf:/etc/rabbitmq
      # Enable Prometheus plugin
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - tumbanet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  tumbanet:
    external: true