openapi: 3.0.3
info:
  title: Finance Asset Tracking API
  description: |
    A comprehensive API for tracking financial assets and portfolio management.
    This API allows you to create, read, update, and delete assets, as well as get portfolio
    statistics and performance analytics.
    
    ## Features
    - Full CRUD operations for assets
    - Portfolio summary and analytics
    - Performance tracking and top performers
    - Date range filtering
    - Recent assets tracking
    - Bulk price updates
    
    ## Asset Structure
    Each asset contains:
    - **Name**: Asset name/symbol
    - **Quantity**: Number of shares/units owned
    - **Buy Price**: Price at which the asset was purchased
    - **Current Price**: Current market price
    - **Date**: Date of purchase/entry
      
  version: 1.0.0
  contact:
    name: Tumbaland Development Team
    email: dev@tumbaland.com
  license:
    name: ISC
    
servers:
  - url: http://localhost:4001
    description: Development server
  - url: https://api.tumbaland.com
    description: Production server (when deployed)

paths:
  /health:
    get:
      summary: Health Check
      description: Check if the API service is running and connected to MongoDB
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "finance-back"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-25T10:30:00.000Z"
                  mongodb:
                    type: string
                    example: "connected"

  /api/assets:
    get:
      summary: Get Assets
      description: |
        Retrieve a paginated list of assets with optional filtering by name,
        date range, and pagination parameters.
      tags:
        - Assets
      parameters:
        - name: name
          in: query
          description: Filter by asset name (case-insensitive search)
          required: false
          schema:
            type: string
          example: "Apple"
        - name: startDate
          in: query
          description: Filter assets from this date (inclusive)
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: endDate
          in: query
          description: Filter assets until this date (inclusive)
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-31"
        - name: page
          in: query
          description: Page number for pagination (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Number of assets per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: List of assets with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      assets:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asset'
                      total:
                        type: integer
                        description: Total number of assets matching the filter
                        example: 25
                      page:
                        type: integer
                        description: Current page number
                        example: 1
                      totalPages:
                        type: integer
                        description: Total number of pages
                        example: 2
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create Asset
      description: Create a new asset with name, quantity, prices, and date
      tags:
        - Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
            examples:
              stock_example:
                summary: Stock Investment Example
                value:
                  name: "Apple Inc. (AAPL)"
                  quantity: 10
                  buyPrice: 150.00
                  currentPrice: 175.50
                  date: "2024-01-25"
              crypto_example:
                summary: Cryptocurrency Example
                value:
                  name: "Bitcoin (BTC)"
                  quantity: 0.5
                  buyPrice: 45000.00
                  currentPrice: 52000.00
                  date: "2024-01-24"
      responses:
        '201':
          description: Asset created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/{id}:
    get:
      summary: Get Asset by ID
      description: Retrieve a specific asset by its unique identifier
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update Asset
      description: Update an existing asset by its ID
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
            example:
              name: "Apple Inc. (AAPL)"
              quantity: 15
              currentPrice: 180.25
      responses:
        '200':
          description: Asset updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete Asset
      description: Delete an asset by its ID
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Asset deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Asset deleted successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/recent:
    get:
      summary: Get Recent Assets
      description: Get the most recently created assets
      tags:
        - Assets
      parameters:
        - name: limit
          in: query
          description: Number of recent assets to retrieve
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10
      responses:
        '200':
          description: List of recent assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/portfolio-summary:
    get:
      summary: Get Portfolio Summary
      description: Get comprehensive portfolio statistics including total values and P&L
      tags:
        - Analytics
      responses:
        '200':
          description: Portfolio summary statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalAssets:
                        type: integer
                        description: Total number of assets in portfolio
                        example: 10
                      totalBuyValue:
                        type: number
                        description: Total amount invested (quantity × buyPrice for all assets)
                        example: 25000.00
                      totalCurrentValue:
                        type: number
                        description: Current portfolio value (quantity × currentPrice for all assets)
                        example: 28500.00
                      totalProfitLoss:
                        type: number
                        description: Total profit or loss (currentValue - buyValue)
                        example: 3500.00
                      profitLossPercentage:
                        type: number
                        description: Portfolio performance percentage
                        example: 14.0
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/date-range:
    get:
      summary: Get Assets by Date Range
      description: Retrieve assets within a specific date range
      tags:
        - Assets
      parameters:
        - name: startDate
          in: query
          required: true
          description: Start date for the range (inclusive)
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: endDate
          in: query
          required: true
          description: End date for the range (inclusive)
          schema:
            type: string
            format: date
          example: "2024-01-31"
      responses:
        '200':
          description: Assets within the specified date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
        '400':
          description: Missing or invalid date parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_dates:
                  summary: Missing Date Parameters
                  value:
                    error: "Both startDate and endDate are required"
                invalid_range:
                  summary: Invalid Date Range
                  value:
                    error: "startDate must be before endDate"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/top-performers:
    get:
      summary: Get Top Performing Assets
      description: Get assets sorted by performance (profit/loss percentage)
      tags:
        - Analytics
      parameters:
        - name: limit
          in: query
          description: Number of top performers to retrieve
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          example: 5
      responses:
        '200':
          description: Top performing assets by percentage gain
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Asset'
                        - type: object
                          properties:
                            profitLossPercentage:
                              type: number
                              description: Calculated profit/loss percentage for this asset
                              example: 17.5
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/update-prices:
    put:
      summary: Update Current Prices (Bulk)
      description: Update current prices for multiple assets in a single request
      tags:
        - Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priceUpdates:
                  type: array
                  description: Array of price updates
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Asset ID
                        example: "507f1f77bcf86cd799439011"
                      currentPrice:
                        type: number
                        minimum: 0
                        description: New current price
                        example: 185.50
                    required:
                      - id
                      - currentPrice
              required:
                - priceUpdates
            example:
              priceUpdates:
                - id: "507f1f77bcf86cd799439011"
                  currentPrice: 185.50
                - id: "507f1f77bcf86cd799439012"
                  currentPrice: 335.75
      responses:
        '200':
          description: Prices updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updatedCount:
                        type: integer
                        description: Number of assets successfully updated
                        example: 2
                      totalUpdates:
                        type: integer
                        description: Total number of updates requested
                        example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Asset:
      type: object
      description: A financial asset record
      properties:
        _id:
          type: string
          description: Unique identifier (MongoDB ObjectId)
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          maxLength: 100
          description: Name or symbol of the asset
          example: "Apple Inc. (AAPL)"
        quantity:
          type: number
          minimum: 0
          description: Number of shares/units owned
          example: 10
        buyPrice:
          type: number
          minimum: 0
          description: Price at which the asset was purchased
          example: 150.00
        currentPrice:
          type: number
          minimum: 0
          description: Current market price of the asset
          example: 175.50
        date:
          type: string
          format: date-time
          description: Date when the asset was purchased
          example: "2024-01-25T00:00:00.000Z"
        totalBuyValue:
          type: number
          description: Total amount invested (quantity × buyPrice)
          example: 1500.00
        totalCurrentValue:
          type: number
          description: Current total value (quantity × currentPrice)
          example: 1755.00
        profitLoss:
          type: number
          description: Profit or loss (totalCurrentValue - totalBuyValue)
          example: 255.00
        profitLossPercentage:
          type: number
          description: Profit or loss percentage
          example: 17.0
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created
          example: "2024-01-25T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was last updated
          example: "2024-01-25T10:30:00.000Z"
      required:
        - _id
        - name
        - quantity
        - buyPrice
        - currentPrice
        - date
        - createdAt
        - updatedAt

    CreateAssetRequest:
      type: object
      description: Request payload for creating a new asset
      properties:
        name:
          type: string
          maxLength: 100
          description: Name or symbol of the asset
          example: "Apple Inc. (AAPL)"
        quantity:
          type: number
          minimum: 0
          description: Number of shares/units owned
          example: 10
        buyPrice:
          type: number
          minimum: 0
          description: Price at which the asset was purchased
          example: 150.00
        currentPrice:
          type: number
          minimum: 0
          description: Current market price of the asset
          example: 175.50
        date:
          type: string
          format: date
          description: Date when the asset was purchased (YYYY-MM-DD)
          example: "2024-01-25"
      required:
        - name
        - quantity
        - buyPrice
        - currentPrice
        - date

    UpdateAssetRequest:
      type: object
      description: Request payload for updating an existing asset
      properties:
        name:
          type: string
          maxLength: 100
          description: Name or symbol of the asset
          example: "Apple Inc. (AAPL)"
        quantity:
          type: number
          minimum: 0
          description: Number of shares/units owned
          example: 15
        buyPrice:
          type: number
          minimum: 0
          description: Price at which the asset was purchased
          example: 150.00
        currentPrice:
          type: number
          minimum: 0
          description: Current market price of the asset
          example: 180.25
        date:
          type: string
          format: date
          description: Date when the asset was purchased (YYYY-MM-DD)
          example: "2024-01-25"

    Error:
      type: object
      description: Error response format
      properties:
        error:
          type: string
          description: Error message
          example: "Validation failed"
        message:
          type: string
          description: Detailed error description
          example: "Missing required fields: name, quantity, buyPrice, currentPrice, and date are required"
      required:
        - error

  responses:
    BadRequest:
      description: Bad request - validation failed or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_fields:
              summary: Missing Required Fields
              value:
                error: "Missing required fields: name, quantity, buyPrice, currentPrice, and date are required"
            negative_values:
              summary: Negative Values
              value:
                error: "Quantity, buyPrice, and currentPrice must be positive numbers"
            invalid_date:
              summary: Invalid Date Format
              value:
                error: "Invalid date format. Use YYYY-MM-DD"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Asset not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"

  parameters:
    AssetId:
      name: id
      in: path
      required: true
      description: Unique identifier of the asset (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      example: "507f1f77bcf86cd799439011"

tags:
  - name: Health
    description: Service health and status endpoints
  - name: Assets
    description: CRUD operations for financial assets
  - name: Analytics
    description: Portfolio analytics and performance metrics
