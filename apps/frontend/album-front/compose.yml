services:
  # Frontend apps
  album-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ALBUM_API_URL: ${VITE_ALBUM_API_URL}
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}
        VITE_AUTH_FRONT_URL: ${VITE_AUTH_FRONT_URL}
        NODE_ENV: production
    image: toomastahves/album-front:latest
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
