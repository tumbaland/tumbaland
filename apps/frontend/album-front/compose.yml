services:
  # Frontend apps
  album-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/tumbaland-album-front:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ALBUM_API_URL: ${ALBUM_API_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_FRONT_URL: ${AUTH_FRONT_URL}
      ALBUM_FRONT_URL: ${ALBUM_FRONT_URL}
      GROUP_API_URL: ${GROUP_API_URL}
      ACCOUNT_FRONT_URL: ${ACCOUNT_FRONT_URL}
      SHELL_FRONT_URL: ${SHELL_FRONT_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      # Feeds the storage meter on the dashboard (GET /api/subscriptions/me/entitlements).
      PAYMENT_API_URL: ${PAYMENT_API_URL}
    ports:
      - '3002:80'
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
