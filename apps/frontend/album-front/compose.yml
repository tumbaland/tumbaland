services:
  # Frontend apps
  album-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/album-front:latest
    restart: unless-stopped
    environment:
      - ALBUM_API_URL=${VITE_ALBUM_API_URL}
      - AUTH_SERVICE_URL=${VITE_AUTH_SERVICE_URL}
      - AUTH_FRONT_URL=${VITE_AUTH_FRONT_URL}
      - ALBUM_FRONT_URL=${VITE_ALBUM_URL}
      - FILE_API_URL=${VITE_FILE_API_URL}
      - SEGMENTATION_API_URL=${VITE_SEGMENTATION_API_URL}
      - OBJECT_DETECTION_API_URL=${VITE_OBJECT_DETECTION_API_URL}
    ports:
      - '3002:80'
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
