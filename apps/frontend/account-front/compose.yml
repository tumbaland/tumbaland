services:
  # Frontend apps
  account-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/account-front:latest
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_FRONT_URL: ${AUTH_FRONT_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - '3007:80'
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
