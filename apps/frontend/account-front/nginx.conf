server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check endpoint
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"account-front","type":"frontend","timestamp":"$time_iso8601","version":"1.0.0","description":"Account management frontend service"}';
  }

  # Serve index.html with no cache
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }

  # The module-federation entry point. Never cached: unlike every other asset
  # its name carries no content hash, and it is the file that tells shell-front
  # which hashed chunks this build has. Cached, the shell would keep asking for
  # the previous deploy's chunks until the year ran out.
  location = /remoteEntry.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Serve static assets with long cache (assuming filenames are hashed).
  # CORS because shell-front imports these from its own origin: a module script
  # fetched cross-origin without it is blocked, which is the whole app failing
  # to load rather than one request failing.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Serve config.json with no cache
  location = /config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
