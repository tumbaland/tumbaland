services:
  # Frontend apps
  admin-front:
    build:
      # The repository root: images install from the root lockfile.
      context: ../../..
      dockerfile: docker/Dockerfile.front
      args:
        APP: admin-front
    image: toomastahves/tumbaland-admin-front:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ADMIN_API_URL: ${ADMIN_API_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_FRONT_URL: ${AUTH_FRONT_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      SHELL_FRONT_URL: ${SHELL_FRONT_URL}
    ports:
      - '3009:80'
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
