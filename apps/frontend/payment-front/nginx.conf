server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /config.json {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
    add_header 'Access-Control-Allow-Headers' '*';
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
