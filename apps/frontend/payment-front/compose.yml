services:
  payment-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/payment-front:latest
    restart: unless-stopped
    environment:
      - PAYMENT_API_URL=${VITE_PAYMENT_API_URL}
      - AUTH_SERVICE_URL=${VITE_AUTH_SERVICE_URL}
      - AUTH_FRONT_URL=${VITE_AUTH_FRONT_URL}
    ports:
      - '3010:80'
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
