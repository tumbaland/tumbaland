services:
  shell-front:
    build:
      # The repository root: images install from the root lockfile.
      context: ../../..
      dockerfile: docker/Dockerfile.front
      args:
        APP: shell-front
        NGINX_IMAGE: nginx:1.26-alpine
    image: toomastahves/tumbaland-shell-front:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ALBUM_FRONT_URL: ${ALBUM_FRONT_URL}
      FINANCE_FRONT_URL: ${FINANCE_FRONT_URL}
      RELATIONSHIP_FRONT_URL: ${RELATIONSHIP_FRONT_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      GROUP_API_URL: ${GROUP_API_URL}
      ALBUM_API_URL: ${ALBUM_API_URL}
      RELATIONSHIP_API_URL: ${RELATIONSHIP_API_URL}
      PAYMENT_API_URL: ${PAYMENT_API_URL}
      PAYMENT_FRONT_URL: ${PAYMENT_FRONT_URL}
      GROUP_FRONT_URL: ${GROUP_FRONT_URL}
      CHAT_FRONT_URL: ${CHAT_FRONT_URL}
      CHAT_API_URL: ${CHAT_API_URL}
      # Public by design: handed to the browser to subscribe with.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ACCOUNT_FRONT_URL: ${ACCOUNT_FRONT_URL}
      ADMIN_FRONT_URL: ${ADMIN_FRONT_URL}
      AUTH_FRONT_URL: ${AUTH_FRONT_URL}
    ports:
      - '3000:80'
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
