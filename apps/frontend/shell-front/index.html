<!doctype html>
<html lang="en">
  <head>
    <!-- Sets light or dark before the first paint, from the same key the app's
         theme provider keeps it under, so a dark page never flashes white. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('tumbaland-mode') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-color-scheme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: capping it blocks pinch-zoom, which fails WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!--
      Installable app ("Add to Home Screen"). Android reads the manifest; iOS
      ignores most of it and reads the apple-* tags and apple-touch-icon instead.
      The icons are rendered from public/app-icon.svg.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tumbaland" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Pacifico&display=swap" />

    <!-- Search -->
    <title>Tumbaland: a private place for the two of you</title>
    <meta
      name="description"
      content="Talk, keep your photos and remember what you did together. Your assistant can keep the journal for you. Free, no card, private until you share."
    />
    <link rel="canonical" href="https://tumbaland.eu/" />
    <meta name="theme-color" content="#fdf2fa" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph: what a shared link looks like in Slack, WhatsApp, Discord, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tumbaland" />
    <meta property="og:url" content="https://tumbaland.eu/" />
    <meta property="og:locale" content="en" />
    <meta
      property="og:title"
      content="Tumbaland: a private place for the two of you"
    />
    <meta
      property="og:description"
      content="Talk, keep your photos and remember what you did together. Your assistant can keep the journal for you. Free, no card, private until you share."
    />
    <meta property="og:image" content="https://tumbaland.eu/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Tumbaland home screen, with cards for Album, Finance, Relationship and Groups" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tumbaland: a private place for the two of you" />
    <meta
      name="twitter:description"
      content="Talk, keep your photos and remember what you did together. Your assistant can keep the journal for you. Free, no card, private until you share."
    />
    <meta name="twitter:image" content="https://tumbaland.eu/og-image.jpg" />
    <meta name="twitter:image:alt" content="The Tumbaland home screen, with cards for Album, Finance, Relationship and Groups" />
  </head>
  <body>
    <div id="public-root"></div>
    <!--
      The app renders client-side, so the initial HTML body is otherwise empty.
      Googlebot executes JS and will see the real page, but crawlers and preview
      bots that don't execute JS need something to read. Kept outside #public-root so React
      never has to clear it and users never see it flash.
    -->
    <noscript>
      <h1>Tumbaland: a private place for the two of you</h1>
      <p>
        Talk, keep your photos and remember what you did together. Private until you share it.
      </p>
      <h2>What you get</h2>
      <ul>
        <li><strong>Chat</strong>: messages, photos and videos, with photos saved to the album you pick.</li>
        <li><strong>Album</strong>: your photos and videos in albums, with collages and "on this day".</li>
        <li><strong>Journal</strong>: what you did and where, on a calendar and a map.</li>
        <li><strong>Your assistant</strong>: connect Claude or any MCP client and just tell it what happened.</li>
      </ul>
      <h2>Price</h2>
      <p>
        Tumbaland is free, with no expiry and no card. It needs JavaScript enabled to sign in.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
