<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: capping it blocks pinch-zoom, which fails WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Pacifico&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <!-- Search -->
    <title>Tumbaland — Photos, money, and time in one private place</title>
    <meta
      name="description"
      content="Albums that tag themselves, net worth that updates itself, and a journal of where your days went. Free tier with no expiry, no card, private until you share."
    />
    <link rel="canonical" href="https://tumbaland.eu/" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph: what a shared link looks like in Slack, WhatsApp, Discord, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tumbaland" />
    <meta property="og:url" content="https://tumbaland.eu/" />
    <meta property="og:locale" content="en" />
    <meta
      property="og:title"
      content="Tumbaland — Photos, money, and time in one private place"
    />
    <meta
      property="og:description"
      content="Albums that tag themselves, net worth that updates itself, and a journal of where your days went. Free tier with no expiry, no card, private until you share."
    />
    <meta property="og:image" content="https://tumbaland.eu/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Tumbaland home screen, with cards for Album, Finance, Relationship and Groups" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tumbaland — Photos, money, and time in one private place" />
    <meta
      name="twitter:description"
      content="Albums that tag themselves, net worth that updates itself, and a journal of where your days went. Free tier with no expiry, no card."
    />
    <meta name="twitter:image" content="https://tumbaland.eu/og-image.jpg" />
    <meta name="twitter:image:alt" content="The Tumbaland home screen, with cards for Album, Finance, Relationship and Groups" />
  </head>
  <body>
    <div id="public-root"></div>
    <!--
      The app renders client-side, so the initial HTML body is otherwise empty.
      Googlebot executes JS and will see the real page, but crawlers and preview
      bots that don't execute JS need something to read. Kept outside #public-root so React
      never has to clear it and users never see it flash.
    -->
    <noscript>
      <h1>Tumbaland — photos, money, and time in one private place</h1>
      <p>
        Albums that tag themselves, net worth that updates itself, and a journal that remembers
        where your days went. Keep it for yourself, or share it with your household.
      </p>
      <h2>What you get</h2>
      <ul>
        <li><strong>Album</strong> — photos you can actually find, with AI tagging and a collage editor.</li>
        <li><strong>Finance</strong> — net worth over time, holdings and trades, and statement import.</li>
        <li><strong>Relationship</strong> — journal entries with maps, heatmaps and monthly totals.</li>
        <li><strong>Groups</strong> — share an album, a budget or a journal with up to five people.</li>
      </ul>
      <h2>Pricing</h2>
      <p>
        Free tier with no expiry and no card. Personal is €6 a month, Family €12 a month for up to
        five people. Tumbaland needs JavaScript enabled to sign in.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
