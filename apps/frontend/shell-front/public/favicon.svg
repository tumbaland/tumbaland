<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="64" height="64">
  <!-- The browser-tab icon: app-icon.svg in a rounded square, since a tab shows it
       unmasked, with the hearts a little larger to read at 16px. Copied as-is into
       every frontend's public/. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff1fae" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <path id="heart" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"
      d="M256 400C220 370 128 304 128 212C128 160 164 126 208 126C232 126 248 138 256 156C264 138 280 126 304 126C348 126 384 160 384 212C384 304 292 370 256 400Z" />
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <g transform="translate(256 256) scale(1.14) translate(-256 -256)">
    <use href="#heart" opacity="0.6" transform="translate(214 268) rotate(-10) scale(0.8) translate(-256 -263)" />
    <use href="#heart" transform="translate(302 246) rotate(8) scale(0.8) translate(-256 -263)" />
  </g>
</svg>
