server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check endpoint
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"shell-front","type":"frontend","timestamp":"$time_iso8601","version":"1.0.0","description":"Main application shell"}';
  }

  # Serve index.html with no cache
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }

  # The service worker. Needs its own block *above* the hashed-asset rule
  # below, which matches every .js and would otherwise serve this with
  # `max-age=31536000, immutable` -- pinning the worker on every installed
  # phone for a year, with no way to push a fix. Its name carries no content
  # hash, so it can never take that cache.
  #
  # `Service-Worker-Allowed: /` lets the worker claim the whole origin even
  # though it is served from the root; kept explicit so moving the file later
  # does not silently narrow its scope.
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  # Serve static assets with long cache (assuming filenames are hashed)
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Crawler files must be served from disk as plain text. Without these two
  # blocks the SPA fallback below answers them with index.html, which is how
  # /robots.txt ended up being served as an HTML document.
  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # The install manifest has a fixed name, so it cannot take the immutable
  # cache the hashed assets get, and it needs its own type: older mime.types
  # files don't list .webmanifest.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Serve config.json with no cache
  location = /config.json {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
