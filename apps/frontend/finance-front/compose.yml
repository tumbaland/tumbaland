services:
  finance-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/finance-front:latest
    restart: unless-stopped
    environment:
      FINANCE_API_URL: ${VITE_FINANCE_API_URL}
      AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}
      AUTH_FRONT_URL: ${VITE_AUTH_FRONT_URL}
      GROUP_API_URL: ${VITE_GROUP_API_URL}
    ports:
      - '3003:80'
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
