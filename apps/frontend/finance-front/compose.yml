services:
  finance-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FINANCE_API_URL: ${VITE_FINANCE_API_URL}
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}
        VITE_AUTH_FRONT_URL: ${VITE_AUTH_FRONT_URL}
        NODE_ENV: production
    image: finance-front:latest
    restart: unless-stopped
    ports:
      - "3003:80"
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
