services:
  auth-front:
    build:
      # The repository root: images install from the root lockfile.
      context: ../../..
      dockerfile: docker/Dockerfile.front
      args:
        APP: auth-front
    image: toomastahves/tumbaland-auth-front:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - '3004:80'
    init: true
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
