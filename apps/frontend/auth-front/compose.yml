services:
  auth-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/auth-front:latest
    restart: unless-stopped
    environment:
      - GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - AUTH_SERVICE_URL=${VITE_AUTH_SERVICE_URL}
    ports:
      - '3004:80'
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
