services:
  group-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/group-front:latest
    restart: unless-stopped
    environment:
      - GROUP_API_URL=${VITE_GROUP_API_URL}
      - AUTH_SERVICE_URL=${VITE_AUTH_SERVICE_URL}
      - AUTH_FRONT_URL=${VITE_AUTH_FRONT_URL}
    ports:
      - '3011:80'
    networks:
      - tumbanet

networks:
  tumbanet:
    external: true
