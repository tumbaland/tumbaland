<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f06292;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" stroke="#e91e63" stroke-width="2"/>
  
  <!-- Two overlapping hearts representing a couple -->
  <!-- Left heart (slightly behind) -->
  <path d="M20 26c0-4 3-7 7-7s7 3 7 7c0 7-7 14-7 14s-7-7-7-14z" fill="url(#heartGradient)" opacity="0.8"/>
  
  <!-- Right heart (slightly in front) -->
  <path d="M30 22c0-4 3-7 7-7s7 3 7 7c0 7-7 14-7 14s-7-7-7-14z" fill="url(#heartGradient)"/>
  
  <!-- Small sparkles around the hearts -->
  <circle cx="18" cy="20" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="46" cy="18" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="20" cy="42" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="44" cy="40" r="1.5" fill="#ffffff" opacity="0.9"/>
  
  <!-- Cute little plus signs for extra sparkle -->
  <text x="16" y="16" font-family="Arial" font-size="8" fill="#ffffff" opacity="0.6">+</text>
  <text x="48" y="48" font-family="Arial" font-size="6" fill="#ffffff" opacity="0.5">+</text>
</svg>
